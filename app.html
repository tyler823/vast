function Reports({ company, session }) {
  const today = new Date();
  const years = React.useMemo(() => rptYears(company), [company]);
  const [year, setYear] = useState(today.getFullYear());
  const [q, setQ] = useState(rptQuarterOf(today)); // 0 = full year
  const r = React.useMemo(() => rptCompute(company, year, q), [company, year, q]);
  const companyName = company.name || (session && session.companyName) || "Company";
  const p = r.period;
  const through = r.isCurrent ? ` · through week ${r.weekNow} / through today` : r.isFuture ? " · not started yet" : "";
  const [exporting, setExporting] = useState(false);
  const [exportError, setExportError] = useState("");
  const exportExcel = async () => {
    if (exporting) return;
    setExporting(true); setExportError("");
    try {
      const XLSX = await rptLoadSheetJS();
      const wb = rptWorkbook(XLSX, company, r, companyName);
      const safe = (x) => String(x).replace(/[^A-Za-z0-9 ._()&,'-]+/g, "-").trim();
      XLSX.writeFile(wb, `VAST report - ${safe(companyName)} - ${safe(p.label)}.xlsx`);
    } catch (e) {
      console.warn("[VAST] Excel export failed:", e);
      setExportError((e && e.message) || "Excel export failed. Please try again.");
    } finally { setExporting(false); }
  };
  const actions = (
    <div className="rpt-noprint" style={{ display: "flex", gap: 8, flexWrap: "wrap", justifyContent: "flex-end" }}>
      <button className="btn-secondary" onClick={() => window.print()}>Print / Save as PDF</button>
      <button className="btn-primary" onClick={exportExcel} disabled={exporting}>{exporting ? "Preparing…" : "Export to Excel"}</button>
    </div>
  );
  return (
    <Layout title="Reports" subtitle={`${companyName} · ${p.label}`} action={actions}>
      <style>{rptCss()}</style>
      <div className="rpt-root">
        <div className="rpt-print-head"><div className="rpt-ph-title">VAST report — {companyName}</div></div>
        {exportError && <div className="rpt-note rpt-noprint" role="alert" style={{ color: rptVar("red") }}>{exportError}</div>}
        <div className="rpt-picker rpt-noprint">
          <label>Year
            <select value={year} onChange={e => setYear(Number(e.target.value))} aria-label="Report year">
              {years.map(y => <option key={y} value={y}>{y}</option>)}
            </select>
          </label>
          <label>Period
            <select value={q} onChange={e => setQ(Number(e.target.value))} aria-label="Report period">
              {[1, 2, 3, 4].map(n => <option key={n} value={n}>Q{n}</option>)}
              <option value={0}>Full year</option>
            </select>
          </label>
        </div>
        <div className="rpt-period"><b className="rpt-strong" style={{ color: rptVar("text") }}>{p.label}</b> · <span className="num">{rptFmtDate(p.start)} – {rptFmtDate(p.end)}</span>{through}</div>
        <RptSummary r={r} />
        <RptScorecard r={r} />
        <RptTasks r={r} />
        <RptTodos r={r} />
        <RptHuddles r={r} />
        <RptHeadlinesIssues r={r} />
        {!q && <RptYear r={r} company={company} />}
        <div className="rpt-print-footer" aria-hidden="true"><span>{companyName}</span><span>{p.label} report</span><span>Printed {rptFmtDate(new Date())}</span></div>
      </div>
    </Layout>
  );
}

        <div className="md-detail-col panel">
          <div className="panel-h">
            <div style={{ display: "flex", alignItems: "baseline", gap: 12, flexWrap: "wrap" }}>
              <button className="btn-ghost md-back" onClick={() => setMobileOpen(false)}><Icon.arrowLeft /> Back</button>
              <h3>{sel.quarter}</h3>
              {sel.quarterStart && sel.quarterEnd && <span className="num" style={{ color: C.textMuted, fontSize: C.fs.sm }}>{dateStr(new Date(sel.quarterStart + "T00:00:00"))} – {dateStr(new Date(sel.quarterEnd + "T00:00:00"))}</span>}
            </div>
            <div className="strip" style={{ padding: 0 }}>
              <span><b>{tasks.length}</b>tasks</span>
              <span><b>{todos.length}</b>to-dos</span>
              <span><b style={{ color: C.green }}>{solved.length}</b>solved</span>
              <span><b style={{ color: avgRating === "—" ? C.text : rColor(avgRating) }}>{avgRating}</b>avg rating</span>
            </div>
          </div>
          <div className="panel-b">
            <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(min(420px,100%),1fr))", gap: "16px 24px" }}>
              <div>
                <h4 className="sec-title">Quarterly tasks</h4>
                {tasks.length === 0 ? <div className="lempty" style={{ padding: "4px 0" }}>No tasks recorded.</div> : (
                  <div className="dt-wrap"><table className="dt">
                    <thead><tr><th>Task</th><th>Assigned to</th><th>Final status</th></tr></thead>
                    <tbody>{tasks.map((t, i) => <tr key={i}><td>{t.title}</td><td className="muted">{t.who || "—"}</td><td>{statusTag(t.status)}</td></tr>)}</tbody>
                  </table></div>
                )}
              </div>
              <div>
                <h4 className="sec-title">To-dos</h4>
                {todos.length === 0 ? <div className="lempty" style={{ padding: "4px 0" }}>No to-dos recorded.</div> : (
                  <div className="dt-wrap"><table className="dt">
                    <thead><tr><th>To-do</th><th>Assigned to</th><th>Status</th></tr></thead>
                    <tbody>{todos.map((t, i) => <tr key={i}><td>{t.title}</td><td className="muted">{t.assignee || "—"}</td><td><span className={t.done ? "tag-done" : "tag-off"}>{t.done ? "Done" : "Incomplete"}</span></td></tr>)}</tbody>
                  </table></div>
                )}
              </div>
              <div>
                <h4 className="sec-title">Problems solved</h4>
                {solved.length === 0 ? <div className="lempty" style={{ padding: "4px 0" }}>No problems marked solved this quarter.</div> : (
                  <div className="dt-wrap"><table className="dt">
                    <thead><tr><th>Problem</th><th>Source</th><th>Notes</th><th className="r">Solved</th></tr></thead>
                    <tbody>{solved.map((x, i) => <tr key={i}><td style={{ fontWeight: 600 }}>{x.title}</td><td className="muted">{x.sourceLabel || "—"}</td><td className="muted" style={{ fontSize: C.fs.sm }}>{x.notes || "—"}</td><td className="r num muted" style={{ whiteSpace: "nowrap" }}>{x.solvedAt ? dateStr(new Date(x.solvedAt)) : "—"}</td></tr>)}</tbody>
                  </table></div>
                )}
              </div>
              {sel.meetingRatings?.length > 0 && (
                <div>
                  <h4 className="sec-title">Meeting ratings this quarter</h4>
                  <div className="dt-wrap"><table className="dt" style={{ width: "auto", minWidth: 280 }}>
                    <thead><tr><th>Date</th><th className="r">Rating</th></tr></thead>
                    <tbody>{sel.meetingRatings.map((r, i) => <tr key={i}><td className="num muted">{dateStr(new Date(r.date))}</td><td className="r num" style={{ fontWeight: 600, color: rColor(r.rating) }}>{r.rating}/10</td></tr>)}</tbody>
                  </table></div>
                </div>
              )}
            </div>
          </div>
        </div>
      </div>
    </Layout>
  );
}

// ─── STYLE INJECTOR ──────────────────────────────────────────────────
function GlobalStyles({ theme }) {
  useEffect(() => {
    const id = "vast-global-styles";
    let el = document.getElementById(id);
    if (!el) {
      el = document.createElement("style");
      el.id = id;
      document.head.appendChild(el);
    }
    el.textContent = makeSTYLE(C);
    document.body.style.background = C.bg;
    document.body.style.color = C.text;
  }, [theme]);
  return null;
}

// ─── MAIN APP ─────────────────────────────────────────────────────────
function VASTApp() {
  const [company, setCompanyState] = useState(null);
  const [view, setView] = useState("dashboard");
  const [mobileOpen, setMobileOpen] = useState(false);
  const [theme, setTheme] = useState(() => localStorage.getItem("vast-theme") || "light");
  const [sidebarCollapsed, setSidebarCollapsed] = useState(() => localStorage.getItem("vast-sidebar-collapsed") === "1");

  // Reassign global C before every render so all children pick up current theme
  C = theme === "light" ? LIGHT_THEME : DARK_THEME;

  const toggleTheme = () => {
    const next = theme === "dark" ? "light" : "dark";
    localStorage.setItem("vast-theme", next);   // personal preference — stays on this device
    setTheme(next);
  };

  const [session, setSession] = useState(null);          // vast-session payload: { companyId, companyName, me, members, entitlement, cortexAccountUrl }
  const me = session ? session.me : null;
  // Holds the Cortex companyId (name kept from the invite-code era — it is the
  // RTDB key under vast/companies/ and the value of company.code).
  const [currentCompanyCode, setCurrentCompanyCode] = useState(null);
  const [appState, setAppState] = useState("loading");    // "loading" | "login" | "not-entitled" | "error" | "ready"
  const [authError, setAuthError] = useState("");
  const [authLoading, setAuthLoading] = useState(false);
  const [loginEmail, setLoginEmail] = useState("");
  const [loginPassword, setLoginPassword] = useState("");
  const handoffCidRef = useRef(null);                     // support users: the company chosen in Cortex
  // Surfaced when the live read is denied/cancelled so we never silently leave
  // stale cache on screen pretending to be live data.
  const [loadError, setLoadError] = useState(null);
  const fbListenerRef = useRef(null);
  const companyRef = useRef(null);      // always holds latest company data

  function attachFirebaseListener(companyCode) {
    if (fbListenerRef.current) fbListenerRef.current.off();
    const ref = window._fbDb.ref(dataPath(companyCode));
    ref.on("value", snap => {
      if (!snap.exists()) return;
      const raw = snap.val();
      // Firebase is the source of truth, but if the user has un-flushed local
      // edits, overlay them so their in-flight changes don't flicker away.
      // Once flushSave completes, _pendingUpdates is empty and remote wins.
      const pending = (typeof window._pendingUpdates === "function") ? window._pendingUpdates() : null;
      const merged = pending && Object.keys(pending).length ? { ...raw, ...pending } : raw;
      const val = applyMigrations(merged);
      if (val.code !== companyCode) val.code = companyCode;
      companyRef.current = val;
      setCompanyState(val);
      setLoadError(null); // a successful live read clears any prior error
    }, err => {
      // The listener is cancelled on PERMISSION_DENIED (entitlement lapsed or
      // the company changed) — surface it and re-bootstrap rather than sit on
      // stale data.
      console.error("[VAST] Live data listener cancelled:", err && err.message);
      setSyncStatus("error");
      setLoadError(err && err.message ? err.message : "We lost the live connection to your team's data.");
      if (isPermissionDenied(err)) window.dispatchEvent(new CustomEvent("vast:permission-denied"));
    });
    fbListenerRef.current = ref;
  }

  // ── Bootstrap ─────────────────────────────────────────────────────────
  // 1. sign in (Cortex hand-off token, or a persisted session, or the login form)
  // 2. make sure the ID token carries a companyId claim
  // 3. vast-session → company name, roster, me, entitlement
  // 4. entitled → seed/load vast/companies/{cid}/data, reconcile members, listen
  const appStateRef = useRef("loading");
  const setState = (s) => { appStateRef.current = s; setAppState(s); };
  const bootstrapping = useRef(false);

  async function bootstrap(user, { forceClaimSync = false, cid = null } = {}) {
    if (bootstrapping.current) return;
    bootstrapping.current = true;
    try {
      setState("loading");
      const claims = await ensureCompanyClaim({ forceSync: forceClaimSync });
      const sess = await loadVastSession(cid || handoffCidRef.current);
      if (sess.companyId !== claims.companyId && !claims.supportUser) {
        // Token is stale vs. what Cortex says — refresh once, then reload if still off.
        await user.getIdToken(true);
        const again = await getClaims();
        if (!again || again.companyId !== sess.companyId) { guardedReload("company-mismatch"); return; }
      }
      setSession(sess);
      if (!sess.entitlement || !sess.entitlement.active) {
        if (fbListenerRef.current) { fbListenerRef.current.off(); fbListenerRef.current = null; }
        _currentCompanyCode = null; setCurrentCompanyCode(null);
        setState("not-entitled");
        return;
      }

      const companyId = sess.companyId;
      _currentCompanyCode = companyId; setCurrentCompanyCode(companyId);

      // Seed atomically (RTDB transaction) so two first-time users can't clobber
      // each other. The Cortex company name is the starting VAST company name.
      const seedRef = fbRef(dataPath(companyId));
      const tx = await seedRef.transaction(cur => cur === null ? _sanitize(defaultCompany(sess.companyName || "My Company", companyId)) : undefined);
      let raw = (tx && tx.snapshot && tx.snapshot.exists()) ? tx.snapshot.val() : await fbGet(dataPath(companyId));
      if (!raw) throw new Error("Couldn't load your company's VAST data. Please try again.");
      raw = applyMigrations(raw);

      // Team = Cortex staff. Write only when something actually changed.
      const upd = reconcileMembers(raw, sess.members);
      if (Object.keys(upd).length) {
        Object.assign(raw, upd);
        await fbUpdate(dataPath(companyId), upd);
      }

      companyRef.current = raw; setCompanyState(raw);
      try { localStorage.setItem(`vast:cloud-cache:${companyId}`, JSON.stringify(raw)); } catch (e) { /* non-critical */ }
      attachFirebaseListener(companyId);
      setState("ready");
    } finally {
      bootstrapping.current = false;
    }
  }

  function teardownToLogin(msg) {
    if (fbListenerRef.current) { fbListenerRef.current.off(); fbListenerRef.current = null; }
    clearLocalAppData();
    companyRef.current = null; setCompanyState(null);
    setSession(null); setCurrentCompanyCode(null);
    handoffCidRef.current = null;
    setAuthError(msg || "");
    setState("login");
  }

  // One reload max per 30 s so a mismatch can never loop.
  function guardedReload(reason) {
    const last = Number(sessionStorage.getItem("vast:reload-at")) || 0;
    if (Date.now() - last < 30000) {
      setAuthError("VAST couldn't match your Cortex company. Re-open VAST from Cortex.");
      setState("error");
      return;
    }
    try { sessionStorage.setItem("vast:reload-at", String(Date.now())); } catch (e) { /* ignore */ }
    console.warn("[VAST] Reloading:", reason);
    location.reload();
  }

  function onBootError(e) {
    console.error("[VAST] bootstrap:", e);
    const code = (e && e.code) || "";
    if (code === "unauthenticated" || code === "handoff-expired") {
      window._fbAuth.signOut().catch(() => {});
      teardownToLogin(e.message);
      return;
    }
    setAuthError((e && e.message) || "Something went wrong loading VAST.");
    setState("error");
  }

  useEffect(() => {
    let alive = true;
    (async () => {
      try {
        const { user, cid } = await signInFromHandoffOrSession();
        if (!alive) return;
        handoffCidRef.current = cid || null;
        if (!user) { setState("login"); return; }
        await bootstrap(user, { cid });
      } catch (e) { if (alive) onBootError(e); }
    })();

    // Signed out (here or elsewhere) → back to the login screen.
    const offAuth = window._fbAuth.onAuthStateChanged(u => {
      if (!u && appStateRef.current !== "login" && appStateRef.current !== "loading") teardownToLogin();
    });
    // A write or the listener hit PERMISSION_DENIED: entitlement lapsed or the
    // company changed. Re-run bootstrap — vast-session is the truth.
    const onDenied = () => {
      const u = window._fbAuth.currentUser;
      if (u && appStateRef.current === "ready") bootstrap(u).catch(onBootError);
    };
    window.addEventListener("vast:permission-denied", onDenied);
    // Stale-company detection while the tab is open: claims only change when
    // Cortex re-stamps them, so a company switch shows up on the next refresh.
    const onVisible = async () => {
      if (document.visibilityState !== "visible" || !_currentCompanyCode) return;
      try {
        const c = await getClaims(true);
        if (c && c.companyId && !c.supportUser && c.companyId !== _currentCompanyCode) guardedReload("switched-company");
      } catch (e) { /* offline — ignore */ }
    };
    document.addEventListener("visibilitychange", onVisible);
    return () => {
      alive = false;
      offAuth();
      window.removeEventListener("vast:permission-denied", onDenied);
      document.removeEventListener("visibilitychange", onVisible);
      if (fbListenerRef.current) fbListenerRef.current.off();
    };
  }, []);

  async function handleLogin(email, password) {
    setAuthLoading(true); setAuthError("");
    try {
      clearLocalAppData();
      const cred = await window._fbAuth.signInWithEmailAndPassword(email.trim(), password);
      handoffCidRef.current = null;
      await bootstrap(cred.user, { forceClaimSync: true });   // sync claims → refresh → read companyId
    } catch (e) {
      if (String((e && e.code) || "").startsWith("auth/")) { setAuthError(friendlyAuthError(e)); setState("login"); }
      else onBootError(e);
    } finally { setAuthLoading(false); }
  }

  const retryBootstrap = async () => {
    setAuthError("");
    try {
      const u = window._fbAuth.currentUser;
      if (!u) { setState("login"); return; }
      await bootstrap(u);
    } catch (e) { onBootError(e); }
  };

  const handleSave = useCallback((updatesOrFn) => {
    const base = companyRef.current;
    if (!base) return;
    // Accept either an updates object or a `(prev) => updates` function.
    // The functional form reads from companyRef.current at write time so two
    // rapid mutations of the same array key can't clobber each other with
    // stale closures (which is exactly how resolved issues / reviewed
    // headlines were silently coming back).
    const updates = typeof updatesOrFn === "function" ? updatesOrFn(base) : updatesOrFn;
    if (!updates || typeof updates !== "object" || Object.keys(updates).length === 0) return;
    if (Object.prototype.hasOwnProperty.call(updates, "issues")) {
      const incoming = Array.isArray(updates.issues) ? updates.issues : [];
      const baseArr = Array.isArray(base.issues) ? base.issues : [];
      console.debug("[VAST/issues] handleSave writing issues[]", {
        beforeTotal: baseArr.length,
        beforeOpen: baseArr.filter(i => i.status !== "resolved").length,
        afterTotal: incoming.length,
        afterOpen: incoming.filter(i => i.status !== "resolved").length,
        afterStatuses: incoming.map(i => ({ id: i.id, status: i.status }))
      });
    }
    if (Object.prototype.hasOwnProperty.call(updates, "headlines")) {
      const incoming = Array.isArray(updates.headlines) ? updates.headlines : [];
      const baseArr = Array.isArray(base.headlines) ? base.headlines : [];
      console.debug("[VAST/headlines] handleSave writing headlines[]", {
        beforeTotal: baseArr.length,
        beforeActive: baseArr.filter(h => !h.reviewed).length,
        afterTotal: incoming.length,
        afterActive: incoming.filter(h => !h.reviewed).length,
        afterFlags: incoming.map(h => ({ id: h.id, reviewed: !!h.reviewed }))
      });
    }
    const updated = { ...base, ...updates };
    companyRef.current = updated;   // update ref immediately so next call has fresh data
    setCompanyState(updated);
    // Refresh local cache from full state (best-effort fallback only — Firestore is truth)
    try {
      if (_currentCompanyCode) localStorage.setItem(`vast:cloud-cache:${_currentCompanyCode}`, JSON.stringify(updated));
    } catch (e) { /* localStorage quota/unavailable — non-critical */ }
    // Send ONLY the changed top-level keys to Firestore via fbUpdate so we
    // never overwrite concurrent edits to other fields by other teammates.
    saveCompany(updates);
  }, []); // no dependency on company — reads from ref instead

  // Atomic add helper. Use for *adding new items* to top-level collections
  // (todos, issues, headlines, problemQueue, quarterlyTasks). Writes to a
  // per-id path in Firebase, so a concurrent add by another teammate cannot
  // be clobbered by a wholesale array overwrite from this client.
  const handleAdd = useCallback((key, item) => {
    if (!key || !item || !item.id) return;
    const base = companyRef.current;
    if (!base) return;
    const updated = { ...base, [key]: [...(base[key] || []), item] };
    companyRef.current = updated;
    setCompanyState(updated);
    try {
      if (_currentCompanyCode) localStorage.setItem(`vast:cloud-cache:${_currentCompanyCode}`, JSON.stringify(updated));
    } catch (e) { /* non-critical */ }
    if (_currentCompanyCode) {
      setSyncStatus("saving");
      fbAddItem(`${dataPath(_currentCompanyCode)}/${key}`, item)
        .then(() => setSyncStatus("saved"))
        .catch(e => reportWriteError(e, `Atomic add to ${key}`));
    }
  }, []);

  // ── Auth / gate screens ──
  const fieldStyle = { width: "100%", padding: "12px 16px", borderRadius: C.radius.control, border: `1px solid ${C.border}`, background: C.surface2, color: C.text, fontSize: C.fs.md, fontFamily: C.fontUI, fontWeight: 500, marginBottom: 12, textAlign: "left" };
  const linkStyle = { background: "none", border: "none", color: C.textMuted, fontSize: C.fs.sm, cursor: "pointer", fontFamily: C.fontUI, textDecoration: "none" };
  const secondaryStyle = { width: "100%", padding: 12, fontSize: C.fs.md, borderRadius: C.radius.control, border: `1px solid ${C.border}`, background: C.surface2, color: C.text, fontFamily: C.fontUI, fontWeight: 600, cursor: "pointer", marginBottom: 12 };

  if (appState === "login") return (
    <AuthCard theme={theme}>
      <div style={{ marginTop: 24, marginBottom: 8, fontFamily: C.fontUI, fontSize: C.fs.title, fontWeight: 600 }}>Sign in to VAST</div>
      <div style={{ fontSize: C.fs.base, color: C.textMuted, marginBottom: 24 }}>Use your Cortex email and password.</div>
      <form onSubmit={e => { e.preventDefault(); if (!authLoading) handleLogin(loginEmail, loginPassword); }}>
        <input type="email" autoComplete="username" placeholder="Email" value={loginEmail} onChange={e => setLoginEmail(e.target.value)} autoFocus style={fieldStyle} />
        <input type="password" autoComplete="current-password" placeholder="Password" value={loginPassword} onChange={e => setLoginPassword(e.target.value)} style={fieldStyle} />
        {authError && <div style={{ color: C.red, fontSize: C.fs.sm, marginBottom: 12 }}>{authError}</div>}
        <button type="submit" className="btn-primary" style={{ width: "100%", padding: 12, fontSize: C.fs.md, marginBottom: 16, justifyContent: "center" }} disabled={authLoading || !loginEmail.trim() || !loginPassword}>
          {authLoading ? "Signing in..." : "Sign in →"}
        </button>
      </form>
      <div style={{ display: "flex", justifyContent: "center", gap: 16, flexWrap: "wrap" }}>
        <a href={`${VAST_ENV.cortexOrigin}/reset-password`} style={linkStyle}>Forgot password?</a>
        <a href={cortexAccountUrl(null)} style={linkStyle}>New to VAST? Start in Cortex Account</a>
      </div>
      {VAST_ENV.name !== "prod" && <div style={{ marginTop: 16, fontSize: C.fs.xs, color: C.textDim }}>staging · {VAST_ENV.firebaseConfig.projectId}</div>}
    </AuthCard>
  );

  if (appState === "not-entitled") return (
    <AuthCard theme={theme}>
      <div style={{ marginTop: 24, marginBottom: 8, fontFamily: C.fontUI, fontSize: C.fs.title, fontWeight: 600 }}>VAST isn't active for {(session && session.companyName) || "your company"}</div>
      <div style={{ fontSize: C.fs.base, color: C.textMuted, marginBottom: 12 }}>An admin can start a free trial or subscribe from the Vast tab in Cortex Account.</div>
      {session && session.entitlement && session.entitlement.status === "trialing" && session.entitlement.trialEnd && (
        <div style={{ fontSize: C.fs.xs, color: C.textDim, marginBottom: 12 }}>Trial ended {new Date(session.entitlement.trialEnd).toLocaleDateString()}</div>
      )}
      <div style={{ fontSize: C.fs.xs, color: C.textDim, marginBottom: 24 }}>Switched companies in Cortex? Re-open VAST from Cortex.</div>
      <a href={cortexAccountUrl(session)} className="btn-primary" style={{ display: "flex", justifyContent: "center", width: "100%", padding: 12, fontSize: C.fs.md, marginBottom: 12, textDecoration: "none", boxSizing: "border-box" }}>Open Cortex Account</a>
      <button onClick={retryBootstrap} style={secondaryStyle}>I've subscribed — check again</button>
      <button onClick={() => logoutAndClear()} style={linkStyle}>Sign out</button>
    </AuthCard>
  );

  if (appState === "error") return (
    <AuthCard theme={theme}>
      <div style={{ marginTop: 24, marginBottom: 8, fontFamily: C.fontUI, fontSize: C.fs.title, fontWeight: 600 }}>Couldn't load VAST</div>
      <div style={{ color: C.red, fontSize: C.fs.sm, marginBottom: 24 }}>{authError || "Something went wrong."}</div>
      <button className="btn-primary" style={{ width: "100%", padding: 12, fontSize: C.fs.md, marginBottom: 12, justifyContent: "center" }} onClick={retryBootstrap}>Try again</button>
      <button onClick={() => logoutAndClear()} style={linkStyle}>Sign out</button>
    </AuthCard>
  );

  if (appState === "loading" || !company) return (
    <><GlobalStyles theme={theme} />
    <div style={{ minHeight: "100vh", background: C.bg, display: "flex", alignItems: "center", justifyContent: "center" }}>
      <div style={{ textAlign: "center" }}>
        <VASTLogo size="lg" />
        <div style={{ marginTop: 16, color: C.textMuted, fontSize: C.fs.base }}>Loading...</div>
      </div>
    </div></>
  );

  const viewProps = { company, onSave: handleSave, onAdd: handleAdd, session, me };

  return (
    <SidebarCollapsedContext.Provider value={sidebarCollapsed}>
    <div style={{ minHeight: "100vh", background: C.bg }}>
      <GlobalStyles theme={theme} />
      {loadError && (
        <div style={{ position: "fixed", top: 0, left: 0, right: 0, zIndex: 10000, background: C.primary, color: C.onAccent, padding: "8px 16px", fontSize: C.fs.sm, fontWeight: 600, textAlign: "center", boxShadow: "0 2px 12px rgba(0,0,0,0.3)" }}>
          Connection problem — showing the last data we loaded. Recent changes may not be saved. Please reload or sign in again.
        </div>
      )}
      <MobileMenuContext.Provider value={() => setMobileOpen(true)}>
      <Sidebar view={view} setView={v => { setView(v); setMobileOpen(false); }} company={company} theme={theme} toggleTheme={toggleTheme} mobileOpen={mobileOpen} setMobileOpen={setMobileOpen} collapsed={sidebarCollapsed} setCollapsed={setSidebarCollapsed} companyCode={currentCompanyCode} />
      {view === "dashboard" && <Dashboard {...viewProps} setView={setView} companyCode={currentCompanyCode} />}
      {view.startsWith("navigator:") && (() => {
        const nid = view.slice(10);
        const nObj = (company.navigators || []).find(n => n.id === nid) || { id: nid, name: "Navigator" };
        return <Navigator {...viewProps} navigatorId={nid} navigatorName={nObj.name} />;
      })()}
      {view.startsWith("huddle:") && (() => {
        const hid = view.slice(7);
        const hObj = (company.huddles || []).find(h => h.id === hid) || { id: hid, name: "Weekly Huddle" };
        return <WeeklyHuddle {...viewProps} huddleId={hid} huddleName={hObj.name} companyCode={currentCompanyCode} />;
      })()}
      {view === "tasks" && <Tasks {...viewProps} />}
      {view === "scorecard" && <Scorecard {...viewProps} />}
      {view === "headlines" && <Headlines {...viewProps} />}
      {view === "issues" && <Issues {...viewProps} />}
      {view === "todos" && <Todos {...viewProps} />}
      {view.startsWith("orgchart:") && (() => {
        const oid = view.slice(9);
        const oObj = (company.orgCharts || []).find(o => o.id === oid) || { id: oid, name: "Responsibility Chart" };
        return <OrgChart {...viewProps} orgChartId={oid} orgChartName={oObj.name} />;
      })()}
      {view === "history" && <MeetingHistory {...viewProps} />}
      {view === "quarterhistory" && <QuarterHistory {...viewProps} />}
      {view === "settings" && <Settings {...viewProps} />}
      {view === "reports" && <Reports {...viewProps} />}
      </MobileMenuContext.Provider>
    </div>
    </SidebarCollapsedContext.Provider>
  );
}
