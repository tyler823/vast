    // (same Firebase Auth), and VAST data lives in a Realtime Database instance
    // inside the Cortex project. Prod is selected by hostname (the Netlify site
    // at vast-os.app; vast.jobdox.ai reserved); everything else — the Netlify
    // `develop` branch deploy, deploy previews, localhost — talks to Cortex
    // staging. These are the public web configs (same values Cortex ships to
    // browsers).
    const PROD_HOSTS = ["vast.jobdox.ai", "vast-os.app", "www.vast-os.app"];
    const VAST_ENV = (() => {
      const prod = PROD_HOSTS.includes(location.hostname);
      return prod ? {
        name: "prod",
        cortexOrigin: "https://jobdox.ai",
        firebaseConfig: {
          apiKey: "AIzaSyAFwSEDPqKgAUbwbh_2KZNwLDdGCZEiq3E",
          authDomain: "cortex-717c6.firebaseapp.com",
          databaseURL: "https://cortex-717c6-default-rtdb.firebaseio.com",
          projectId: "cortex-717c6",
          storageBucket: "cortex-717c6.firebasestorage.app",
          messagingSenderId: "496631882511"
        }
      } : {
        name: "staging",
        cortexOrigin: "https://m-dev.jobdox.ai",
        firebaseConfig: {
          apiKey: "AIzaSyCJfVh5I22thAb_dP07EQW8JRh4w79x798",
          authDomain: "cortex-staging-e7d22.firebaseapp.com",
          databaseURL: "https://cortex-staging-e7d22-default-rtdb.firebaseio.com",
          projectId: "cortex-staging-e7d22",
          storageBucket: "cortex-staging-e7d22.firebasestorage.app",
          messagingSenderId: "108795323286"
        }
      };
    })();
    window.VAST_ENV = VAST_ENV;
    firebase.initializeApp(VAST_ENV.firebaseConfig);

    console.log("[VAST] Firebase initialized (" + VAST_ENV.name + " → " + VAST_ENV.firebaseConfig.projectId + ")");

  <script>
    // Apply saved theme to body immediately to avoid flash
    (function() {
      var t = localStorage.getItem("vast-theme") || "light";
      document.documentElement.classList.toggle("vast-theme-light", t === "light");
      document.documentElement.style.background = t === "light" ? "#F4F5F7" : "#0a0a0b";

  <script type="text/babel" data-presets="react">
const { useState, useEffect, useRef, useCallback } = React;

// ─── VAST Design Tokens ──────────────────────────────────────────────
// ONE place for the whole look. Every screen reads these through the `C`
// object (inline styles) or the matching CSS variables on :root (stylesheet).
// Change a value here and it changes everywhere.
//
// BASE_TOKENS = the same in both themes (type, spacing, corners, heights).
// DARK_THEME / LIGHT_THEME = colors, which differ per theme.
const BASE_TOKENS = {
  // Fonts. fontMono is used for every number, count, date, ID, % and $ amount.
  fontUI: "'Inter','Segoe UI',system-ui,-apple-system,sans-serif",
  fontMono: "'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace",
  // Text sizes (px)
  // xs = labels/small, sm = secondary, base = body, md = section titles,
  // title = page titles, display = Huddle timer + Dashboard stat numbers.
  fs: { xs: 12, sm: 13, base: 14, md: 15, title: 20, display: 40 },
  // Font weights
  fw: { regular: 400, medium: 500, semibold: 600 },
  // Spacing scale (px) — padding, margins and gaps come only from this list
  space: { xxs: 4, xs: 6, sm: 8, md: 12, lg: 16, xl: 20, xxl: 24 },
  // Corner radius (px)
  // 4px for cards, buttons, inputs, chips and tables; 8px for pop-ups;
  // full circle only for dots and avatars.
  radius: { control: 4, card: 4, pill: 4, modal: 8, round: "50%" },
  // Heights (px): buttons/inputs on desktop, table rows, and the minimum tap
  // height on phones (kept from the mobile work).
  h: { control: 32, row: 38, phone: 44 },
  // Left menu ("rail"): dark in BOTH themes. All text colors checked ≥4.5:1
  // on bg, hover and active backgrounds (section labels sit on bg only).
  rail: {
    bg: "#1B1E24", border: "#2A2E36",
    text: "#C5CAD3", icon: "#A3AAB6",
    hover: "#262A32", activeBg: "#2E333D", activeText: "#FFFFFF",
    label: "#8C94A1", count: "#FF8A82", focus: "#7AA2FF",
    marker: "#e43531", thumb: "#3A3F4A",
  },
};
// Colors by ROLE. Status colors (green / amber / blue / red / neutral) are named
// tokens; nothing on a screen should type a hex code directly.
const DARK_THEME = {
  ...BASE_TOKENS,
  isDark: true,
  // neutrals
  bg: "#0a0a0b",              // page background
  surface: "#121214",         // header / sidebar
  surface2: "#17171a",        // cards, panels, pop-ups
  surface3: "#202024",        // inputs, chips, hover
  border: "rgba(255,255,255,0.10)",   // 1px lines
  borderStrong: "rgba(255,255,255,0.28)",
  text: "#f4f5f6",            // primary text
  textMuted: "#9a9aa2",       // secondary text
  textDim: "#8e8e98",         // muted text: zeros, empty values, hints
  // brand red — by role
  accent: "#e43531",          // active left-nav marker + logo marks ONLY
  primary: "#c42d29",         // the ONE main button per screen
  primaryHover: "#a82420",
  onAccent: "#fff",           // text on a red (or green) fill
  red: "#f26560",             // red TEXT: problem / overdue / missed target
  redTint1: "rgba(242,101,96,0.08)",   // subtle tint
  redTint2: "rgba(242,101,96,0.14)",   // medium tint
  redTint3: "rgba(242,101,96,0.45)",   // strong (borders)
  // status
  green: "#4cc178", greenTint: "rgba(76,193,120,0.10)", greenBorder: "rgba(76,193,120,0.45)",
  amber: "#e9a23b", amberBg: "rgba(233,162,59,0.10)", amberBorder: "rgba(233,162,59,0.45)",
  blue: "#7aa2ff", blueTint: "rgba(122,162,255,0.10)", blueBorder: "rgba(122,162,255,0.45)",
  neutral: "#9a9aa2",
  purple: "#a78bfa",
  // selected (neutral) state + keyboard focus
  // selection + navigation are BLUE (red is only the main action / problems)
  selBg: "#1A2742", selBorder: "#7aa2ff", link: "#7aa2ff",
  // Jira-style "subtle" buttons, Windows-style inputs, table hover
  btnBg: "#2C2C33", btnHover: "#36363E", btnPressed: "#41414A", btnText: "#f4f5f6",
  dangerHoverBg: "#2A1E20",
  inputBg: "#121214", inputBorder: "rgba(255,255,255,0.22)", inputBottom: "rgba(255,255,255,0.45)",
  tableHover: "#1F1F24",
  focus: "#7aa2ff",
  scrollTrack: "#17171a", scrollThumb: "#3f3f47", scrollThumbHover: "#62626c",
  syncSaving: "#9a9aa2", syncSaved: "#9a9aa2",
  avatarBgs: ["#2a2a30"], avatarFgs: ["#f4f5f6"],
  confetti: ["#4cc178","#7aa2ff","#e9a23b","#e43531","#f4f5f6"],
  // elevation
  shadow: "0 1px 2px rgba(0,0,0,0.55)", shadowLg: "0 12px 38px rgba(0,0,0,0.50)",
  // legacy names (kept so older references still work) → new roles
  yellow: "#e9a23b", redDark: "#a82420", redGlow: "rgba(242,101,96,0.08)",
  offBg: "rgba(242,101,96,0.14)", offBorder: "rgba(242,101,96,0.45)",
  okBg: "rgba(255,255,255,0.05)", okBorder: "rgba(255,255,255,0.16)",
};
const LIGHT_THEME = {
  ...BASE_TOKENS,
  isDark: false,
  // neutrals
  bg: "#F4F5F7",              // page background
  surface: "#FFFFFF",         // header / sidebar
  surface2: "#FFFFFF",        // cards, panels, pop-ups
  surface3: "#F4F5F7",        // inputs, chips, hover
  border: "#E4E7EC",          // 1px lines
  borderStrong: "#C6CBD4",
  text: "#14171F",            // primary text
  textMuted: "#5B6475",       // secondary text
  textDim: "#667085",         // muted text (#6B7280 failed 4.5:1 on the page background)
  // brand red — by role
  accent: "#e43531",          // active left-nav marker + logo marks ONLY
  primary: "#c42d29",         // the ONE main button per screen
  primaryHover: "#a82420",
  onAccent: "#fff",
  red: "#C42D29",             // red TEXT: problem / overdue / missed target
  redTint1: "rgba(196,45,41,0.06)",
  redTint2: "rgba(196,45,41,0.10)",
  redTint3: "rgba(196,45,41,0.35)",
  // status
  green: "#15803D", greenTint: "rgba(21,128,61,0.06)", greenBorder: "rgba(21,128,61,0.35)",
  amber: "#B45309", amberBg: "rgba(180,83,9,0.06)", amberBorder: "rgba(180,83,9,0.35)",
  blue: "#1D4ED8", blueTint: "rgba(29,78,216,0.06)", blueBorder: "rgba(29,78,216,0.35)",
  neutral: "#5B6475",
  purple: "#6D28D9",
  // selection + navigation are BLUE (#E9F0FF was adjusted to #F0F4FF so muted text passes 4.5:1)
  selBg: "#F0F4FF", selBorder: "#1D4ED8", link: "#1D4ED8",
  btnBg: "#EBEDF0", btnHover: "#DCDFE4", btnPressed: "#CDD1D8", btnText: "#14171F",
  dangerHoverBg: "#FBEEEE",
  inputBg: "#FFFFFF", inputBorder: "#C6CBD4", inputBottom: "#8D95A3",
  tableHover: "#F4F5F7",
  focus: "#1D4ED8",
  scrollTrack: "#EEF0F3", scrollThumb: "#B8BEC8", scrollThumbHover: "#8D95A3",
  syncSaving: "#667085", syncSaved: "#667085",
  avatarBgs: ["#E4E7EC"], avatarFgs: ["#14171F"],
  confetti: ["#15803D","#1D4ED8","#B45309","#e43531","#5B6475"],
  shadow: "0 1px 2px rgba(20,23,31,0.06), 0 1px 3px rgba(20,23,31,0.05)", shadowLg: "0 10px 34px rgba(20,23,31,0.12)",
  // legacy names → new roles
  yellow: "#B45309", redDark: "#a82420", redGlow: "rgba(196,45,41,0.06)",
  offBg: "rgba(196,45,41,0.10)", offBorder: "rgba(196,45,41,0.35)",
  okBg: "rgba(20,23,31,0.045)", okBorder: "rgba(20,23,31,0.14)",
};

// Publishes every token as a CSS variable on :root (rebuilt when the theme
// switches): colors → --c-<name>, sizes → --fs-*, --space-*, --radius-*, --h-*.
const tokensToCssVars = (T) => {
  const kebab = (s) => s.replace(/[A-Z]/g, m => "-" + m.toLowerCase());
  const px = (v) => typeof v === "number" ? v + "px" : v;
  const out = [];
  Object.keys(T).forEach(k => {
    const v = T[k];
    if (typeof v === "string" && !k.startsWith("font")) out.push(`--c-${kebab(k)}:${v}`);
    else if (v && typeof v === "object" && !Array.isArray(v)) Object.keys(v).forEach(s => out.push(`--${k}-${kebab(s)}:${k === "fw" ? v[s] : px(v[s])}`));
  });
  out.push(`--font-ui:${T.fontUI}`, `--font-mono:${T.fontMono}`);
  return out.join(";");
};

// C is a mutable reference — VASTApp reassigns before each render based on theme
let C = LIGHT_THEME;

// ─── Injected Styles (function so they regenerate with theme) ─────────
const makeSTYLE = (C) => `
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
  :root{--bg:${C.bg};--s1:${C.surface};--s2:${C.surface2};--s3:${C.surface3};--s4:${C.surface3};--acc:${C.accent};--acc-lo:${C.redGlow};--acc-glo:${C.offBorder};--t1:${C.text};--t2:${C.textMuted};--t3:${C.textDim};--green:${C.green};--amber:${C.amber};--red:${C.red};--purple:${C.textMuted};--br:${C.border};--br-hi:${C.okBorder};--ui:${C.fontUI};--mono:${C.fontMono};${tokensToCssVars(C)}}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:${C.bg};color:${C.text};font-family:${C.fontUI};font-size:${C.fs.base}px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
  html,body,#root{overflow-x:clip}
  /* Visible scrollbars wherever content can overflow (both themes) */
  ::-webkit-scrollbar{width:10px;height:10px;background:${C.scrollTrack}}
  ::-webkit-scrollbar-track{background:${C.scrollTrack}}
  ::-webkit-scrollbar-thumb{background:${C.scrollThumb};border-radius:6px;border:2px solid ${C.scrollTrack}}
  ::-webkit-scrollbar-thumb:hover{background:${C.scrollThumbHover}}
  ::-webkit-scrollbar-corner{background:${C.scrollTrack}}
  @supports not selector(::-webkit-scrollbar){*{scrollbar-width:thin;scrollbar-color:${C.scrollThumb} ${C.scrollTrack}}}
  /* Keyboard focus: clear 2px outline, offset 2px, on everything you can tab to */
  :focus{outline:none}
  :focus-visible{outline:2px solid ${C.focus};outline-offset:2px}
  a:focus-visible,button:focus-visible,[role="button"]:focus-visible,[tabindex]:focus-visible,summary:focus-visible{outline:2px solid ${C.focus};outline-offset:2px}
  input,textarea,select{background:${C.inputBg};border:1px solid ${C.inputBorder};border-bottom-color:${C.inputBottom};color:${C.text};font-family:${C.fontUI};border-radius:${C.radius.control}px;padding:5px 10px;line-height:20px;width:100%;font-size:${C.fs.base}px;outline:none;transition:border-color 0.12s,box-shadow 0.12s}
  input:focus,textarea:focus,select:focus{border-color:${C.inputBorder};border-bottom-color:${C.focus};box-shadow:inset 0 -1px 0 ${C.focus}}
  input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid ${C.focus};outline-offset:2px}
  input::placeholder{color:${C.textDim}}
  input:not([type=checkbox]):not([type=radio]),select{min-height:${C.h.control}px}
  textarea{resize:vertical;min-height:80px}
  select option{background:${C.surface2};color:${C.text}}
  button{cursor:pointer;font-family:${C.fontUI};font-weight:500;border:none;border-radius:${C.radius.control}px;padding:6px 12px;font-size:${C.fs.sm}px;display:inline-flex;align-items:center;gap:6px;transition:all 0.15s;white-space:nowrap}
  button:disabled{opacity:0.5;cursor:not-allowed}
  .btn-primary,.btn-secondary,.btn-ghost,.btn-danger{min-height:${C.h.control}px;justify-content:center}
  .btn-primary{background:${C.primary};color:${C.onAccent};border:1px solid transparent;padding:6px 12px;font-size:${C.fs.sm}px;font-weight:500;box-shadow:none}
  .btn-primary:active:not(:disabled){background:${C.primaryHover}}
  .btn-primary:hover:not(:disabled){background:${C.primaryHover}}
  .btn-secondary{background:${C.btnBg};border:1px solid transparent;color:${C.btnText};padding:6px 12px;font-size:${C.fs.sm}px}
  .btn-secondary:hover:not(:disabled){background:${C.btnHover}}
  .btn-secondary:active:not(:disabled){background:${C.btnPressed}}
  .btn-ghost{background:transparent;border:1px solid transparent;color:${C.text};padding:6px 12px;font-size:${C.fs.sm}px}
  .btn-ghost:hover:not(:disabled){background:${C.btnBg}}
  .btn-ghost:active:not(:disabled){background:${C.btnPressed}}
  .btn-link{color:${C.link}!important}
  .btn-link:hover:not(:disabled){text-decoration:underline}
  .btn-danger{background:${C.btnBg};border:1px solid transparent;color:${C.textMuted};padding:6px 12px;font-size:${C.fs.sm}px}
  .btn-danger:hover:not(:disabled){background:${C.dangerHoverBg};color:${C.red}}
  .card{background:${C.surface2};border:1px solid ${C.border};border-radius:${C.radius.card}px;padding:14px 16px;box-shadow:none}
  .label{font-family:${C.fontUI};font-size:${C.fs.xs}px;font-weight:600;color:${C.textMuted};margin-bottom:8px;display:block}
  h1,h2,h3,h4{font-family:${C.fontUI};font-weight:600}
  h3{font-size:${C.fs.md}px}
  .num,.mono{font-family:${C.fontMono};font-variant-numeric:tabular-nums}
  input[type=number],input[type=date],input[type=time]{font-family:${C.fontMono};font-variant-numeric:tabular-nums}
  .tag-on,.tag-off,.tag-done,.tag-notdone,.status{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:${C.fs.sm}px;font-weight:500;color:${C.text};background:none;border:none;padding:0;line-height:1.4}
  .tag-on::before,.tag-off::before,.tag-done::before,.tag-notdone::before{content:"";width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .tag-on::before,.tag-done::before{background:${C.green}}
  .tag-off::before{background:${C.red}}
  .tag-notdone::before{background:${C.amber}}
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .sidebar-link{display:flex;align-items:center;gap:8px;padding:8px 16px;border-radius:${C.radius.control}px;color:${C.rail.text};font-size:14px;font-weight:500;cursor:pointer;transition:all 0.15s;text-decoration:none;border:none;background:none;width:100%;text-align:left}
  .sidebar-link:hover{background:${C.rail.hover};color:${C.rail.activeText}}
  .sidebar-link svg{color:${C.rail.icon};flex-shrink:0}
  .sidebar-link:hover svg,.sidebar-link.active svg{color:${C.rail.activeText}}
  .sidebar-link.active{background:${C.rail.activeBg};color:${C.rail.activeText};border-left:3px solid ${C.rail.marker};padding-left:13px}
  .vast-rail :focus-visible,.vast-rail .sidebar-link:focus-visible{outline:2px solid ${C.rail.focus};outline-offset:-2px}
  .vast-rail .badge{background:transparent;border:1px solid ${C.rail.border};color:${C.rail.count}}
  .vast-rail ::-webkit-scrollbar,.vast-rail ::-webkit-scrollbar-track{background:${C.rail.bg}}
  .vast-rail ::-webkit-scrollbar-thumb{background:${C.rail.thumb};border-color:${C.rail.bg}}
  .divider{height:1px;background:${C.border};margin:12px 0}
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);backdrop-filter:blur(4px);z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;animation:fadeIn 0.15s ease}
  .modal{background:${C.surface2};border:1px solid ${C.border};border-radius:${C.radius.modal}px;width:100%;max-width:580px;max-height:90vh;display:flex;flex-direction:column;overflow-y:auto;box-sizing:border-box;box-shadow:${C.shadowLg};padding:24px}
  .field{margin-bottom:16px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
  .fade-in{animation:fadeIn 0.3s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
  .progress-bar{height:6px;background:${C.surface3};border-radius:3px;overflow:hidden}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.3}}
  .progress-fill{height:100%;background:${C.green};border-radius:3px;transition:width 0.5s}
  .rating-btn{width:44px;height:44px;border-radius:${C.radius.control}px;border:1px solid transparent;background:${C.btnBg};color:${C.textMuted};font-size:${C.fs.md}px;font-weight:600;cursor:pointer;transition:all 0.15s;font-family:${C.fontMono};font-variant-numeric:tabular-nums;display:flex;align-items:center;justify-content:center}

// ─── Helpers ─────────────────────────────────────────────────────────
const toArray = (val) => { if (!val) return []; if (Array.isArray(val)) return val; return Object.values(val); };
const uid = () => Math.random().toString(36).slice(2, 9) + Math.random().toString(36).slice(2, 5);
const now = () => new Date().toISOString();
const dateStr = (d = new Date()) => d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
// Normalize todo assignees — supports both old string and new array format
const getAssignees = (t) => t.assignees ? t.assignees : (t.assignee ? [t.assignee] : []);
// Quarter labels like "Q3 2026" → calendar dates. Returns null for custom labels.
const parseQuarterLabel = (label) => {
  const m = /^\s*Q([1-4])\s+(\d{4})\s*$/i.exec(String(label || ""));
  return m ? { q: Number(m[1]), year: Number(m[2]) } : null;
};
const quarterDatesFromLabel = (label) => {
  const p = parseQuarterLabel(label);
  if (!p) return null;
  const pad = (n) => String(n).padStart(2, "0");
  const startMonth = (p.q - 1) * 3 + 1;
  const endMonth = startMonth + 2;
  const lastDay = new Date(p.year, endMonth, 0).getDate();
  return { quarterStart: `${p.year}-${pad(startMonth)}-01`, quarterEnd: `${p.year}-${pad(endMonth)}-${pad(lastDay)}` };
};
// "Q3 2026" → "Q4 2026"; "Q4 2026" → "Q1 2027". Custom labels → the quarter after today's.
const nextQuarterLabel = (label) => {
  const p = parseQuarterLabel(label) || { q: Math.ceil((new Date().getMonth() + 1) / 3), year: new Date().getFullYear() };
  return p.q === 4 ? `Q1 ${p.year + 1}` : `Q${p.q + 1} ${p.year}`;
};
const sameQuarterLabel = (a, b) => String(a || "").trim().replace(/\s+/g, " ").toLowerCase() === String(b || "").trim().replace(/\s+/g, " ").toLowerCase();
const weekKey = () => weekKeyFromDate(new Date());
const weekKeyFromDate = (d) => {
  // ISO 8601 week: week containing Thursday, year of that Thursday
  const date = new Date(d);
  date.setHours(0, 0, 0, 0);
  date.setDate(date.getDate() + 3 - ((date.getDay() + 6) % 7)); // nearest Thursday
  const week1 = new Date(date.getFullYear(), 0, 4);
  const week = 1 + Math.round(((date - week1) / 86400000 - 3 + ((week1.getDay() + 6) % 7)) / 7);
  return `${date.getFullYear()}-W${String(week).padStart(2,"0")}`;
};
const weekLabel = (key) => {
  // Parse YYYY-Www back to a readable "Mon DD" label for the week's Monday
  const [yr, wPart] = key.split("-W");
  const weekNum = parseInt(wPart, 10);
  const jan1 = new Date(parseInt(yr, 10), 0, 1);
  const daysOffset = (weekNum - 1) * 7 - jan1.getDay() + 1;
  const monday = new Date(jan1);
  monday.setDate(jan1.getDate() + daysOffset);
  return monday.toLocaleDateString("en-US", { month: "short", day: "numeric" });
};
// Generate week keys from a start date to an end date (inclusive)
const weeksInRange = (startDate, endDate) => {
  const keys = [];
  const cur = new Date(startDate);
  cur.setHours(0,0,0,0);
  // Snap to Monday of that week
  cur.setDate(cur.getDate() - ((cur.getDay() + 6) % 7));
  const end = new Date(endDate);
  end.setHours(23,59,59,999);
  while (cur <= end) {
    keys.push(weekKeyFromDate(cur));
    cur.setDate(cur.getDate() + 7);
  }
  return keys;
};

// ─── Storage Helpers (Firebase / Cortex identity) ─────────────────────

// Cortex is the identity provider. Every ID token carries custom claims stamped
// by Cortex's sync-user-claims: { companyId, permissionLevel, email, supportUser }.
async function getClaims(force = false) {
  const u = window._fbAuth.currentUser;
  if (!u) return null;
  const res = await u.getIdTokenResult(force);
  return (res && res.claims) || {};
}

// Ask Cortex to (re)stamp claims for this user (empty body = their default
// company), then force a token refresh so the new claims are on the token.
async function syncClaims() {
  const u = window._fbAuth.currentUser;
  if (!u) throw new Error("Not signed in");
  const idToken = await u.getIdToken();
  const res = await fetch(`${VAST_ENV.cortexOrigin}/.netlify/functions/sync-user-claims`, {
    method: "POST",
    headers: { Authorization: `Bearer ${idToken}` },
  });
  if (res.status === 404) throw new Error("Your Cortex account isn't linked to a company yet. Sign in to Cortex first, then return to VAST.");
  if (!res.ok) throw new Error(`Couldn't sync your Cortex account (${res.status}). Please try again.`);
  await u.getIdToken(true);
  return getClaims();
}

// Guarantee a companyId claim. forceSync only on a fresh email/password login —
// a hand-off or persisted session already carries the company the user last
// entered in Cortex, and re-syncing would reset it to their DEFAULT company.
async function ensureCompanyClaim({ forceSync = false } = {}) {
  let claims = forceSync ? await syncClaims() : await getClaims(true);
  if (!claims || !claims.companyId) claims = await syncClaims();
  if (!claims || !claims.companyId) throw new Error("Your account isn't attached to a company yet. Open Cortex first, then return to VAST.");
  return claims;
}

// Session bootstrap from Cortex: company name, staff roster (= VAST team), who
// "me" is, and the add-on entitlement. `cid` is only honored for support users.
async function loadVastSession(cid) {
  const u = window._fbAuth.currentUser;
  if (!u) throw new Error("Not signed in");
  const idToken = await u.getIdToken();
  const res = await fetch(`${VAST_ENV.cortexOrigin}/.netlify/functions/vast-session`, {
    method: "POST",
    headers: { Authorization: `Bearer ${idToken}`, "Content-Type": "application/json" },
    body: JSON.stringify(cid ? { companyId: cid } : {}),
  });
  if (res.status === 401) throw Object.assign(new Error("Your session expired. Please sign in again."), { code: "unauthenticated" });
  let json = {};
  try { json = await res.json(); } catch (e) { /* non-JSON error body */ }
  if (res.status === 403) throw Object.assign(new Error(json.message || "Your Cortex account isn't on this company's staff list."), { code: "not_a_member" });
  if (!res.ok) throw new Error(json.message || `Couldn't load your VAST session (${res.status}). Try again in a moment.`);
  return json;   // { companyId, companyName, me, members, entitlement, cortexAccountUrl }
}

// Read and strip the Cortex hand-off fragment (#vt=<custom token>&cid=<companyId>).
// Stripped BEFORE sign-in so a reload never replays a spent token.
function consumeHandoffToken() {
  const hash = location.hash || "";
  if (!hash.startsWith("#")) return null;
  const params = new URLSearchParams(hash.slice(1));
  const vt = params.get("vt");
  if (!vt) return null;
  history.replaceState(null, "", location.pathname + location.search);
  return { vt, cid: params.get("cid") || null };
}

// Resolves to { user, cid } — user null → login screen. A hand-off token wins
// over a persisted session (it may be for a different company).
async function signInFromHandoffOrSession() {
  const handoff = consumeHandoffToken();
  if (handoff) {
    clearLocalAppData();   // never carry another company's cache across
    try {
      await window._fbAuth.signInWithCustomToken(handoff.vt);
    } catch (e) {
      console.warn("[VAST] Hand-off sign-in failed:", e);
      throw Object.assign(new Error("This VAST link has expired. Please sign in below."), { code: "handoff-expired" });
    }
    return { user: window._fbAuth.currentUser, cid: handoff.cid };
  }
  const user = await new Promise(resolve => {
    const off = window._fbAuth.onAuthStateChanged(u => { off(); resolve(u); });
  });
  return { user, cid: null };
}

function cortexAccountUrl(session) {
  return (session && session.cortexAccountUrl) || `${VAST_ENV.cortexOrigin}/app/account/vast`;
}

function friendlyAuthError(e) {
  const code = (e && e.code) || "";
  if (["auth/invalid-credential", "auth/user-not-found", "auth/wrong-password", "auth/invalid-email", "auth/invalid-login-credentials"].includes(code)) return "Email or password is incorrect.";
  if (code === "auth/too-many-requests") return "Too many attempts — try again shortly or reset your password.";
  if (code === "auth/network-request-failed") return "Network error. Check your connection and try again.";
  if (code === "auth/user-disabled") return "This account has been disabled. Contact your Cortex admin.";
  return (e && e.message) || "Sign-in failed. Please try again.";
}

// Sync status indicator
let _syncStatus = "idle";
function setSyncStatus(s) {
  _syncStatus = s;
  const el = document.getElementById("vast-sync-status");
  if (!el) return;
  const map = { idle: "", saving: "Syncing...", saved: "Saved", error: "Sync failed — retrying. Your changes are NOT saved yet." };
  const col = { idle: "", saving: C.rail.label, saved: C.rail.label, error: C.rail.count };
  el.textContent = map[s] || "";
  el.style.color = col[s] || "";
  // Do NOT auto-clear the error: it must stay visible until a save actually
  // succeeds (which sets status to "saved"/"idle"), so failures can't hide.
}

// ── Firebase helpers ───────────────────────────────────────────────────────
// All VAST data lives under vast/companies/{cortexCompanyId} in the Cortex
// project's Realtime Database. The RTDB rules grant that subtree only to
// members of the company whose VAST entitlement is active.
const VAST_DB_ROOT = "vast/companies";
const dataPath = (cid) => `${VAST_DB_ROOT}/${cid}/data`;
const livePath = (cid, hid) => `${VAST_DB_ROOT}/${cid}/liveSessions${hid ? "/" + hid : ""}`;
function fbRef(path) { return window._fbDb.ref(path); }

// Never fail silently: surface a write error in the sync indicator, and on a
// permission denial (entitlement lapsed / company switched) tell the app to
// re-bootstrap instead of retrying forever.
const isPermissionDenied = (e) => /permission[_ ]denied/i.test(String((e && (e.code || e.message)) || ""));
function reportWriteError(e, label) {
  console.error(`[VAST] ${label || "Write"} failed:`, e);
  setSyncStatus("error");
  if (isPermissionDenied(e)) window.dispatchEvent(new CustomEvent("vast:permission-denied"));
}

async function fbGet(path) {
  const snap = await fbRef(path).once("value");
  return snap.exists() ? snap.val() : null;
}

const _sanitize = (obj) => JSON.parse(JSON.stringify(obj, (k, v) => v === undefined ? null : v));
async function fbSet(path, data) { await fbRef(path).set(_sanitize(data)); }
async function fbUpdate(path, data) { await fbRef(path).update(_sanitize(data)); }
// Atomically write a single item to a collection map keyed by item.id.
// Two teammates adding to the same collection at the same time both
// survive — different ids -> different paths -> no overwrite. The
// existing applyMigrations() already converts the resulting object back
// to an array on read, so callers downstream see no shape change.
async function fbAddItem(collectionPath, item) {
  if (!item || !item.id) throw new Error("fbAddItem requires item.id");
  await fbRef(`${collectionPath}/${item.id}`).set(_sanitize(item));
}

// ── Company save via Firebase ─────────────────────────────────────────────

let _saveTimer = null;
let _pendingUpdates = {};   // accumulated top-level keys to merge into companies/{code}/data
let _saving = false;        // guards against concurrent flushSave runs
let _currentCompanyCode = null;

// Firestore is the source of truth. saveCompany takes a PARTIAL set of top-level
// keys and merges them into companies/{code}/data via fbUpdate, so concurrent
// edits to other fields by other teammates are never overwritten.
function saveCompany(updates) {
  if (!updates || typeof updates !== "object") return;
  Object.assign(_pendingUpdates, updates);
  setSyncStatus("saving");
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => flushSave(), 200);
}

// Exposed so the Firebase listener can overlay in-flight edits on top of remote
// data, preventing optimistic UI flicker while still treating Firestore as truth.
window._pendingUpdates = () => _pendingUpdates;

async function flushSave() {
  if (_saving) return;
  if (!_currentCompanyCode) return;
  const keys = Object.keys(_pendingUpdates);
  if (!keys.length) return;

  _saving = true;
  const updates = _pendingUpdates;
  _pendingUpdates = {}; // any new edits during await accumulate in a fresh object

  try {
    await fbUpdate(dataPath(_currentCompanyCode), updates);
    console.log("[VAST] Saved to Firebase.");
    setSyncStatus("saved");
    setTimeout(() => setSyncStatus("idle"), 3000);
  } catch(e) {
    console.error("[VAST] Firebase save failed:", e);
    setSyncStatus("error");
    if (isPermissionDenied(e)) {
      // Entitlement lapsed or the company changed — retrying can't help. Drop
      // the queue and let the app re-bootstrap (not-entitled screen / reload).
      _pendingUpdates = {};
      window.dispatchEvent(new CustomEvent("vast:permission-denied"));
    } else {
      // Re-queue failed keys; newer pending writes win on conflict
      _pendingUpdates = { ...updates, ..._pendingUpdates };
      setTimeout(() => flushSave(), 5000);
    }
  } finally {
    _saving = false;
    if (Object.keys(_pendingUpdates).length) {
      if (_saveTimer) clearTimeout(_saveTimer);
      _saveTimer = setTimeout(() => flushSave(), 200);
    }
  }
}

window.addEventListener("beforeunload", () => {
  if (_saveTimer) clearTimeout(_saveTimer);
  if (Object.keys(_pendingUpdates).length && _currentCompanyCode) {
    // Best-effort merge on page unload — cannot reliably show UI errors here
    try { fbRef(`${VAST_DB_ROOT}/${_currentCompanyCode}/data`).update(_sanitize(_pendingUpdates)); } catch (e) { console.error("[VAST] beforeunload save failed:", e); }
  }
});

// ── Logout: clear all per-company state so switching companies starts clean ──
function clearLocalAppData() {
  try {
    if (_saveTimer) { clearTimeout(_saveTimer); _saveTimer = null; }
    _pendingUpdates = {};
    _saving = false;
    _currentCompanyCode = null;
    // Remove every VAST company-data cache key (suffixed AND legacy unsuffixed).
    // The legacy "vast:cloud-cache" key is especially risky: the bootstrap path
    // will push it into a brand-new company if a different user signs in next.
    const toRemove = [];
    for (let i = 0; i < localStorage.length; i++) {
      const k = localStorage.key(i);
      if (k && k.startsWith("vast:cloud-cache")) toRemove.push(k);
    }
    toRemove.forEach(k => localStorage.removeItem(k));
    // Theme and sidebar prefs are personal (not company data) — keep them.
  } catch (e) { console.warn("[VAST] clearLocalAppData failed:", e); }
}

async function logoutAndClear() {
  // Best-effort: flush any pending writes before we wipe local state, so the
  // user's last edits are not silently dropped.
  try {
    if (Object.keys(_pendingUpdates).length && _currentCompanyCode) {
      await fbUpdate(dataPath(_currentCompanyCode), _pendingUpdates);
    }
  } catch (e) { console.warn("[VAST] Final flush before logout failed:", e); }
  clearLocalAppData();
  try {
    if (window._fbAuth && window._fbAuth.currentUser) await window._fbAuth.signOut();
  } catch (e) { console.warn("[VAST] Firebase signOut failed:", e); }
  // No redirect — VASTApp's auth watcher shows the login screen.
}

// ── Live session helpers ──────────────────────────────────────────────────
async function startLiveSession(companyCode, huddleId, hostMemberId, hostName) {
  // Guard: prevent writing a live session without a valid host member ID
  if (!companyCode || !huddleId || !hostMemberId) {
    console.error("[VAST] Cannot start live session without companyCode, huddleId, and hostMemberId");
    return;
  }
  await fbSet(`${VAST_DB_ROOT}/${companyCode}/liveSessions/${huddleId}`, {
    active: true, activeIdx: 0, hostMemberId, hostName: hostName || "Host",
    startedAt: Date.now()
  });
}

async function updateLiveSession(companyCode, huddleId, patchOrActiveIdx) {
  // Backward-compatible: accept either a patch object (preferred — can carry
  // a state snapshot) or a bare activeIdx number.
  const patch = (patchOrActiveIdx && typeof patchOrActiveIdx === "object")
    ? patchOrActiveIdx
    : { activeIdx: patchOrActiveIdx };
  await fbUpdate(`${VAST_DB_ROOT}/${companyCode}/liveSessions/${huddleId}`, patch);
}

async function endLiveSession(companyCode, huddleId) {
  // Robust: fall back to the module-global code if the caller passes
  // undefined (can happen if a prop is briefly stale). Use fbSet so the
  // node is replaced wholesale — no stale snapshot/activeIdx/hostMemberId
  // is left behind that could confuse the sidebar.
  const code = companyCode || _currentCompanyCode;
  if (!code || !huddleId) return;
  await fbSet(`${VAST_DB_ROOT}/${code}/liveSessions/${huddleId}`, { active: false, endedAt: Date.now() });
}

// ── Team roster = Cortex staff ────────────────────────────────────────────
// vast-session returns the company's staff as [{ id, name, email, role }].
// VAST keeps its own members[] (other records reference members by NAME —
// todos / measurables / quarterlyTasks — and by ID — huddles / liveSessions),
// so we reconcile rather than replace: upsert by id, keep VAST-only extras,
// mark people no longer on the roster inactive (never delete), cascade renames.
function cascadeRename(company, oldName, newName) {
  if (!oldName || !newName || oldName === newName) return {};
  const rename = (name) => name === oldName ? newName : name;
  return {
    quarterlyTasks: toArray(company.quarterlyTasks).map(t => ({ ...t, who: rename(t.who) })),
    todos: toArray(company.todos).map(t => ({
      ...t,
      assignee: t.assignee === oldName ? newName : t.assignee,
      assignees: (t.assignees || []).map(a => rename(a)),
    })),
    scorecard: {
      ...(company.scorecard || {}),
      measurables: toArray(company.scorecard && company.scorecard.measurables).map(m => ({ ...m, owner: rename(m.owner) })),
    },
  };
}

function reconcileMembers(company, roster) {
  const existing = toArray(company.members).filter(m => m && m.id);
  const byId = new Map(existing.map(m => [m.id, m]));
  const list = Array.isArray(roster) ? roster.filter(r => r && r.id) : [];
  const rosterIds = new Set(list.map(r => r.id));
  const renames = [];
  const next = list.map(r => {
    const prev = byId.get(r.id);
    if (!prev) return { id: r.id, name: r.name || r.email || "Member", email: r.email || "", role: r.role || "member" };
    if (prev.name && r.name && prev.name !== r.name) renames.push([prev.name, r.name]);
    const { inviteCode, inactive, ...keep } = prev;   // drop legacy invite fields; reactivate if back on the roster
    return { ...keep, name: r.name || prev.name, email: r.email || prev.email || "", role: r.role || prev.role || "member" };
  });
  existing.forEach(m => { if (!rosterIds.has(m.id)) next.push(m.inactive ? m : { ...m, inactive: true }); });

  let updates = {};
  if (JSON.stringify(next) !== JSON.stringify(existing)) updates.members = next;
  let working = { ...company, ...updates };
  for (const [o, n] of renames) {
    const cas = cascadeRename(working, o, n);
    updates = { ...updates, ...cas };
    working = { ...working, ...cas };
  }
  return updates;   // {} when nothing changed → no write
}

// Members still on the Cortex roster — use for pickers / attendance. Use
// toArray(company.members) for id→name lookups so history keeps its names.
const activeMembers = (company) => toArray(company && company.members).filter(m => m && !m.inactive);

function VASTLogo({ size = "md", onDark = false }) {
  const sizes = {
    lg: { h: 52, fs: 48 },
    md: { h: 40, fs: 37 },
    sm: { h: 26, fs: 24 },
    rail: { h: 36, fs: 34 },   // left menu: tight crop around the wordmark, so it reads larger
  };
  const s = sizes[size] || sizes.md;
  const viewBox = size === "rail" ? "71 132 266 106" : "66 6 290 256";
  // Real brand wordmark: white logo on dark theme, black logo on light theme.
  // The source SVGs are 375×375 with the wordmark in the upper-center; the
  // outer <svg> viewBox crops to the artwork bounds so sizing/whitespace match
  // the previous text logo. Container height is driven by s.h exactly as before.
  const src = (onDark || C.isDark) ? "VAST%20White.svg" : "Vast%20Black.svg";
  return (
    <svg height={s.h} viewBox={viewBox} fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet" role="img" aria-label="VAST" style={{ display: "block" }}>
      <image href={src} xlinkHref={src} x="0" y="0" width="375" height="375" />
    </svg>
  );
}

// ─── MOBILE HOOK ─────────────────────────────────────────────────────
function useMobile() {
  const [mobile, setMobile] = React.useState(() => window.innerWidth <= 768);
  React.useEffect(() => {
    const fn = () => setMobile(window.innerWidth <= 768);
    window.addEventListener("resize", fn);
    return () => window.removeEventListener("resize", fn);
  }, []);
  return mobile;
}

// ─── DASHBOARD ────────────────────────────────────────────────────────
function Dashboard({ company, onSave, setView, me, companyCode }) {
  const q = company.currentQuarter || "This Quarter";
  const tasks = company.quarterlyTasks || [];
  const [liveSessions, setLiveSessions] = React.useState({});
  React.useEffect(() => {
    if (!companyCode) return;
    const ref = window._fbDb.ref(`${VAST_DB_ROOT}/${companyCode}/liveSessions`);
    ref.on("value", snap => setLiveSessions(snap.exists() ? snap.val() : {}),
      err => console.warn("[VAST] liveSessions listener cancelled:", err && err.message));
    return () => ref.off();
  }, [companyCode]);
  const onTrack = tasks.filter(t => t.status === "on").length;
  const offTrack = tasks.filter(t => t.status === "off").length;
  const done = tasks.filter(t => t.status === "done").length;
  const total = tasks.length;
  const pct = total > 0 ? Math.round(((onTrack + done) / total) * 100) : 0;
  const openIssues = (company.issues || []).filter(i => i.status !== "resolved").length;
  const pendingTodos = (company.todos || []).filter(t => !t.done).length;
  const _meetings = toArray(company.meetings);
  const avgRating = _meetings.length
    ? (_meetings.reduce((a, m) => a + (m.rating || 0), 0) / _meetings.length).toFixed(1)
    : "—";

  // Quarter progress
  const qStart = company.quarterStart ? new Date(company.quarterStart) : null;
  const qEnd = company.quarterEnd ? new Date(company.quarterEnd) : null;
  const today = new Date();
  today.setHours(0,0,0,0);
  const qTotal = qStart && qEnd ? Math.max(1, Math.round((qEnd - qStart) / 86400000)) : 90;
  const qElapsed = qStart ? Math.max(0, Math.round((today - qStart) / 86400000)) : 0;
  const qRemaining = qEnd ? Math.max(0, Math.round((qEnd - today) / 86400000)) : null;
  const qTimePct = Math.min(100, Math.round((qElapsed / qTotal) * 100));

  return (
    <Layout title={`Welcome to ${company.name}`} subtitle={dateStr()}>
      {/* Quarter Progress Banner */}
      <div className="card" style={{ marginBottom: 20, padding: "16px 20px" }}>
        <div className="mob-wrap" style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
          <div>
            <span style={{ fontFamily: C.fontMono, fontVariantNumeric: "tabular-nums", fontWeight: 600, fontSize: C.fs.md}}>{q}</span>
            {qStart && qEnd && (
              <span style={{ fontSize: C.fs.xs, color: C.textMuted, marginLeft: 12 }}>
                <span className="num">{qStart.toLocaleDateString("en-US", { month: "short", day: "numeric" })} — {qEnd.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" })}</span>
              </span>
            )}
          </div>
          <div style={{ textAlign: "right" }}>
            {qRemaining !== null && (
              <span style={{ fontSize: C.fs.sm, fontWeight: 600, color: qRemaining <= 14 ? C.red : qRemaining <= 30 ? C.amber : C.text }}>
                {qRemaining === 0 ? "Last day!" : <><span className="num">{qRemaining}</span>{` day${qRemaining !== 1 ? "s" : ""} remaining`}</>}
              </span>
            )}
          </div>
        </div>
        <div className="mob-wrap" style={{ display: "flex", gap: 16, alignItems: "center" }}>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: C.fs.xs, color: C.textMuted, marginBottom: 4, display: "flex", justifyContent: "space-between" }}>
              <span>Time elapsed</span><span className="num">{qTimePct}%</span>
            </div>
            <div style={{ height: 6, background: C.border, borderRadius: 3, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${qTimePct}%`, background: qTimePct > pct + 20 ? C.red : C.neutral, borderRadius: 3, transition: "width 0.4s" }} />
            </div>
          </div>
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: C.fs.xs, color: C.textMuted, marginBottom: 4, display: "flex", justifyContent: "space-between" }}>
              <span>Tasks complete</span><span className="num">{pct}%</span>
            </div>
            <div style={{ height: 6, background: C.border, borderRadius: 3, overflow: "hidden" }}>
              <div style={{ height: "100%", width: `${pct}%`, background: C.green, borderRadius: 3, transition: "width 0.4s" }} />
            </div>
          </div>
          <button className="btn-ghost btn-link" style={{ fontSize: C.fs.xs, whiteSpace: "nowrap" }} onClick={() => setView("settings")}>Edit quarter <Icon.arrowRight /></button>
        </div>
      </div>

      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit,minmax(200px,1fr))", gap: 12, marginBottom: 12 }}>
        {[
          { label: "Quarterly Tasks", value: `${onTrack + done}/${total}`, sub: "on or completed", color: C.text },
          { label: "Open Issues", value: openIssues, sub: "to resolve", color: C.text },
          { label: "Pending To-Dos", value: pendingTodos, sub: "this week", color: C.text },
          { label: "Avg Meeting Rating", value: avgRating, sub: `of ${_meetings.length} meetings`, color: isNaN(parseFloat(avgRating)) ? C.text : parseFloat(avgRating) >= 8 ? C.green : parseFloat(avgRating) >= 6 ? C.amber : C.red },

            <div style={{ minWidth: 0 }}>
              <div style={{ fontSize: C.fs.sm, fontWeight: 600, color: C.text }}>{s.label}</div>
              <div style={{ fontSize: C.fs.xs, color: C.textMuted }}>{s.sub}</div>
            </div>
          </div>
        ))}
      </div>

      <div className="dash-grid">
        <div className="card">
          <div className="section-header" style={{ marginBottom: 12 }}>
            <h3 style={{ fontSize: C.fs.md }}>{q} — Task progress</h3>

// ─── SCORECARD CELL ───────────────────────────────────────────────────
// Holds the typed value in local state so a re-render or remote echo cannot
// silently overwrite the user mid-typing. While the input is focused, prop
// changes (Firestore listener echoes) are ignored; on blur we sync. Every
// keystroke also writes through to Firestore so progress is durable.
// Display-only number formatting: "130000" + "$" → "$130,000". Anything that
// isn't a plain number is shown exactly as typed. Never used for saving.
const fmtMeasure = (raw, unit, cell) => {
  const str = String(raw ?? "").trim();
  if (!/^-?\d+(\.\d+)?$/.test(str)) return raw ?? "";
  const n = Number(str);
  const body = Math.abs(n).toLocaleString("en-US", { maximumFractionDigits: 6 });
  const sign = n < 0 ? "-" : "";
  const u = String(unit || "").trim();
  if (u === "$") return `${sign}$${body}`;
  if (u === "%") return `${sign}${body}%`;
  return `${sign}${body}${u && !cell ? " " + u : ""}`;
};
// Tooltip shown right beside the element it belongs to (replaces the browser's
// own title popup, which could appear far from the button). Display only.
function Tip({ text, children, truncOnly, style, className }) {
  const ref = useRef(null);
  const [pos, setPos] = useState(null);
  const hide = () => setPos(null);
  const show = () => {
    const el = ref.current;
    if (!el || !text) return;
    if (truncOnly) { const c = el.firstElementChild || el; if (c.scrollWidth <= c.clientWidth) return; }
    const r = el.getBoundingClientRect();
    const below = r.top < 48;
    setPos({ x: Math.min(Math.max(r.left + r.width / 2, 12), window.innerWidth - 12), y: below ? r.bottom + 6 : r.top - 6, below });
    window.addEventListener("scroll", hide, { capture: true, once: true });
  };
  return (
    <span ref={ref} className={className} style={{ display: "inline-flex", minWidth: 0, ...style }}
      onMouseEnter={show} onMouseLeave={hide} onFocus={show} onBlur={hide} onMouseDown={hide}>
      {children}
      {pos && ReactDOM.createPortal(<div role="tooltip" className={`vtip ${pos.below ? "below" : ""}`} style={{ left: pos.x, top: pos.y }}>{text}</div>, document.body)}
    </span>
  );
}

function ScorecardCell({ value, onCommit, placeholder, style, format, className }) {
  const [local, setLocal] = useState(value ?? "");
  const [focused, setFocused] = useState(false);
  const focusedRef = useRef(false);
  useEffect(() => {
    if (!focusedRef.current) setLocal(value ?? "");
  }, [value]);
  return (
    <input
      type="text"
      value={format && !focused ? format(local) : local}
      placeholder={placeholder}
      style={style}
      className={className}
      onFocus={() => { focusedRef.current = true; setFocused(true); }}
      onBlur={() => {
        focusedRef.current = false;
        setFocused(false);
        if (local !== (value ?? "")) onCommit(local);
        else setLocal(value ?? "");
      }}
      onChange={(e) => {
        const v = e.target.value;
        setLocal(v);
        onCommit(v);
      }}
    />
  );
}

function MyMeasurables({ company, onSave, me }) {
  const mobile = useMobile();

  const measurables = company.scorecard?.measurables || [];
  const entries = company.scorecard?.entries || {};
  const huddles = company.huddles || [{ id: "huddle-1", name: "Weekly Huddle" }];

  // Who the logged-in user is: `me` comes from vast-session (Cortex staff id);
  // the email match is only a defensive last resort.
  const myMemberId = me?.id || null;
  const myEmail = me?.email || null;
  let myMember = members.find(m => m.id === myMemberId);
  if (!myMember && myEmail) myMember = members.find(m => m.email?.toLowerCase() === myEmail.toLowerCase());
  const myName = myMember?.name || me?.name;

  // Filter measurables owned by this user
  // If we can't identify the user, show nothing rather than everything
  const mine = myName ? measurables.filter(m => m.owner === myName) : [];

  // Debug info — visible in console to help diagnose
  if (!mine.length) {
    console.log("[VAST] MyMeasurables: myMemberId=", myMemberId, "myEmail=", myEmail, "myName=", myName, "totalMeasurables=", measurables.length, "owners=", [...new Set(measurables.map(m => m.owner))]);
  }

  if (!mine.length) return null;

  // Group by huddle
  const byHuddle = {};
  mine.forEach(m => {
    const hid = m.huddleId || "__none";
    if (!byHuddle[hid]) byHuddle[hid] = [];
    byHuddle[hid].push(m);
  });

  // Build last 3 weeks + current for context
  const qStart = company.quarterStart ? new Date(company.quarterStart) : new Date(Date.now() - 12 * 7 * 86400000);
  const qEnd = company.quarterEnd ? new Date(company.quarterEnd) : new Date();
  const allWeeks = weeksInRange(qStart, qEnd);
  // Show up to 4 weeks: last 2 past, current, next 1
  const curIdx = allWeeks.indexOf(curWk);
  const displayWeeks = mobile
    ? allWeeks.slice(Math.max(0, curIdx - 1), curIdx + 1)   // last week + this week
    : allWeeks.slice(Math.max(0, curIdx - 2), curIdx + 2);  // unchanged desktop

  const meetsGoal = (val, m) => {
    if (val === "" || val === undefined || val === null) return null;
    const v = parseFloat(val), t = parseFloat(m.target);
    if (isNaN(v) || isNaN(t)) return null;
    const op = m.operator || "gte";
    if (op === "gte") return v >= t;
    if (op === "lte") return v <= t;
    if (op === "gt") return v > t;
    if (op === "lt") return v < t;
    if (op === "eq") return v === t;
    return null;
  };

  const setEntry = (measId, wk, val) => {
    if (_currentCompanyCode) {

        .catch(e => reportWriteError(e, "Scorecard write"));

    try {

      const jan4 = new Date(year, 0, 4);
      const d = new Date(jan4.getTime() + (week - 1) * 7 * 86400000);
      // Go to Monday of that week
      const day = d.getDay();
      d.setDate(d.getDate() - (day === 0 ? 6 : day - 1));

              <div style={{ fontSize: C.fs.xs, fontWeight: 600, color: C.textMuted, marginBottom: 8 }}>{hudName}</div>
            )}
            {/* Week header row */}
            {!mobile && (
            <div style={{ overflowX: "auto" }}>
              <table style={{ width: "100%", borderCollapse: "collapse", minWidth: 360 }}>
                <thead>
                  <tr>
                    <th style={{ textAlign: "left", padding: "6px 0", fontSize: C.fs.xs, fontWeight: 600, color: C.textMuted, width: "40%" }}>Measurable</th>
                    <th style={{ textAlign: "center", padding: "6px 4px", fontSize: C.fs.xs, fontWeight: 600, color: C.textMuted, minWidth: 52 }}>Goal</th>
                    {displayWeeks.map(wk => (

                        color: wk === curWk ? C.text : C.textMuted, minWidth: 68, whiteSpace: "nowrap" }}>
                        <span className="num">{fmtWk(wk)}</span>
                        {wk === curWk && <div style={{ fontSize: C.fs.xs, color: C.textMuted }}>This week</div>}
                      </th>
                    ))}
                  </tr>
                </thead>
                <tbody>
                  {hMeasurables.map(m => (
                    <tr key={m.id}>
                      <td style={{ padding: "8px 0", borderTop: `1px solid ${C.border}` }}>

                        const met = meetsGoal(val, m);
                        const isCur = wk === curWk;
                        return (
                          <td key={wk} style={{ textAlign: "center", padding: "8px 4px", borderTop: `1px solid ${C.border}`, background: isCur ? C.selBg : "transparent" }}>

// ─── CONFETTI ─────────────────────────────────────────────────────────
function Confetti({ message, onDone }) {
  const canvasRef = React.useRef(null);
  React.useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const colors = C.confetti;
    const particles = Array.from({ length: 160 }, (_, i) => ({
      x: Math.random() * canvas.width,
      y: -20 - Math.random() * 200,
      size: 6 + Math.random() * 9,
      color: colors[Math.floor(Math.random() * colors.length)],
      vx: (Math.random() - 0.5) * 5,
      vy: 1.5 + Math.random() * 4,
      rotation: Math.random() * 360,
      rotSpeed: (Math.random() - 0.5) * 9,
      opacity: 1,
      rect: Math.random() > 0.4,
    }));
    let frame;
    const start = Date.now();
    const animate = () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const elapsed = Date.now() - start;
      particles.forEach(p => {
        p.x += p.vx; p.y += p.vy; p.vy += 0.09;
        p.rotation += p.rotSpeed;
        if (elapsed > 2200) p.opacity = Math.max(0, p.opacity - 0.018);
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rotation * Math.PI / 180);
        ctx.globalAlpha = p.opacity;
        ctx.fillStyle = p.color;
        if (p.rect) { ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); }
        else { ctx.beginPath(); ctx.arc(0, 0, p.size / 2, 0, Math.PI * 2); ctx.fill(); }
        ctx.restore();
      });
      if (elapsed < 3800) { frame = requestAnimationFrame(animate); }
      else { onDone && onDone(); }
    };
    frame = requestAnimationFrame(animate);
    return () => cancelAnimationFrame(frame);
  }, []);
  return (
    <>
      <canvas ref={canvasRef} style={{ position: "fixed", inset: 0, pointerEvents: "none", zIndex: 9999 }} />
      {message && (
        <div style={{ position: "fixed", top: "50%", left: "50%", transform: "translate(-50%,-50%)", zIndex: 10000, pointerEvents: "none", textAlign: "center" }} className="fade-in">
          <div style={{ background: "rgba(0,0,0,0.82)", borderRadius: C.radius.modal, padding: "24px 24px", border: "2px solid rgba(255,255,255,0.15)", backdropFilter: "blur(8px)" }}>
            <div style={{ color: C.onAccent, display: "flex", justifyContent: "center" }}>{message.emoji === "celebrate" ? <Icon.celebrate /> : <Icon.trophy />}</div>
            <div style={{ fontFamily: C.fontUI, fontWeight: 600, fontSize: C.fs.display, color: C.onAccent, marginTop: 8}}>{message.title}</div>
            <div style={{ fontSize: C.fs.md, color: "rgba(255,255,255,0.7)", marginTop: 6 }}>{message.sub}</div>
          </div>
        </div>
      )}
    </>
  );
}

    const ref = window._fbDb.ref(`${VAST_DB_ROOT}/${companyCode}/liveSessions/${huddleId}`);
    ref.on("value", snap => {
      const session = snap.exists() ? snap.val() : null;
      setLiveSession(session);
      // If session is active and I'm not the host → viewer mode
      // Only switch to viewer if we haven't already started as host ourselves
      if (session?.active && session?.hostMemberId && session.hostMemberId !== myMemberId) {
        setIsViewer(prev => {
          // Don't override if we're already in the meeting as host (started=true handled below)
          return true;
        });
        setActiveIdx(session.activeIdx || 0);
        // Mirror the host's state for the viewer in real time. This is a
        // one-way push — viewers don't write back.
        applySnapshot(session.snapshot);
      } else if (!session?.active) {
        // Session ended — exit viewer mode
        setIsViewer(false);
      }
    }, err => console.warn("[VAST] live session listener cancelled:", err && err.message));
    liveRef.current = ref;
    return () => ref.off();
  }, [companyCode, huddleId, myMemberId]);

  // Cleanup timer on unmount
  useEffect(() => {
    return () => {
      if (timerRef.current) clearInterval(timerRef.current);
      if (spinRef.current) clearTimeout(spinRef.current);
    };
  }, []);

  // Snapshot pre-meeting todos once the meeting starts
  useEffect(() => {
    if (started && !preMeetingTodoIds.current) {

      );
    }
  }, [started]);
  // Only show members assigned to this huddle (or all if huddle has no member list yet)
  const allMembers = activeMembers(company);
  const huddleObj = (company.huddles || []).find(h => h.id === huddleId) || {};
  const huddleMemberIds = huddleObj.memberIds;
  const members = huddleMemberIds && huddleMemberIds.length > 0
    ? allMembers.filter(m => huddleMemberIds.includes(m.id))
    : allMembers;

  const addToProblemQueue = (item) => {
    if ((company.problemQueue || []).find(p => p.id === item.id)) return; // already queued — no-op
    onAdd("problemQueue", { ...item, huddleId: huddleId, id: item.id });
  };
  const seg = agenda[activeIdx];
  const segLimit = seg.minutes * 60;
  const segElapsed = segTimes[activeIdx] || 0;
  const over = segElapsed > segLimit;
  const fmt = (s) => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;

  useEffect(() => {
    if (started && !done) {
      timerRef.current = setInterval(() => {
        setElapsed(e => e + 1);
        setSegTimes(t => ({ ...t, [activeIdx]: (t[activeIdx] || 0) + 1 }));
      }, 1000);
    }
    return () => clearInterval(timerRef.current);
  }, [started, activeIdx, done]);

  // ── Snapshot persistence ────────────────────────────────────────────────
  // Save the substantive local state to liveSessions/{huddleId} so a reload
  // (or another device) can resume mid-meeting from the last stage change.
  // Called on every step navigation — NOT on every keystroke, which would be
  // wasteful. Intermediate edits within a step are best-effort: if the host
  // reloads before advancing, in-progress notes for that step are lost.
  const persistSessionSnapshot = (newActiveIdx) => {
    if (isViewer || done) return;
    if (!companyCode || !huddleId) return;
    const snapshot = {
      elapsed,
      segTimes,
      notes,
      attendance,
      spotlight,
      alreadySelected,
      focusQueue,
      activeIssueId,
      issueNotes,
      solvedThisSession,
      memberRatings,
    };
    updateLiveSession(companyCode, huddleId, { activeIdx: newActiveIdx, snapshot }).catch(e => console.warn("[VAST] Live session sync failed:", e));
  };

  const applySnapshot = (s) => {
    if (!s) return;
    if (typeof s.elapsed === "number") setElapsed(s.elapsed);
    if (s.segTimes) setSegTimes(s.segTimes);
    if (s.notes) setNotes(s.notes);
    if (s.attendance) setAttendance(s.attendance);
    if (s.spotlight !== undefined) setSpotlight(s.spotlight);
    if (s.alreadySelected) setAlreadySelected(s.alreadySelected);
    if (s.focusQueue) setFocusQueue(s.focusQueue);
    if (s.activeIssueId !== undefined) setActiveIssueId(s.activeIssueId);
    if (s.issueNotes) setIssueNotes(s.issueNotes);
    if (s.solvedThisSession) setSolvedThisSession(s.solvedThisSession);
    if (s.memberRatings) setMemberRatings(s.memberRatings);
  };

  const next = () => {
    if (isViewer) return; // viewers can't control
    const n = Math.min(agenda.length - 1, activeIdx + 1);
    setActiveIdx(n);
    persistSessionSnapshot(n);
  };
  const prev = () => {
    if (isViewer) return;
    const n = Math.max(0, activeIdx - 1);
    setActiveIdx(n);
    persistSessionSnapshot(n);
  };

  const [quickAddSaving, setQuickAddSaving] = useState(false);
  const addHeadline = async () => {
    if (!newHeadline.text.trim() || quickAddSaving) return;
    setQuickAddSaving(true);
    try {
      // Use a functional onSave only — the previous code also did a
      // `.push()` straight to /data/headlines which turned the parent into an
      // object map and then got immediately overwritten by the onSave's array
      // form, creating a race window where snapshots could land mid-write.
      const h = { id: uid(), type: newHeadline.type, text: newHeadline.text, huddleId: huddleId, date: now() };
      onAdd("headlines", h);
      setNewHeadline(n => ({ ...n, text: "" }));
    } catch (e) {
      console.error("[VAST] Failed to add headline:", e);
    } finally { setQuickAddSaving(false); }
  };
  const addTodo = async () => {
    if (!newTodo.title.trim() || quickAddSaving) return;
    setQuickAddSaving(true);
    try {
      const t = { id: uid(), title: newTodo.title, assignees: newTodo.assignees || [], dueDate: newTodo.dueDate, huddleId: huddleId, done: false, createdAt: now() };
      onAdd("todos", t);
      setNewTodo({ title: "", assignees: [], dueDate: defaultDueDate() });
    } catch (e) {
      console.error("[VAST] Failed to add todo:", e);
    } finally { setQuickAddSaving(false); }
  };
  const addIssue = async () => {
    if (!newIssue.title.trim() || quickAddSaving) return;
    setQuickAddSaving(true);
    try {
      const iss = { id: uid(), title: newIssue.title, priority: newIssue.priority, status: "open", huddleId: huddleId, createdAt: now() };
      onAdd("issues", iss);
      setNewIssue({ title: "", priority: "2" });
    } catch (e) {
      console.error("[VAST] Failed to add issue:", e);
    } finally { setQuickAddSaving(false); }
  };

  const autoSelect = () => {
    const present = members.filter(m => attendance[m.id] !== false);
    const pool = present.filter(m => !alreadySelected.includes(m.id));
    if (!pool.length) return;
    setSpotlight(null);
    setSpinning(true);
    let count = 0;
    const total = 18;
    const cycle = () => {
      const idx = Math.floor(Math.random() * pool.length);
      setSpotlight(pool[idx]);
      count++;
      if (count < total) {
        spinRef.current = setTimeout(cycle, 40 + count * 6);
      } else {
        setSpinning(false);
        setAlreadySelected(s => [...s, pool[idx].id]);
      }
    };
    cycle();
  };

  const buildRecap = (mtgData, avgRating) => {
    const d = new Date(mtgData.date);
    const dateLabel = d.toLocaleDateString("en-US", { weekday: "long", month: "long", day: "numeric", year: "numeric" });
    const lines = [];
    lines.push(`VAST WEEKLY HUDDLE RECAP`);
    lines.push(`${huddleName} — ${dateLabel}`);
    lines.push(`Duration: ${Math.round(elapsed / 60)} min  |  Meeting Rating: ${avgRating}/10`);
    lines.push("");

    // Attendance — use huddle-filtered members list, not all company members
    const present = members.filter(m => attendance[m.id] !== false);
    if (present.length) {
      lines.push("ATTENDEES");
      lines.push(present.map(m => m.name).join(", "));
      lines.push("");
    }

    // Headlines
    const activeHeadlines = (company.headlines || []).filter(h => !h.reviewed && (h.huddleId === huddleId || !h.huddleId));
    if (activeHeadlines.length) {
      lines.push("HEADLINES FROM THE WEEK");
      activeHeadlines.forEach(h => lines.push(`  [${h.type.toUpperCase()}] ${h.text}`));
      lines.push("");
    }

    // Quarterly tasks — off track
    const offTrack = (company.quarterlyTasks || []).filter(t => t.status === "off" && (t.huddleId === huddleId || !t.huddleId));
    if (offTrack.length) {
      lines.push("OFF-TRACK QUARTERLY TASKS");
      offTrack.forEach(t => lines.push(`  ✗ ${t.title}${t.who ? ` (${t.who})` : ""}`));
      lines.push("");
    }

    // All open to-dos grouped by assignee
    const today = new Date(); today.setHours(0,0,0,0);
    const todayStr = new Date().toISOString().slice(0,10);
    const allOpen = (company.todos || []).filter(t => !t.done && (t.huddleId === huddleId || !t.huddleId));
    if (allOpen.length) {
      lines.push("OPEN TO-DOS BY TEAM MEMBER");
      // Group by assignee
      const grouped = {};
      allOpen.forEach(t => {
        const assignees = getAssignees(t);
        if (assignees.length === 0) {
          if (!grouped["Unassigned"]) grouped["Unassigned"] = [];
          grouped["Unassigned"].push(t);
        } else {
          assignees.forEach(name => {
            if (!grouped[name]) grouped[name] = [];
            grouped[name].push(t);
          });
        }
      });
      Object.entries(grouped).sort(([a],[b]) => a === "Unassigned" ? 1 : b === "Unassigned" ? -1 : a.localeCompare(b)).forEach(([name, items]) => {
        lines.push(`  ${name}:`);
        items.forEach(t => {
          const isOverdue = t.dueDate && new Date(t.dueDate) < today;
          const isNew = t.createdAt && t.createdAt.slice(0,10) === todayStr;
          const tag = isOverdue ? " ⚠ OVERDUE" : isNew ? " NEW" : "";
          lines.push(`    □ ${t.title}${t.dueDate ? ` (Due ${dateStr(new Date(t.dueDate))})` : ""}${tag}`);
        });
      });
      lines.push("");
    }

    // Problems solved
    if (solvedThisSession.length) {
      lines.push("PROBLEMS SOLVED");
      solvedThisSession.forEach(s => lines.push(`  ✓ ${s.title}${s.notes ? `: ${s.notes}` : ""}`));
      lines.push("");
    }

    // Notes
    if (notes.conclude) {
      lines.push("MEETING NOTES");
      lines.push(`  ${notes.conclude}`);
      lines.push("");
    }

    // Individual ratings
    const ratingEntries = Object.entries(memberRatings);
    if (ratingEntries.length > 1) {
      lines.push("INDIVIDUAL RATINGS");
      ratingEntries.forEach(([mid, score]) => {
        const m = toArray(company.members).find(x => x.id === mid);
        lines.push(`  ${m ? m.name : "Member"}: ${score}/10`);
      });
      lines.push(`  Average: ${avgRating}/10`);
      lines.push("");
    }

    lines.push("—".repeat(40));
    lines.push("Generated by VAST Platform");
    return lines.join("\n");
  };

  const finishMeeting = async () => {
    if (done || meetingSaving) return; // guard against double-submit
    setMeetingSaving(true);
    setMeetingError("");
    const scores = Object.values(memberRatings).filter(Boolean);
    const avgRating = scores.length > 0 ? Math.round(scores.reduce((a, b) => a + b, 0) / scores.length) : rating;
    if (!avgRating) { setMeetingSaving(false); return; }
    try {
    // Fetch the very latest data from Firebase before saving the recap,
    // so the meeting record reflects everyone's entries (scorecard, issues, todos)
    let freshData = null;
    if (_currentCompanyCode) {
      try {
        const fresh = await fbGet(`${VAST_DB_ROOT}/${_currentCompanyCode}/data`);
        if (fresh && typeof fresh === "object") {
          if (fresh.code !== _currentCompanyCode) fresh.code = _currentCompanyCode;
          applyMigrations(fresh);
          freshData = fresh;
        }
      } catch(e) { console.warn("[VAST] Could not pre-fetch latest data for recap:", e); }
    }
    const builtRecap = buildRecap({ date: now() }, avgRating);
    setRecapText(builtRecap);
    // Use freshData (just refreshed from Firebase) for the freshest data
    const latestData = freshData || company;
    const mtg = {
      id: uid(), date: now(), rating: avgRating, memberRatings, totalMinutes: Math.round(elapsed / 60),
      huddleId, huddleName,
      notes, headlines: (latestData.headlines || []).filter(h => !h.reviewed).slice(-5),
      reviewedHeadlines: (latestData.headlines || []).filter(h => h.reviewed).slice(-20),
      completedTodos: (latestData.todos || []).filter(t => t.done).slice(-20),
      todos: (latestData.todos || []).filter(t => !t.done).slice(-5),
      solvedProblems: solvedThisSession,
      recapText: builtRecap,
      // Names of members marked present (same list the recap's ATTENDEES line uses)
      attendees: members.filter(m => attendance[m.id] !== false).map(m => m.name)
    };
    // Archive quarter snapshot (once per quarter, keyed by currentQuarter)
    const qh = latestData.quarterHistory || [];
    const qLabel = latestData.currentQuarter || "Unknown Quarter";
    const existingIdx = qh.findIndex(q => q.quarter === qLabel);
    const snapshot = {
      quarter: qLabel,
      ...(quarterDatesFromLabel(qLabel) || {}),
      archivedAt: now(),
      tasks: (latestData.quarterlyTasks || []).map(t => ({ title: t.title, who: t.who, status: t.status, statusHistory: t.statusHistory })),
      todos: (latestData.todos || []).map(t => ({ title: t.title, assignee: getAssignees(t).join(", "), assignees: getAssignees(t), done: t.done })),
      solvedProblems: [
        ...(existingIdx >= 0 ? (qh[existingIdx].solvedProblems || []) : []),
        ...solvedThisSession
      ],
      meetingRatings: [
        ...(existingIdx >= 0 ? (qh[existingIdx].meetingRatings || []) : []),
        { date: now(), rating: avgRating }
      ]
    };
    const newQH = existingIdx >= 0
      ? qh.map((q, i) => i === existingIdx ? snapshot : q)
      : [...qh, snapshot];
    const allHuddles = latestData.huddles || [{ id: "huddle-1", name: "Weekly Huddle" }];
    const updatedHuddles = allHuddles.map(h => h.id === huddleId
      ? { ...h, meetings: [...(h.meetings || []), mtg] }
      : h
    );
    // Write only the fields that changed — avoids overwriting other members'
    // scorecard entries or issues that were saved via direct Firebase paths
    const newMeetings = [...toArray(freshData?.meetings || company.meetings), mtg];
    if (_currentCompanyCode) {
      // FIX 3: Atomic multi-path update to avoid dual-write race condition
      await fbUpdate(`${VAST_DB_ROOT}/${_currentCompanyCode}/data`, {
        meetings: newMeetings,
        huddles: updatedHuddles,
        quarterHistory: newQH,
      });
    }
    // Also update local state so done screen renders immediately
    onSave({ huddles: updatedHuddles, meetings: newMeetings, quarterHistory: newQH });
    setRating(avgRating);
    setShowRecap(true);
    setDone(true);
    clearInterval(timerRef.current);
    clearTimeout(spinRef.current);
    } catch (e) {
      console.error("[VAST] Failed to finish meeting:", e);
      setMeetingError("Something went wrong saving the meeting. Please try again.");
    } finally {
      // End the live session FIRST so the sidebar indicator clears before
      // the meeting UI unmounts. await means the local Firebase cache is
      // updated synchronously and the sidebar listener fires immediately.
      if (!isViewer) {
        try {
          await endLiveSession(companyCode || _currentCompanyCode, huddleId);
          console.debug("[VAST/session] endLiveSession completed", { huddleId });
        } catch (e) {
          console.warn("[VAST] endLiveSession failed:", e);
        }
      }
      setMeetingSaving(false);
    }
  };

  if (done) {
    const recap = recapText || buildRecap({ date: now() }, rating);
    const resetMeeting = () => { setStarted(false); setActiveIdx(0); setElapsed(0); setSegTimes({}); setRating(0); setMemberRatings({}); setDone(false); setShowRecap(false); setNotes({}); setAttendance({}); setSpotlight(null); setAlreadySelected([]); setFocusQueue([]); setActiveIssueId(null); setIssueNotes({}); setSolvedThisSession([]); setIDSAdded({}); setConfetti(null); confettiFired.current = { todos: false, ids: false }; preMeetingTodoIds.current = null; clearTimeout(spinRef.current); setIsViewer(false); endLiveSession(companyCode || _currentCompanyCode, huddleId).catch(e => console.warn("[VAST] Failed to end live session on reset:", e)); };
    // Recipients + mailto parts for Send Recap (unchanged logic, computed up front
    // so the buttons can sit in the header row).
    const doneHuddleObj = (company.huddles || []).find(h => h.id === huddleId);
    const doneHuddleMemberIds = doneHuddleObj?.memberIds || [];
    const doneAllMembers = activeMembers(company);
    const recipientPool = doneHuddleMemberIds.length > 0
      ? doneAllMembers.filter(m => doneHuddleMemberIds.includes(m.id))
      : doneAllMembers;
    const emails = recipientPool.map(m => m.email).filter(Boolean).join(",");
    const subject = encodeURIComponent(`${huddleName} Recap — ${dateStr(new Date())}`);
    const body = encodeURIComponent(recap);
    // Stat tiles — read-only, from this meeting's saved record and session state.
    const savedMtg = toArray(doneHuddleObj?.meetings).slice(-1)[0];
    const endT = savedMtg && savedMtg.date ? new Date(savedMtg.date).getTime() : null;
    const startT = endT != null ? endT - elapsed * 1000 : null;
    const todosCreated = startT != null
      ? toArray(company.todos).filter(t => t && (t.huddleId === huddleId || !t.huddleId) && t.createdAt && new Date(t.createdAt).getTime() >= startT - 1000 && new Date(t.createdAt).getTime() <= endT + 1000).length
      : null;
    const tiles = (
      <div className="hd-tiles">
        <span className="hd-tile"><b>{rating}/10</b>average rating</span>
        <span className="hd-tile"><b>{fmt(elapsed)}</b>duration</span>
        {todosCreated != null && <span className="hd-tile"><b>{todosCreated}</b>to-do{todosCreated === 1 ? "" : "s"} created</span>}
        <span className="hd-tile"><b>{solvedThisSession.length}</b>issue{solvedThisSession.length === 1 ? "" : "s"} solved</span>
      </div>
    );
    const doneButtons = (
      <div className="hd-done-btns">
        <button className="btn-secondary" onClick={() => { navigator.clipboard.writeText(recap).catch(e => console.warn("[VAST] Clipboard copy failed:", e)); }}>
          <Icon.copy /> Copy Recap
        </button>
        <button className="btn-secondary" onClick={() => { window.location.href = `mailto:${emails}?subject=${subject}&body=${body}`; }}>
          <Icon.mail /> Send Recap
        </button>
        <button className="btn-primary" onClick={resetMeeting}>
          End & Return to Dashboard
        </button>
      </div>
    );
    return (
      <Layout title="Meeting complete" subtitle={`${huddleName} · ${dateStr(new Date())}`}
        header={mobile ? null : <div className="hd-done-h"><h1>Meeting complete</h1>{tiles}{doneButtons}</div>}>
        <div className="fade-in">
          {mobile && (
            <div className="panel" style={{ marginBottom: 12, padding: 12, display: "flex", flexDirection: "column", gap: 12 }}>
              {tiles}{doneButtons}
            </div>
          )}
          <div className="panel">
            <div className="panel-h">
              <h3>Meeting recap</h3>
              <span style={{ fontSize: C.fs.sm, color: C.textMuted }}>{huddleName} · <span className="num">{dateStr(new Date())}</span></span>
            </div>
            <div className="panel-b"><RecapView text={recap} /></div>
          </div>
        </div>
      </Layout>
    );
  }

  // ── Viewer mode: following the host live ──────────────────────────────
  // isViewer — viewer banner shown inline inside main meeting layout (see below)
  // Viewers see the full meeting content, read-only, auto-following the host

  // ── Pre-meeting: live session exists → offer to join ──────────────────
  if (!started && liveSession?.active && liveSession.hostMemberId !== myMemberId) {
    return (
      <Layout title={huddleName} subtitle="Meeting in progress">
        <div style={{ maxWidth: 500, margin: "0 auto", textAlign: "center" }}>
          <div className="card" style={{ padding: 24 }}>
            <div style={{ marginBottom: 16, color: C.blue }}><Icon.signal size={48} /></div>
            <div style={{ fontFamily: C.fontUI, fontSize: C.fs.title, fontWeight: 600, marginBottom: 8 }}>Meeting in Progress</div>
            <div style={{ fontSize: C.fs.base, color: C.textMuted, marginBottom: 24 }}>
              <strong>{liveSession.hostName || "Your team"}</strong> is currently running this huddle. Join to follow along live.
            </div>
            <button className="btn-primary" style={{ width: "100%", padding: 16, fontSize: C.fs.md, marginBottom: 12 }}
              onClick={() => { setIsViewer(true); setStarted(true); }}>
              <Icon.signal /> Join Live Meeting
            </button>
            <div style={{ fontSize: C.fs.xs, color: C.textDim }}>Your screen will follow the host automatically.</div>
          </div>
        </div>
      </Layout>
    );
  }

  if (!started) {
    // Host-resumable: there's already an active session and I'm the one who
    // started it (typical case: I reloaded the browser mid-huddle). Clicking
    // the button will pick up at the current activeIdx instead of stamping
    // a fresh session record.
    const isResumable = liveSession?.active && liveSession.hostMemberId === myMemberId;
    return (
      <Layout title={huddleName} subtitle={isResumable
        ? `In progress · Step ${(liveSession.activeIdx || 0) + 1} of ${agenda.length} — click Resume to continue`
        : `${agenda.reduce((s,a)=>s+a.minutes,0)} min · Adjust times before starting`}>
        <div style={{ maxWidth: 600, margin: "0 auto" }}>
          <div className="card" style={{ marginBottom: 20 }}>
            <h3 style={{ fontSize: C.fs.title, marginBottom: 16 }}>Meeting Agenda</h3>
            <div style={{ fontSize: C.fs.xs, color: C.textMuted, marginBottom: 12, fontStyle: "italic" }}>Click any time to adjust — saved as your default for this huddle.</div>
            {agenda.map((a, i) => (
              <div key={a.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "8px 0", borderBottom: `1px solid ${C.border}` }}>
                <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                  <div style={{ width: 28, height: 28, background: C.surface2, borderRadius: C.radius.control, display: "flex", alignItems: "center", justifyContent: "center", fontSize: C.fs.xs, fontWeight: 600, color: C.textMuted }}>{i + 1}</div>
                  <span style={{ fontSize: C.fs.md }}>{a.label}</span>
                </div>
                <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
                  <input
                    type="number"
                    min="1"
                    max="180"
                    value={a.minutes}
                    onChange={e => {
                      const val = Math.max(1, parseInt(e.target.value) || 1);
                      const allHuddles = company.huddles || [];
                      const updated = allHuddles.map(h => h.id === huddleId
                        ? { ...h, agendaMins: { ...(h.agendaMins || {}), [a.id]: val } }
                        : h
                      );
                      onSave({ huddles: updated });
                    }}
                    style={{ width: 52, textAlign: "center", padding: "4px 6px", fontSize: C.fs.sm, fontWeight: 600, border: `1px solid ${C.border}`, borderRadius: C.radius.control, background: C.surface2, color: C.text, fontFamily: C.fontUI }}
                  />
                  <span style={{ fontSize: C.fs.sm, color: C.textMuted }}>min</span>
                </div>
              </div>
            ))}
            <div style={{ display: "flex", justifyContent: "space-between", padding: "12px 0", color: C.textMuted, fontSize: C.fs.base }}>
              <span>Total</span><span style={{ fontWeight: 600, color: C.text }}>{agenda.reduce((s, a) => s + a.minutes, 0)} min</span>
            </div>
          </div>
          <button className="btn-primary" style={{ width: "100%", padding: "16px", fontSize: C.fs.md }} onClick={async () => {
            if (meetingSaving) return;
            setIsViewer(false);
            // Resume path: I'm already the host of an active session (e.g., I
            // reloaded mid-meeting). Restore the saved activeIdx and drop me
            // back into the live view without re-creating the session record.
            if (isResumable) {
              setActiveIdx(liveSession.activeIdx || 0);
              applySnapshot(liveSession.snapshot);
              setStarted(true);
              return;
            }
            if (companyCode && myMemberId) {
              const hostName = toArray(company.members).find(m => m.id === myMemberId)?.name || me?.name || "Host";
              try {
                await startLiveSession(companyCode, huddleId, myMemberId, hostName);
                setStarted(true);
              } catch (e) {
                console.error("[VAST] Failed to start live session:", e);
                setMeetingError("Failed to start huddle. Please try again.");
              }
            } else {
              setStarted(true);
            }
          }} disabled={meetingSaving}>
            {isResumable ? "Resume Huddle" : "Start Huddle"}
          </button>
        </div>
      </Layout>
    );
  }

  // Step content is shared by the phone frame and the desktop frame below.
  const stepContent = (
    <>

          {/* SCORING segment */}
          {activeIdx === 1 && (() => {
