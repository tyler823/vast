// ─── MEETING HISTORY ──────────────────────────────────────────────────
function MeetingHistory({ company }) {
  // Newest first (by meeting date) so the most recent meeting is selected by default.
  const allMeetings = [...(company.meetings || [])].reverse().sort((a, b) => new Date(b.date) - new Date(a.date));
  const [selectedId, setSelectedId] = React.useState(null);
  const [mobileDetail, setMobileDetail] = React.useState(false);
  const [copied, setCopied] = React.useState(null);
  const [huddleFilter, setHuddleFilter] = React.useState("all");
  const huddles = company.huddles || [];
  const allMembers = activeMembers(company);

  const meetings = huddleFilter === "all" ? allMeetings : allMeetings.filter(m => m.huddleId === huddleFilter);

  const copyRecap = (m) => {
    navigator.clipboard.writeText(m.recapText).catch(e => console.warn("[VAST] Clipboard copy failed:", e));
    setCopied(m.id);
    setTimeout(() => setCopied(null), 2000);
  };

  const sendRecapEmail = (m) => {
    const huddleObj = huddles.find(h => h.id === m.huddleId);
    const huddleMemberIds = huddleObj?.memberIds || [];
    // Get emails of members assigned to this huddle (fall back to all members if none assigned)
    const recipientPool = huddleMemberIds.length > 0
      ? allMembers.filter(mem => huddleMemberIds.includes(mem.id))
      : allMembers;
    const emails = recipientPool.map(mem => mem.email).filter(Boolean).join(",");
    const subject = encodeURIComponent(`${m.huddleName || huddleObj?.name || "Weekly Huddle"} Recap — ${dateStr(new Date(m.date))}`);
    const body = encodeURIComponent(m.recapText || "Meeting recap not available.");
    window.location.href = `mailto:${emails}?subject=${subject}&body=${body}`;
  };

  const selected = meetings.find(m => m.id === selectedId) || meetings[0] || null;
  const rated = meetings.filter(m => Number(m.rating) > 0);
  const timed = meetings.filter(m => Number(m.totalMinutes) > 0);
  const avgRating = rated.length ? (rated.reduce((a, m) => a + Number(m.rating), 0) / rated.length).toFixed(1) : null;
  const avgMinutes = timed.length ? Math.round(timed.reduce((a, m) => a + Number(m.totalMinutes), 0) / timed.length) : null;
  const ratingColor = (r) => r >= 8 ? C.green : r >= 6 ? C.amber : C.red;
  const huddleLabelOf = (m) => m.huddleName || (huddles.find(h => h.id === m.huddleId)?.name) || "Huddle";
  const countFor = (id) => allMeetings.filter(m => m.huddleId === id).length;

  return (
    <Layout title="Meeting History" subtitle={`${meetings.length} meeting${meetings.length !== 1 ? "s" : ""} on record`}>
      <div>
        <div className="panel" style={{ marginBottom: 12 }}>
          <div className="strip">
            <span><b>{meetings.length}</b>meeting{meetings.length !== 1 ? "s" : ""} on record</span>
            <span><b>{avgRating ?? "—"}</b>average rating</span>
            <span><b>{avgMinutes ?? "—"}</b>min average length</span>
          </div>
          {huddles.length > 1 && (
            <div className="tabs" style={{ padding: "0 12px", borderTop: `1px solid ${C.border}`, borderBottom: "none" }} role="tablist">
              <button role="tab" aria-selected={huddleFilter === "all"} className={`tab ${huddleFilter === "all" ? "active" : ""}`} onClick={() => setHuddleFilter("all")}>All huddles<span className="cnt">{allMeetings.length}</span></button>
              {huddles.map(h => (
                <button key={h.id} role="tab" aria-selected={huddleFilter === h.id} className={`tab ${huddleFilter === h.id ? "active" : ""}`} onClick={() => setHuddleFilter(h.id)}>{h.name}<span className="cnt">{countFor(h.id)}</span></button>
              ))}
            </div>
          )}
        </div>

        {meetings.length === 0 ? (
          <div className="panel"><div className="panel-b" style={{ color: C.textMuted, fontSize: C.fs.sm }}>No meetings yet{huddleFilter !== "all" ? " for this huddle" : ""}. Run your first Weekly Huddle to see history here.</div></div>
        ) : (
          <div className={`md ${mobileDetail ? "has-sel" : ""}`}>
            <div className="md-list-col panel md-list" role="listbox" aria-label="Meetings">
              {meetings.map(m => {
                const sel = selected && selected.id === m.id;
                return (
                  <button key={m.id} role="option" aria-selected={sel} className={`md-row ${sel ? "sel" : ""}`} onClick={() => { setSelectedId(m.id); setMobileDetail(true); }}>
                    <span className="num" style={{ minWidth: 92, fontWeight: 600 }}>{dateStr(new Date(m.date))}</span>
                    <span style={{ flex: 1, minWidth: 0, color: C.textMuted, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{huddleLabelOf(m)}</span>
                    <span className="num" style={{ color: C.textMuted }}>{m.totalMinutes || "—"}m</span>
                    <span style={{ display: "inline-flex", alignItems: "center", gap: 6, minWidth: 34, justifyContent: "flex-end" }}>
                      <span className="dot" style={{ background: ratingColor(m.rating) }} aria-hidden="true" />
                      <span className="num" style={{ fontWeight: 600 }}>{m.rating ?? "—"}</span>
                    </span>
                  </button>
                );
              })}
            </div>
            {selected && (
              <div className="md-detail-col panel">
                <div className="panel-h">
                  <div style={{ display: "flex", alignItems: "center", gap: 12, flexWrap: "wrap", minWidth: 0 }}>
                    <button className="btn-ghost md-back" onClick={() => setMobileDetail(false)}><Icon.arrowLeft /> Back</button>
                    <span className="num" style={{ fontWeight: 600, fontSize: C.fs.md }}>{dateStr(new Date(selected.date))}</span>
                    <span style={{ color: C.textMuted }}>{huddleLabelOf(selected)}</span>
                    <span className="num" style={{ color: C.textMuted }}>{selected.totalMinutes || "—"} min</span>
                    <span style={{ display: "inline-flex", alignItems: "center", gap: 6 }}>
                      <span className="dot" style={{ background: ratingColor(selected.rating) }} aria-hidden="true" />
                      <span className="num" style={{ fontWeight: 600 }}>{selected.rating ?? "—"}</span><span style={{ color: C.textMuted }}>/ 10</span>
                    </span>
                  </div>
                  {selected.recapText && (
                    <div style={{ display: "flex", gap: 8 }}>
                      <button className="btn-secondary" onClick={e => { e.stopPropagation(); copyRecap(selected); }}
                        style={copied === selected.id ? { background: C.greenTint, color: C.green } : undefined}>
                        {copied === selected.id ? <><Icon.check /> Copied</> : "Copy Recap"}
                      </button>
                      <button className="btn-secondary" onClick={e => { e.stopPropagation(); sendRecapEmail(selected); }}>
                        <Icon.mail /> Send Recap
                      </button>
                    </div>
                  )}
                </div>
                <div className="panel-b">
                  {selected.recapText ? <RecapView text={selected.recapText} /> : (
                    <>
                      {selected.notes?.conclude && <div style={{ fontSize: C.fs.sm, color: C.text, maxWidth: "90ch", marginBottom: 8 }}>{selected.notes.conclude}</div>}
                      <div style={{ fontSize: C.fs.sm, color: C.textDim }}>No recap stored for this meeting.</div>
                    </>
                  )}
                </div>
              </div>
            )}
          </div>
        )}
      </div>
    </Layout>
  );
}

// Display-only, structured view of a saved recap. It reads the recap TEXT
// (the same text Copy/Send use) and never changes it. Anything it can't
// recognise is shown as plain text.
const RECAP_SECTIONS = {
  "ATTENDEES": "Attendees", "HEADLINES FROM THE WEEK": "Headlines", "OFF-TRACK QUARTERLY TASKS": "Off-track quarterly tasks",
  "OPEN TO-DOS BY TEAM MEMBER": "Open to-dos by person", "PROBLEMS SOLVED": "Problems solved", "MEETING NOTES": "Meeting notes", "INDIVIDUAL RATINGS": "Individual ratings",
};
function parseRecap(text) {
  const lines = String(text || "").split("\n");
  const sections = [];
  let cur = null;
  lines.forEach((ln, i) => {
    if (i < 3) return; // title, huddle — date, duration (shown in the header row)
    if (/^—+$/.test(ln.trim()) || ln.trim() === "Generated by VAST Platform") { cur = null; return; }
    if (!ln.trim()) { cur = null; return; }
    if (!cur && /^[A-Z][A-Z0-9 &'\-]+$/.test(ln.trim())) { cur = { key: ln.trim(), lines: [] }; sections.push(cur); return; }
    if (!cur) { cur = { key: "", lines: [] }; sections.push(cur); }
    cur.lines.push(ln);
  });
  return sections;
}
function RecapView({ text }) {
  const sections = parseRecap(text);
  if (!sections.length) return <pre style={{ fontSize: C.fs.sm, lineHeight: 1.6, color: C.text, whiteSpace: "pre-wrap", fontFamily: C.fontUI, maxWidth: "90ch", margin: 0 }}>{text}</pre>;
  const block = (title, body, key) => <div key={key} style={{ marginBottom: 16 }}><h4 className="sec-title">{title}</h4>{body}</div>;
  return (
    <div>
      {sections.map((sec, si) => {
        const title = RECAP_SECTIONS[sec.key] || (sec.key ? sec.key.charAt(0) + sec.key.slice(1).toLowerCase() : "Notes");
        const raw = sec.lines.map(l => l.trim());
        if (sec.key === "ATTENDEES") return block(title, <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>{raw.join(", ").split(/,\s*/).filter(Boolean).map(n => <span key={n} className="chip" style={{ color: C.text }}>{n}</span>)}</div>, si);
        if (sec.key === "HEADLINES FROM THE WEEK") return block(title, <div>{raw.map((l, i) => { const m = /^\[([A-Z][A-Z ]*)\]\s*(.*)$/.exec(l); return <div key={i} style={{ display: "flex", gap: 8, alignItems: "baseline", padding: "4px 0", maxWidth: "90ch" }}>{m && <span className="chip" style={{ flexShrink: 0 }}>{m[1].charAt(0) + m[1].slice(1).toLowerCase()}</span>}<span>{m ? m[2] : l}</span></div>; })}</div>, si);
        if (sec.key === "OFF-TRACK QUARTERLY TASKS") return block(title, <div>{raw.map((l, i) => { const m = /^✗\s*(.*?)(?:\s\(([^()]*)\))?$/.exec(l); return <div key={i} style={{ display: "flex", gap: 8, alignItems: "center", padding: "4px 0" }}><span className="dot" style={{ background: C.red }} aria-label="Off track" /><span>{m ? m[1] : l}</span>{m && m[2] && <span style={{ color: C.textMuted }}>{m[2]}</span>}</div>; })}</div>, si);
        if (sec.key === "PROBLEMS SOLVED") return block(title, <div>{raw.map((l, i) => { const m = /^✓\s*([^:]*)(?::\s*(.*))?$/.exec(l); return <div key={i} style={{ display: "flex", gap: 8, alignItems: "baseline", padding: "4px 0", maxWidth: "90ch" }}><span className="dot" style={{ background: C.green, alignSelf: "center" }} aria-label="Solved" /><span style={{ fontWeight: 600 }}>{m ? m[1] : l}</span>{m && m[2] && <span style={{ color: C.textMuted }}>{m[2]}</span>}</div>; })}</div>, si);
        if (sec.key === "OPEN TO-DOS BY TEAM MEMBER") {
          const rows = []; let person = "";
          sec.lines.forEach(l => {
            const t = l.trim();
            if (/^□/.test(t)) { const m = /^□\s*(.*?)(?:\s\(Due ([^()]*)\))?(\s⚠ OVERDUE|\sNEW)?$/.exec(t); rows.push({ person, title: m ? m[1] : t, due: m && m[2] ? m[2] : "", tag: m && m[3] ? m[3].trim() : "" }); }
            else if (/:$/.test(t)) person = t.slice(0, -1);
          });
          return block(title, (
            <div className="dt-wrap"><table className="dt" style={{ maxWidth: 900 }}>
              <thead><tr><th>Person</th><th>To-do</th><th className="r">Due</th><th className="shrink"></th></tr></thead>
              <tbody>{rows.map((r, i) => <tr key={i}><td className="muted" style={{ whiteSpace: "nowrap" }}>{i === 0 || rows[i - 1].person !== r.person ? r.person : ""}</td><td>{r.title}</td><td className="r num" style={{ whiteSpace: "nowrap", color: r.tag.includes("OVERDUE") ? C.red : C.textMuted }}>{r.due || "—"}</td>
                <td className="shrink">{r.tag.includes("OVERDUE") ? <span style={{ color: C.red, fontWeight: 600, display: "inline-flex", alignItems: "center", gap: 4 }}><Icon.warning /> Overdue</span> : r.tag === "NEW" ? <span className="chip">New</span> : null}</td></tr>)}</tbody>
            </table></div>
          ), si);
        }
        if (sec.key === "INDIVIDUAL RATINGS") return block(title, (
          <table className="dt" style={{ width: "auto", minWidth: 260 }}><tbody>{raw.map((l, i) => { const m = /^(.*):\s*(.*)$/.exec(l); return <tr key={i}><td style={{ fontWeight: m && m[1] === "Average" ? 600 : 400 }}>{m ? m[1] : l}</td><td className="r num">{m ? m[2] : ""}</td></tr>; })}</tbody></table>
        ), si);
        return block(title, <div style={{ whiteSpace: "pre-wrap", maxWidth: "90ch", fontSize: C.fs.base, lineHeight: 1.6 }}>{raw.join("\n")}</div>, si);
      })}
    </div>
  );
}

// ─── SETTINGS ────────────────────────────────────────────────────────
function Settings({ company, onSave, session }) {
  const [quarterLabel, setQuarterLabel] = useState(company.currentQuarter || "");
  const [quarterStart, setQuarterStart] = useState(company.quarterStart || new Date().toISOString().slice(0,10));
  const [quarterEnd, setQuarterEnd] = useState(company.quarterEnd || new Date(Date.now() + 90 * 86400000).toISOString().slice(0,10));
  // Start New Quarter modal: archive current quarter + carry forward selected unfinished tasks
  const [showNewQuarter, setShowNewQuarter] = useState(false);
  const [nqLabel, setNqLabel] = useState("");
  const [nqStart, setNqStart] = useState("");
  const [nqEnd, setNqEnd] = useState("");
  const [nqCarry, setNqCarry] = useState({});
  const [nqSaving, setNqSaving] = useState(false);
  const openNewQuarter = () => {
    setNqLabel(nextQuarterLabel(company.currentQuarter));
    setNqStart(new Date().toISOString().slice(0,10));
    setNqEnd(new Date(Date.now() + 90 * 86400000).toISOString().slice(0,10));
    const init = {};
    (company.quarterlyTasks || []).forEach(t => { if (t.status === "notdone") init[t.id] = true; });
    setNqCarry(init);
    setNqSaving(false);
    setShowNewQuarter(true);
  };
  // A new quarter name must not match an archived quarter (or the one being
  // archived now) — otherwise the next archive would overwrite that entry.
  const nqDuplicate = !!nqLabel.trim() && (
    (company.quarterHistory || []).some(q => sameQuarterLabel(q.quarter, nqLabel)) ||
    sameQuarterLabel(company.currentQuarter, nqLabel)
  );
  const confirmNewQuarter = () => {
    if (nqSaving) return; // guard against double-submit (no duplicate carried tasks)
    if (nqDuplicate) return;
    setNqSaving(true);
    // Single atomic onSave: archive the outgoing quarter AND clear/carry tasks in one write.
    onSave(latest => {
      // Archive snapshot of the OUTGOING quarter — same structure + update-in-place
      // logic as finishMeeting, keyed to the OLD label, captured BEFORE clearing.
      const qh = latest.quarterHistory || [];
      const oldLabel = latest.currentQuarter || "Unknown Quarter";
      const existingIdx = qh.findIndex(q => q.quarter === oldLabel);
      const snapshot = {
        quarter: oldLabel,
        ...(quarterDatesFromLabel(oldLabel) || {}),
        archivedAt: now(),
        tasks: (latest.quarterlyTasks || []).map(t => ({ title: t.title, who: t.who, status: t.status, statusHistory: t.statusHistory })),
        todos: (latest.todos || []).map(t => ({ title: t.title, assignee: getAssignees(t).join(", "), assignees: getAssignees(t), done: t.done })),
        solvedProblems: existingIdx >= 0 ? (qh[existingIdx].solvedProblems || []) : [],
        meetingRatings: existingIdx >= 0 ? (qh[existingIdx].meetingRatings || []) : []
      };
      const newQH = existingIdx >= 0
        ? qh.map((q, i) => i === existingIdx ? snapshot : q)
        : [...qh, snapshot];
      // Fresh copies of ONLY the checked tasks — new id/createdAt, status reset to "on", notes cleared.
      const carried = (latest.quarterlyTasks || [])
        .filter(t => nqCarry[t.id])
        .map(t => ({
          id: uid(),
          title: t.title, who: t.who, huddleId: t.huddleId,
          smart: t.smart, target: t.target, operator: t.operator,
          status: "on", createdAt: now(), notes: "",
          statusHistory: [{ status: "on", at: now() }],
          carriedFrom: { id: t.id, quarter: oldLabel }
        }));
      return {
        quarterHistory: newQH,
        quarterlyTasks: carried,
        currentQuarter: nqLabel,
        quarterStart: nqStart,
        quarterEnd: nqEnd
      };
    });
    // Keep the Current Quarter card inputs in sync with the new quarter (local UI only).
    setQuarterLabel(nqLabel);
    setQuarterStart(nqStart);
    setQuarterEnd(nqEnd);
    setShowNewQuarter(false);
  };
  const [yearGoal, setYearGoal] = useState(company.yearGoal || {});
  const [annualGoals, setAnnualGoals] = useState(company.annualGoals || [{ id: "goal-1", name: "Annual Goal", futureDate: "", revenue: "", profit: "" }]);
  const [newGoalName, setNewGoalName] = useState("");
  const [companyName, setCompanyName] = useState(company.name || "");
  const [newHuddleName, setNewHuddleName] = useState("");
  const [newNavName, setNewNavName] = useState("");
  const [newOrgName, setNewOrgName] = useState("");
  const huddles = company.huddles || [{ id: "huddle-1", name: "Weekly Huddle" }];
  const navigators = company.navigators || [{ id: "nav-1", name: "Navigator" }];
  const orgCharts = company.orgCharts || [{ id: "org-1", name: "Responsibility Chart" }];

  const addHuddle = () => {
    if (!newHuddleName.trim()) return;
    onSave({ huddles: [...huddles, { id: "huddle-" + uid(), name: newHuddleName.trim() }] });
    setNewHuddleName("");
  };
  const renameHuddle = (id, name) => onSave({ huddles: huddles.map(h => h.id === id ? { ...h, name } : h) });
  const deleteHuddle = (id) => {
    if (huddles.length <= 1) return;
    // Cascade: remove huddle + disassociate data linked to it (don't delete user data, just unlink)
    onSave({
      huddles: huddles.filter(h => h.id !== id),
      scorecard: { ...company.scorecard, measurables: (company.scorecard?.measurables || []).map(m => m.huddleId === id ? { ...m, huddleId: "" } : m) },
      quarterlyTasks: (company.quarterlyTasks || []).map(t => t.huddleId === id ? { ...t, huddleId: "" } : t),
    });
  };

  const addNavigator = () => {
    if (!newNavName.trim()) return;
    const newNav = { id: "nav-" + uid(), name: newNavName.trim(), coreValues: ["","",""], purpose: "", avenue: "", targetMarket: "", different: "", proof: "", promise: "", futureDate: "", revenue: "", profit: "", whatLooksLike: "", majorMotivator: "" };
    onSave({ navigators: [...navigators, newNav] });
    setNewNavName("");
  };
  const renameNavigator = (id, name) => onSave({ navigators: navigators.map(n => n.id === id ? { ...n, name } : n) });
  const deleteNavigator = (id) => { if (navigators.length <= 1) return; onSave({ navigators: navigators.filter(n => n.id !== id) }); };

  const addOrgChart = () => {
    if (!newOrgName.trim()) return;
    const newOrg = { id: "org-" + uid(), name: newOrgName.trim(), dreamer: "", doer: "", salesRoles: [{ role: "Sales/Mktg", members: [""] }], opsRoles: [{ role: "Operations", members: [""] }], financeRoles: [{ role: "Finance", members: [""] }] };
    onSave({ orgCharts: [...orgCharts, newOrg] });
    setNewOrgName("");

  const renameOrgChart = (id, name) => onSave({ orgCharts: orgCharts.map(o => o.id === id ? { ...o, name } : o) });
  const deleteOrgChart = (id) => { if (orgCharts.length <= 1) return; onSave({ orgCharts: orgCharts.filter(o => o.id !== id) }); };

  // Team members are read-only here — the roster syncs from Cortex staff on
  // every load (see reconcileMembers). Invites / add / delete / rename are gone.

  // Wide screens: section list on the left, the chosen section on the right.
  const settingsWide = useViewportWidth() >= 1100;
  const [settingsSec, setSettingsSec] = useState("company");
  const SETTINGS_SECTIONS = [["company", "Company name"], ["huddles", "Huddles"], ["navigators", "Navigators"], ["charts", "Responsibility charts"], ["team", "Team members"], ["quarter", "Current quarter"], ["goals", "Annual goals"]];
  const secCls = (id) => `card set-sec${settingsWide && settingsSec !== id ? " set-hidden" : ""}`;

  return (
    <Layout title="Settings" subtitle={company.name}>
      <div className={settingsWide ? "set-wide" : ""}>
      {settingsWide && (
        <div className="panel md-list" role="tablist" aria-label="Settings sections" style={{ alignSelf: "start" }}>
          {SETTINGS_SECTIONS.map(([id, label]) => (
            <button key={id} role="tab" aria-selected={settingsSec === id} className={`md-row ${settingsSec === id ? "sel" : ""}`} onClick={() => setSettingsSec(id)}>{label}</button>
          ))}
        </div>
      )}
      <div style={{ display: "grid", gridTemplateColumns: settingsWide ? "minmax(0,1fr)" : "repeat(auto-fill,minmax(320px,1fr))", gap: 12, alignContent: "start" }}>
        <div>
          <div className={secCls("company")} style={{ marginBottom: 12 }}>
            <h3 style={{ fontSize: C.fs.md, marginBottom: 16 }}>Company Name</h3>
            <div className="field">
              <input placeholder="Your Company Name" value={companyName} onChange={e => setCompanyName(e.target.value)} onKeyDown={e => e.key === "Enter" && onSave({ name: companyName })} />
            </div>
            <button className="btn-secondary" onClick={() => onSave({ name: companyName })}>Save Name</button>
          </div>
          <div className={secCls("huddles")} style={{ marginBottom: 12 }}>
            <h3 style={{ fontSize: C.fs.md, marginBottom: 4 }}>Huddles</h3>
            <div style={{ fontSize: C.fs.xs, color: C.textMuted, marginBottom: 16 }}>Assign team members to each huddle. Members only appear in their assigned huddle's attendance & spotlight.</div>
            {huddles.map(h => {
              const hMemberIds = h.memberIds || [];
              const toggleMember = (mid) => {
                const next = hMemberIds.includes(mid) ? hMemberIds.filter(id => id !== mid) : [...hMemberIds, mid];
                onSave({ huddles: huddles.map(x => x.id === h.id ? { ...x, memberIds: next } : x) });
              };
              const allMembers = activeMembers(company);
              return (
                <div key={h.id} style={{ marginBottom: 16, paddingBottom: 16, borderBottom: `1px solid ${C.border}` }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: allMembers.length ? 8 : 0 }}>
                    <input value={h.name} onChange={e => renameHuddle(h.id, e.target.value)} style={{ flex: 1, background: "transparent", border: "none", borderBottom: `1px solid ${C.border}`, color: C.text, fontSize: C.fs.base, padding: "4px 0" }} />
                    {huddles.length > 1 && <button className="btn-danger" style={{ padding: "4px 8px", fontSize: C.fs.xs }} onClick={() => deleteHuddle(h.id)}><Icon.trash /></button>}

                    <div style={{ fontSize: C.fs.xs, color: C.textDim, fontStyle: "italic" }}>Add staff in Cortex — they appear here the next time VAST loads.</div>

                    <div style={{ fontSize: C.fs.xs, color: C.textDim, marginTop: 6, fontStyle: "italic" }}>No members assigned — all team members will appear.</div>

            <div style={{ display: "flex", gap: 8, marginTop: 4 }}>

              <button className="btn-secondary" style={{ padding: "8px 12px" }} onClick={addOrgChart}>+ Add</button>

            <div style={{ fontSize: C.fs.xs, color: C.textDim, marginTop: 12, fontStyle: "italic" }}>

              const elapsed = Math.min(100, Math.round(((t - s) / 86400000 / total) * 100));
              return (
                <div style={{ fontSize: C.fs.xs, color: C.textMuted, marginBottom: 12, padding: "8px 12px", background: C.surface2, borderRadius: C.radius.control }}>
                  <span style={{ color: C.text, fontWeight: 600 }}><span className="num">{total}</span> days total</span>
                  {" · "}
                  <span style={{ color: remaining <= 14 ? C.red : remaining <= 30 ? C.amber : C.text, fontWeight: 600 }}><span className="num">{remaining}</span> days remaining</span>

            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              <button className="btn-secondary" onClick={() => onSave({ currentQuarter: quarterLabel, quarterStart, quarterEnd })}>Save Quarter</button>
              <button className="btn-secondary" onClick={openNewQuarter}>Start New Quarter</button>
              <button className="btn-ghost" style={{ fontSize: C.fs.xs }} onClick={() => {

                setQuarterStart(s); setQuarterEnd(e2);
              }}>Reset to 90 days from today</button>
            </div>
          </div>

          <div className={secCls("goals")} style={{ marginBottom: 12 }}>
            <h3 style={{ fontSize: C.fs.md, marginBottom: 4 }}>Annual Goals</h3>
            <div style={{ fontSize: C.fs.xs, color: C.textMuted, marginBottom: 16 }}>Set goals for each company or division. Each can have its own label, target date, revenue, and profit goal.</div>

            {annualGoals.map((g, i) => (
              <div key={g.id} style={{ marginBottom: 20, paddingBottom: 20, borderBottom: `1px solid ${C.border}` }}>
                <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
                  <input
                    value={g.name}
                    onChange={e => {
                      const updated = annualGoals.map(x => x.id === g.id ? { ...x, name: e.target.value } : x);
                      setAnnualGoals(updated);
                      onSave({ annualGoals: updated });
                    }}
                    style={{ flex: 1, background: "transparent", border: "none", borderBottom: `1px solid ${C.border}`, color: C.text, fontSize: C.fs.md, fontWeight: 600, padding: "4px 0", fontFamily: C.fontUI}}
                  />
                  {annualGoals.length > 1 && (
                    <button className="btn-danger" style={{ padding: "4px 8px", fontSize: C.fs.xs }} onClick={() => {
                      const updated = annualGoals.filter(x => x.id !== g.id);
                      setAnnualGoals(updated);
                      onSave({ annualGoals: updated });
                    }}><Icon.trash /></button>
                  )}
                </div>
                <div className="field">
                  <label className="label">Target Date</label>
                  <input type="date" value={g.futureDate || ""} onChange={e => {
                    const updated = annualGoals.map(x => x.id === g.id ? { ...x, futureDate: e.target.value } : x);
                    setAnnualGoals(updated);
                    onSave({ annualGoals: updated });
                  }} />
                </div>
                <div className="grid2">
                  <div className="field">
                    <label className="label">Revenue Goal</label>
                    <input placeholder="$1,000,000" value={g.revenue || ""} onChange={e => {
                      const updated = annualGoals.map(x => x.id === g.id ? { ...x, revenue: e.target.value } : x);
                      setAnnualGoals(updated);
                      onSave({ annualGoals: updated });
                    }} />
                  </div>
                  <div className="field">
                    <label className="label">Profit Goal</label>
                    <input placeholder="$200,000" value={g.profit || ""} onChange={e => {
                      const updated = annualGoals.map(x => x.id === g.id ? { ...x, profit: e.target.value } : x);
                      setAnnualGoals(updated);
                      onSave({ annualGoals: updated });
                    }} />
                  </div>
                </div>
              </div>
            ))}

            <div style={{ display: "flex", gap: 8, marginTop: 4 }}>
              <input placeholder="New goal label (e.g. Subsidiary A)..." value={newGoalName} onChange={e => setNewGoalName(e.target.value)}
                onKeyDown={e => {
                  if (e.key === "Enter" && newGoalName.trim()) {
                    const updated = [...annualGoals, { id: "goal-" + uid(), name: newGoalName.trim(), futureDate: "", revenue: "", profit: "" }];
                    setAnnualGoals(updated);
                    onSave({ annualGoals: updated });
                    setNewGoalName("");
                  }
                }}
                style={{ flex: 1 }} />
              <button className="btn-secondary" style={{ padding: "8px 12px" }} onClick={() => {
                if (!newGoalName.trim()) return;
                const updated = [...annualGoals, { id: "goal-" + uid(), name: newGoalName.trim(), futureDate: "", revenue: "", profit: "" }];
                setAnnualGoals(updated);
                onSave({ annualGoals: updated });
                setNewGoalName("");
              }}>+ Add</button>
            </div>
          </div>
        </div>
      </div>
      </div>

      {showNewQuarter && (() => {
        const carryCandidates = (company.quarterlyTasks || []).filter(t => t.status !== "done");
        const statusLabel = (s) => s === "notdone" ? "Not Done" : s === "off" ? "Off Track" : "On Track";
        return (
          <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowNewQuarter(false)}>
            <div className="modal">
              <h3 style={{ fontSize: C.fs.title, marginBottom: 12 }}>Start New Quarter</h3>
              <div style={{ fontSize: C.fs.sm, color: C.textMuted, marginBottom: 20, lineHeight: 1.5 }}>
                This archives <strong style={{ color: C.text }}>{company.currentQuarter || "the current quarter"}</strong> to Historical Quarters and starts fresh. Checked tasks below are carried into the new quarter; everything else is preserved only in the archive.
              </div>
              <div className="field">
                <label className="label">New Quarter Label</label>
                <input placeholder="e.g. Q1 2025 or Spring Sprint" value={nqLabel} onChange={e => setNqLabel(e.target.value)} autoFocus />
                {nqDuplicate && (
                  <div role="alert" style={{ marginTop: 8, fontSize: C.fs.sm, color: C.red, background: C.redTint1, border: `1px solid ${C.redTint3}`, borderRadius: C.radius.control, padding: "8px 12px" }}>
                    “{nqLabel.trim()}” is already used — by a quarter in Historical Quarters or by the quarter you're closing now. Choose a different name so that quarter's archive isn't overwritten.
                  </div>
                )}
              </div>
              <div className="grid2" style={{ marginBottom: 12 }}>
                <div className="field">
                  <label className="label">Start Date</label>
                  <input type="date" value={nqStart} onChange={e => setNqStart(e.target.value)} />
                </div>
                <div className="field">
                  <label className="label">End Date</label>
                  <input type="date" value={nqEnd} onChange={e => setNqEnd(e.target.value)} />
                </div>
              </div>
              <div className="field">
                <label className="label">Carry Forward Unfinished Tasks</label>
                {carryCandidates.length === 0 ? (
                  <div style={{ fontSize: C.fs.sm, color: C.textMuted, padding: "8px 12px", background: C.surface3, borderRadius: C.radius.control }}>No unfinished tasks to carry forward.</div>
                ) : (
                  <div style={{ maxHeight: 240, overflowY: "auto", border: `1px solid ${C.border}`, borderRadius: C.radius.control }}>
                    {carryCandidates.map(t => (
                      <div key={t.id} style={{ display: "flex", alignItems: "center", gap: 8, padding: "8px 12px", borderBottom: `1px solid ${C.border}` }}>
                        <div className={`checkbox ${nqCarry[t.id] ? "checked" : ""}`} onClick={() => setNqCarry(c => ({ ...c, [t.id]: !c[t.id] }))}>
                          {nqCarry[t.id] && <Icon.check />}
                        </div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ fontSize: C.fs.base, color: C.text, fontWeight: 600 }}>{t.title}</div>
                          {t.who && <div style={{ fontSize: C.fs.xs, color: C.textMuted }}>{t.who}</div>}
                        </div>
                        <span className={t.status === "notdone" ? "tag-notdone" : t.status === "off" ? "tag-off" : "tag-on"}>{statusLabel(t.status)}</span>
                      </div>
                    ))}
                  </div>
                )}
              </div>
              <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
                <button className="btn-primary" style={{ flex: 1 }} disabled={nqSaving || nqDuplicate} onClick={confirmNewQuarter}>Start New Quarter</button>
                <button className="btn-secondary" onClick={() => setShowNewQuarter(false)}>Cancel</button>
              </div>
            </div>
          </div>
        );
      })()}
    </Layout>
  );
}

// ─── REPORTS (read-only) ─────────────────────────────────────────────
// Everything here is computed from the company data the app has already
// loaded. Nothing in this section writes to Firebase or adds a listener.
// Fields added by later saves (completedAt, resolvedAt, statusHistory,
// attendees, quarterStart/quarterEnd) are used when present; older records
// without them fall back to "Not tracked" / partial notes.
const RPT_DAY = 86400000;
const rptVar = (name) => `var(--c-${name.replace(/[A-Z]/g, m => "-" + m.toLowerCase())})`;
const rptParseQ = (label) => {
  const m = /^\s*Q([1-4])\s+(\d{4})\s*$/i.exec(String(label || ""));
  return m ? { q: Number(m[1]), year: Number(m[2]) } : null;
};
const rptSameLabel = (a, b) => String(a || "").trim().replace(/\s+/g, " ").toLowerCase() === String(b || "").trim().replace(/\s+/g, " ").toLowerCase();
const rptQuarterOf = (d) => Math.floor(d.getMonth() / 3) + 1;
// Period = a calendar quarter (q 1–4) or a full year (q 0), in local time.
const rptPeriod = (year, q) => {
  const start = q ? new Date(year, (q - 1) * 3, 1) : new Date(year, 0, 1);
  const end = q ? new Date(year, q * 3, 0, 23, 59, 59, 999) : new Date(year, 11, 31, 23, 59, 59, 999);
  return { year, q, start, end, label: q ? `Q${q} ${year}` : String(year) };
};
const rptFmtDate = (d) => d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const rptPct = (n, d) => d > 0 ? n / d : null;
const rptPctText = (p) => p == null ? "—" : `${Math.round(p * 100)}%`;
const rptNum1 = (v) => v == null || isNaN(v) ? "—" : (Math.round(v * 10) / 10).toString();
// Chart labels: compact for big numbers (152320 → "152k") so labels don't collide.
const rptShort = (v) => { if (v == null || isNaN(v)) return "—"; const a = Math.abs(v); if (a >= 1e6) return (v / 1e6).toFixed(a >= 1e7 ? 0 : 1).replace(/\.0$/, "") + "M"; if (a >= 1e4) return (v / 1e3).toFixed(a >= 1e5 ? 0 : 1).replace(/\.0$/, "") + "k"; return rptNum1(v); };
// Text values in the measurable's unit, same style as the Scorecard ("$136,194.3").
const rptUnitVal = (v, unit) => v == null || isNaN(v) ? "—" : fmtMeasure(rptNum1(v), unit, true);
const rptWeekNum = (key) => parseInt(String(key).split("-W")[1], 10);
// Same rule as the scorecard's target check: blank → no judgement.
const rptMeets = (val, m) => {
  if (val === "" || val === undefined || val === null) return null;
  const v = parseFloat(val), t = parseFloat(m.target);
  if (isNaN(v) || isNaN(t)) return null;
  const op = m.operator || "gte";
  if (op === "gte") return v >= t;
  if (op === "lte") return v <= t;
  if (op === "gt") return v > t;
  if (op === "lt") return v < t;
  if (op === "eq") return v === t;
  return null;
};
const RPT_OPS = { gte: "≥", lte: "≤", gt: ">", lt: "<", eq: "=" };

// All meetings once: data/meetings first, then any huddle copies not already seen.
function rptMeetings(company) {
  const out = []; const seen = new Set();
  toArray(company.meetings).forEach(m => { if (!m) return; if (m.id) { if (seen.has(m.id)) return; seen.add(m.id); } out.push(m); });
  toArray(company.huddles).forEach(h => toArray(h && h.meetings).forEach(m => {
    if (!m || (m.id && seen.has(m.id))) return;
    if (m.id) seen.add(m.id);
    out.push({ ...m, huddleId: m.huddleId || h.id, huddleName: m.huddleName || h.name });
  }));
  return out;
}

// Years that have any dated data (plus the current year), newest first.
function rptYears(company) {
  const ys = new Set([new Date().getFullYear()]);
  const add = (iso) => { if (!iso) return; const d = new Date(iso); if (!isNaN(d)) ys.add(d.getFullYear()); };
  Object.keys((company.scorecard && company.scorecard.entries) || {}).forEach(k => { const y = parseInt(k, 10); if (y > 1990 && y < 3000) ys.add(y); });
  toArray(company.todos).forEach(t => { if (t) { add(t.createdAt); add(t.completedAt); } });
  toArray(company.issues).forEach(i => { if (i) { add(i.createdAt); add(i.resolvedAt); } });
  toArray(company.headlines).forEach(h => { if (h) add(h.date); });
  rptMeetings(company).forEach(m => add(m.date));
  toArray(company.quarterHistory).forEach(q => { const p = q && rptParseQ(q.quarter); if (p) ys.add(p.year); });
  const cq = rptParseQ(company.currentQuarter); if (cq) ys.add(cq.year);
  return [...ys].sort((a, b) => b - a);
}

// Where a quarter's task list comes from. Current calendar quarter → live
// quarterlyTasks; past quarter → the ONE archive entry with that label.
function rptTaskSource(company, year, q, today) {
  const label = `Q${q} ${year}`;
  const p = rptPeriod(year, q);
  if (p.start > today) return { label, tasks: null, note: "This quarter hasn't started yet.", future: true, period: p };
  if (year === today.getFullYear() && q === rptQuarterOf(today)) {
    const named = company.currentQuarter && !rptSameLabel(company.currentQuarter, label) ? `Showing your current quarterly tasks (the quarter is named “${company.currentQuarter}” in Settings).` : null;
    return { label, tasks: toArray(company.quarterlyTasks).filter(Boolean), source: "current", note: named, period: p };
  }
  const matches = toArray(company.quarterHistory).filter(h => h && rptSameLabel(h.quarter, label));
  if (matches.length === 0) return { label, tasks: null, note: `No archived quarter named “${label}” was found in Historical Quarters, so tasks can't be shown for it.`, period: p };
  if (matches.length > 1) return { label, tasks: null, note: `There are ${matches.length} archived quarters named “${label}”. The report won't guess which one is right.`, period: p };
  return { label, tasks: toArray(matches[0].tasks).filter(Boolean), source: "archive", note: null, period: p };
}

// Weeks a task spent Off Track, from its statusHistory (null = no history).
function rptOffWeeks(hist, until) {
  const h = toArray(hist).filter(x => x && x.at && !isNaN(new Date(x.at))).sort((a, b) => new Date(a.at) - new Date(b.at));
  if (!h.length) return null;
  let ms = 0;
  h.forEach((x, i) => {
    if (x.status !== "off") return;
    const s = new Date(x.at), e = i + 1 < h.length ? new Date(h[i + 1].at) : until;
    if (e > s) ms += e - s;
  });
  return ms / (7 * RPT_DAY);
}

function rptCompute(company, year, q) {
  const today = new Date();
  const period = rptPeriod(year, q);
  const { start, end } = period;
  const inP = (iso) => { if (!iso) return false; const d = new Date(iso); return !isNaN(d) && d >= start && d <= end; };
  const beforeEnd = (iso) => !iso || isNaN(new Date(iso)) || new Date(iso) <= end;
  const isCurrent = today >= start && today <= end;
  const isFuture = start > today;
  const curWk = weekKey();
  const until = isCurrent ? today : end;

  // ── Scorecard: ISO weeks whose Thursday falls in the period (not future weeks)
  const weeks = [];
  for (let d = new Date(start); d <= end; d.setDate(d.getDate() + 1)) {
    if (d.getDay() === 4) { const k = weekKeyFromDate(d); if (k <= curWk) weeks.push(k); }
  }
  const measurables = toArray(company.scorecard && company.scorecard.measurables).filter(m => m && m.id);
  const entries = (company.scorecard && company.scorecard.entries) || {};
  const liveIds = new Set(measurables.map(m => m.id));
  let deletedValues = 0;
  weeks.forEach(w => { const e = entries[w] || {}; Object.keys(e).forEach(id => { if (!liveIds.has(id) && e[id] !== "" && e[id] != null) deletedValues++; }); });
  const scRows = measurables.map(m => {
    const op = m.operator || "gte";
    const target = parseFloat(m.target);
    const pts = weeks.map(w => {
      const raw = (entries[w] || {})[m.id];
      const v = raw === "" || raw == null ? NaN : parseFloat(raw);
      return { week: w, value: isNaN(v) ? null : v, hit: rptMeets(raw, m) };
    });
    const vals = pts.filter(p => p.value != null);
    const hit = pts.filter(p => p.hit === true).length;
    const missed = pts.filter(p => p.hit === false).length;
    const avg = vals.length ? vals.reduce((a, p) => a + p.value, 0) / vals.length : null;
    const score = (v) => op === "lte" || op === "lt" ? -v : op === "eq" && !isNaN(target) ? -Math.abs(v - target) : v;
    let best = null, worst = null;
    vals.forEach(p => { if (!best || score(p.value) > score(best.value)) best = p; if (!worst || score(p.value) < score(worst.value)) worst = p; });
    return { m, owner: m.owner || "Unassigned", goal: m.target !== undefined && m.target !== "" ? `${RPT_OPS[op] || "≥"} ${fmtMeasure(m.target, m.unit)}` : "No goal", target: isNaN(target) ? null : target,
      pts, hit, missed, pct: rptPct(hit, hit + missed), avg, avgHit: avg == null ? null : rptMeets(avg, m), best, worst, entered: vals.length };
  });
  const scHit = scRows.reduce((a, r) => a + r.hit, 0), scMissed = scRows.reduce((a, r) => a + r.missed, 0);

  // ── Quarterly tasks (one source per quarter in the period)
  const qs = q ? [q] : [1, 2, 3, 4];
  const taskQuarters = qs.map(qq => {
    const src = rptTaskSource(company, year, qq, today);
    if (!src.tasks) return src;
    const qUntil = src.period.end < today ? src.period.end : today;
    const rows = src.tasks.map(t => ({ title: t.title || "(untitled)", who: t.who || "Unassigned", status: t.status || "on", offWeeks: rptOffWeeks(t.statusHistory, qUntil), hasHistory: toArray(t.statusHistory).length > 0, carriedFrom: t.carriedFrom || null }));
    const done = rows.filter(r => r.status === "done").length;
    const owners = {};
    rows.forEach(r => { const o = owners[r.who] = owners[r.who] || { owner: r.who, total: 0, done: 0 }; o.total++; if (r.status === "done") o.done++; });
    return { ...src, rows, total: rows.length, done, pct: rptPct(done, rows.length), owners: Object.values(owners).sort((a, b) => a.owner.localeCompare(b.owner)), historyTracked: rows.some(r => r.hasHistory) };
  });
  const tqWith = taskQuarters.filter(t => t.rows);
  const tasksTotal = tqWith.reduce((a, t) => a + t.total, 0), tasksDone = tqWith.reduce((a, t) => a + t.done, 0);

  // ── To-dos
  const todos = toArray(company.todos).filter(Boolean);
  const tdCreated = todos.filter(t => inP(t.createdAt));
  const tdCompleted = todos.filter(t => t.done && inP(t.completedAt));
  const durs = tdCompleted.filter(t => t.createdAt && !isNaN(new Date(t.createdAt))).map(t => (new Date(t.completedAt) - new Date(t.createdAt)) / RPT_DAY).filter(x => x >= 0);
  const tdDoneUpToEnd = todos.filter(t => t.done && beforeEnd(t.createdAt));
  const tdDoneWithDate = tdDoneUpToEnd.filter(t => t.completedAt).length;
  const tdTracked = todos.some(t => t.completedAt);
  const BUCKETS = ["0–7 days", "8–14 days", "15–30 days", "30+ days"];
  let aging = null;
  if (isCurrent) {
    const byOwner = {}; let unknownAge = 0;
    todos.filter(t => !t.done).forEach(t => {
      const created = t.createdAt ? new Date(t.createdAt) : null;
      if (!created || isNaN(created)) { unknownAge++; return; }
      const age = Math.floor((today - created) / RPT_DAY);
      const b = age <= 7 ? 0 : age <= 14 ? 1 : age <= 30 ? 2 : 3;
      const names = getAssignees(t).length ? getAssignees(t) : ["Unassigned"];
      names.forEach(n => { const o = byOwner[n] = byOwner[n] || { owner: n, counts: [0, 0, 0, 0] }; o.counts[b]++; });
    });
    aging = { buckets: BUCKETS, rows: Object.values(byOwner).sort((a, b) => a.owner.localeCompare(b.owner)), unknownAge };
  }
  const tdOwners = {};
  const tdOwner = (n) => tdOwners[n] = tdOwners[n] || { owner: n, created: 0, completed: 0, open: 0 };
  const ownersOf = (t) => getAssignees(t).length ? getAssignees(t) : ["Unassigned"];
  tdCreated.forEach(t => ownersOf(t).forEach(n => tdOwner(n).created++));
  tdCompleted.forEach(t => ownersOf(t).forEach(n => tdOwner(n).completed++));
  if (isCurrent) todos.filter(t => !t.done).forEach(t => ownersOf(t).forEach(n => tdOwner(n).open++));

  // ── Huddles (ratings from MEETING records only)
  const meetings = rptMeetings(company).filter(m => inP(m.date)).sort((a, b) => new Date(a.date) - new Date(b.date));
  const huddleName = (id, fallback) => ((toArray(company.huddles).find(h => h && h.id === id) || {}).name) || fallback || "Huddle";
  const hd = {};
  meetings.forEach(m => {
    const k = m.huddleId || m.huddleName || "unknown";
    const o = hd[k] = hd[k] || { huddle: huddleName(m.huddleId, m.huddleName), held: 0, minutes: 0, ratings: [], attendance: [] };
    o.held++; o.minutes += Number(m.totalMinutes) || 0;
    if (Number(m.rating) > 0) o.ratings.push(Number(m.rating));
    if (Array.isArray(m.attendees) || (m.attendees && typeof m.attendees === "object")) o.attendance.push(toArray(m.attendees).length);
  });
  const huddleRows = Object.values(hd).map(o => ({ ...o, avgRating: o.ratings.length ? o.ratings.reduce((a, b) => a + b, 0) / o.ratings.length : null, avgAttend: o.attendance.length ? o.attendance.reduce((a, b) => a + b, 0) / o.attendance.length : null })).sort((a, b) => a.huddle.localeCompare(b.huddle));
  const rated = meetings.filter(m => Number(m.rating) > 0);
  const attendRecorded = meetings.filter(m => m.attendees != null).length;

  // ── Headlines & issues
  const headlines = toArray(company.headlines).filter(Boolean);
  const hlAdded = headlines.filter(h => inP(h.date));
  const hlReviewed = headlines.filter(h => h.reviewed && inP(h.reviewedAt));
  const hlReviewedNoDate = headlines.filter(h => h.reviewed && !h.reviewedAt && beforeEnd(h.date)).length;
  const issues = toArray(company.issues).filter(Boolean);
  const isCreated = issues.filter(i => inP(i.createdAt));
  const isResolved = issues.filter(i => i.status === "resolved" && inP(i.resolvedAt));
  const isResolvedUpToEnd = issues.filter(i => i.status === "resolved" && beforeEnd(i.createdAt));
  const isResolvedWithDate = isResolvedUpToEnd.filter(i => i.resolvedAt).length;
  const isTracked = issues.some(i => i.resolvedAt);

  return {
    period, isCurrent, isFuture, today, weekNow: rptWeekNum(curWk),
    scorecard: { weeks, rows: scRows, deletedValues, hit: scHit, missed: scMissed, pct: rptPct(scHit, scHit + scMissed) },
    tasks: { quarters: taskQuarters, total: tasksTotal, done: tasksDone, pct: rptPct(tasksDone, tasksTotal), tracked: tqWith.length > 0 },
    todos: { created: tdCreated.length, completed: tdCompleted.length, avgDays: durs.length ? durs.reduce((a, b) => a + b, 0) / durs.length : null,
      doneUpToEnd: tdDoneUpToEnd.length, doneWithDate: tdDoneWithDate, tracked: tdTracked, aging, owners: Object.values(tdOwners).sort((a, b) => a.owner.localeCompare(b.owner)) },
    huddles: { meetings, rows: huddleRows, held: meetings.length, minutes: meetings.reduce((a, m) => a + (Number(m.totalMinutes) || 0), 0),
      avgRating: rated.length ? rated.reduce((a, m) => a + Number(m.rating), 0) / rated.length : null, rated: rated.length, attendRecorded },
    headlines: { added: hlAdded.length, reviewed: hlReviewed.length, reviewedNoDate: hlReviewedNoDate },
    issues: { created: isCreated.length, resolved: isResolved.length, resolvedUpToEnd: isResolvedUpToEnd.length, resolvedWithDate: isResolvedWithDate, tracked: isTracked,
      openNow: issues.filter(i => i.status !== "resolved").length },
  };
}

// ── Small presentational pieces (CSS variables, so print can force light) ──
const RPT_STATUS = { good: "green", warn: "amber", bad: "red", none: "neutral" };
function RptDot({ status, label }) {
  return <span className="rpt-dot" role="img" aria-label={label || status} style={{ background: rptVar(RPT_STATUS[status] || "neutral") }} />;
}
function RptNote({ children }) {
  return <div className="rpt-note">{children}</div>;
}
const rptLevel = (p, good = 0.8, warn = 0.5) => p == null ? "none" : p >= good ? "good" : p >= warn ? "warn" : "bad";
const rptStatusWord = { good: "On target", warn: "Watch", bad: "Off target", none: "No status" };

function RptTile({ label, value, status, sub, notTracked }) {
  return (
    <div className="rpt-tile">
      <div className="rpt-tile-label">{label}</div>
      {notTracked ? <div className="rpt-tile-nt">Not tracked</div> : (
        <div className="rpt-tile-row"><RptDot status={status} label={rptStatusWord[status]} /><span className="rpt-big num">{value}</span></div>
      )}
      {sub && <div className="rpt-tile-sub">{sub}</div>}
    </div>
  );
}

// Vertical bars with optional goal line. data: [{label, value|null, status}]
function RptBars({ data, goal, title, height = 150, showValues }) {
  if (!data.length || data.every(d => d.value == null)) return <RptNote>No data for this period.</RptNote>;
  const vals = data.filter(d => d.value != null).map(d => d.value);
  let max = Math.max(...vals, goal != null ? goal : -Infinity, 0);
  const min = Math.min(...vals, 0);
  if (max === min) max = min + 1;
  const n = data.length, bw = n > 20 ? 10 : n <= 6 ? 36 : 18, gap = n > 20 ? 4 : n <= 6 ? 24 : 10, left = 44, top = 18, bottom = 22;
  const W = left + n * (bw + gap) + 8, H = height;
  const y = (v) => top + (H - top - bottom) * (1 - (v - min) / (max - min));
  const labelsOn = showValues != null ? showValues : n <= 16;
  const xEvery = n > 20 ? 4 : 1;
  return (
    <svg className="rpt-chart" viewBox={`0 0 ${W} ${H}`} width="100%" style={{ maxWidth: Math.max(W, 260) * 1.25 }} role="img" aria-label={title}>
      <title>{title}</title>
      <line x1={left} x2={W - 4} y1={y(0)} y2={y(0)} stroke={rptVar("borderStrong")} strokeWidth="1" />
      <text x={left - 6} y={y(max) + 4} textAnchor="end" className="rpt-ax">{rptShort(max)}</text>
      <text x={left - 6} y={y(0) + 4} textAnchor="end" className="rpt-ax">{rptShort(Math.max(min, 0) === 0 ? 0 : min)}</text>
      {data.map((d, i) => {
        const x = left + i * (bw + gap) + gap / 2;
        const fill = d.status === "good" ? rptVar("green") : d.status === "bad" ? rptVar("red") : rptVar("blue");
        return (
          <g key={i}>
            {d.value != null ? (
              <>
                <rect x={x} y={Math.min(y(d.value), y(0))} width={bw} height={Math.max(1, Math.abs(y(0) - y(d.value)))} rx="2" fill={fill}><title>{`${d.label}: ${d.value}${d.status ? d.status === "good" ? " (hit)" : " (missed)" : ""}`}</title></rect>
                {labelsOn && <text x={x + bw / 2} y={Math.min(y(d.value), y(0)) - 4} textAnchor="middle" className="rpt-val">{rptShort(d.value)}</text>}
              </>
            ) : <text x={x + bw / 2} y={y(0) - 4} textAnchor="middle" className="rpt-ax">–</text>}
            {i % xEvery === 0 && <text x={x + bw / 2} y={H - 6} textAnchor="middle" className="rpt-ax">{d.label}</text>}
          </g>
        );
      })}
      {goal != null && (
        <g>
          <line x1={left} x2={W - 4} y1={y(goal)} y2={y(goal)} stroke={rptVar("text")} strokeWidth="1.5" strokeDasharray="4 3" />
          <text x={left - 6} y={y(goal) + 4} textAnchor="end" className="rpt-ax rpt-goal">{rptShort(goal)}</text>
        </g>
      )}
    </svg>
  );
}

// One point per meeting, rating scale 0–10.
function RptLine({ points, title }) {
  if (!points.length) return <RptNote>No rated meetings in this period.</RptNote>;
  const n = points.length, left = 30, right = 14, top = 16, bottom = 24, step = n > 1 ? Math.max(28, Math.min(70, 560 / (n - 1))) : 0;
  const W = left + right + (n - 1) * step + 10, H = 170;
  const x = (i) => left + 5 + i * step;
  const y = (v) => top + (H - top - bottom) * (1 - v / 10);
  const xEvery = Math.ceil(n / 10);
  return (
    <svg className="rpt-chart" viewBox={`0 0 ${Math.max(W, 360)} ${H}`} width="100%" style={{ maxWidth: Math.max(W, 360) * 1.25 }} role="img" aria-label={title}>
      <title>{title}</title>
      {[0, 5, 10].map(v => (
        <g key={v}><line x1={left} x2={Math.max(W, 360) - 4} y1={y(v)} y2={y(v)} stroke={rptVar("border")} strokeWidth="1" />
          <text x={left - 6} y={y(v) + 4} textAnchor="end" className="rpt-ax">{v}</text></g>
      ))}
      {n > 1 && <polyline fill="none" stroke={rptVar("blue")} strokeWidth="2" points={points.map((p, i) => `${x(i)},${y(p.value)}`).join(" ")} />}
      {points.map((p, i) => (
        <g key={i}>
          <circle cx={x(i)} cy={y(p.value)} r="4" fill={rptVar("blue")} stroke={rptVar("surface2")} strokeWidth="2"><title>{`${p.label}: ${p.value}/10`}</title></circle>
          {n <= 16 && <text x={x(i)} y={y(p.value) - 8} textAnchor="middle" className="rpt-val">{p.value}</text>}
          {i % xEvery === 0 && <text x={x(i)} y={H - 6} textAnchor="middle" className="rpt-ax">{p.label}</text>}
        </g>
      ))}
    </svg>
  );
}

function RptSection({ id, title, children, sub }) {
  return (
    <section className="rpt-section" id={id} aria-labelledby={id + "-h"}>
      <h2 id={id + "-h"} className="rpt-h2">{title}</h2>
      {sub && <div className="rpt-sub">{sub}</div>}
      {children}
    </section>
  );
}

function RptSummary({ r }) {
  const td = r.todos, is = r.issues, hu = r.huddles, sc = r.scorecard, tk = r.tasks;
  return (
    <RptSection id="rpt-summary" title="Summary">
      <div className="rpt-tiles">
        <RptTile label="Scorecard weeks on target" notTracked={sc.hit + sc.missed === 0} value={rptPctText(sc.pct)} status={rptLevel(sc.pct)} sub={`${sc.hit} of ${sc.hit + sc.missed} measurable-weeks`} />
        <RptTile label="Quarterly tasks done" notTracked={!tk.tracked || tk.total === 0} value={rptPctText(tk.pct)} status={rptLevel(tk.pct)} sub={tk.tracked ? `${tk.done} of ${tk.total} tasks` : null} />
        <RptTile label="To-dos completed" notTracked={!td.tracked} value={td.completed} status="none" sub={td.tracked && td.doneWithDate < td.doneUpToEnd ? "Partial — see To-dos" : null} />
        <RptTile label="Huddles held" value={hu.held} status="none" sub={`${hu.minutes} minutes total`} />
        <RptTile label="Average meeting rating" notTracked={hu.rated === 0} value={rptNum1(hu.avgRating)} status={hu.avgRating == null ? "none" : hu.avgRating >= 8 ? "good" : hu.avgRating >= 6 ? "warn" : "bad"} sub={hu.rated ? `${hu.rated} rated meeting${hu.rated === 1 ? "" : "s"}` : null} />
        <RptTile label="Issues solved" notTracked={!is.tracked} value={is.resolved} status="none" sub={is.tracked && is.resolvedWithDate < is.resolvedUpToEnd ? "Partial — see Issues" : null} />
      </div>
      <div className="rpt-foot">Dots: green = 80%+ (rating 8+), amber = 50–79% (rating 6–7.9), red = below that. Gray = a count with no target.</div>
    </RptSection>
  );
}

function RptScorecard({ r }) {
  const sc = r.scorecard;
  const owners = {};
  sc.rows.forEach(row => { (owners[row.owner] = owners[row.owner] || []).push(row); });
  const ownerNames = Object.keys(owners).sort((a, b) => a === "Unassigned" ? 1 : b === "Unassigned" ? -1 : a.localeCompare(b));
  return (
    <RptSection id="rpt-scorecard" title="Scorecard" sub={`${sc.weeks.length} week${sc.weeks.length === 1 ? "" : "s"} in this period${sc.weeks.length ? ` (W${rptWeekNum(sc.weeks[0])}–W${rptWeekNum(sc.weeks[sc.weeks.length - 1])})` : ""}`}>
      {sc.rows.length === 0 ? <RptNote>No measurables set up.</RptNote> : sc.weeks.length === 0 ? <RptNote>No scorecard weeks in this period yet.</RptNote> : ownerNames.map(owner => (
        <div key={owner} className="rpt-group">
          <h3 className="rpt-h3">{owner}</h3>
          <div className="rpt-mgrid">
          {owners[owner].map(row => (
            <div key={row.m.id} className="rpt-card rpt-keep">
              <div className="rpt-row-between">
                <div className="rpt-strong">{row.m.name || "(unnamed)"}</div>
                <div className="rpt-muted">Goal <span className="num">{row.goal}</span></div>
              </div>
              {row.entered === 0 ? <RptNote>No numbers entered for this period.</RptNote> : (<>
                <div className="rpt-stats">
                  <span><RptDot status={rptLevel(row.pct)} label={rptStatusWord[rptLevel(row.pct)]} /> Hit <b className="num">{row.hit}</b> · Missed <b className="num">{row.missed}</b> · <b className="num">{rptPctText(row.pct)}</b></span>
                  <span>Average <b className="num">{rptUnitVal(row.avg, row.m.unit)}</b>{row.avgHit != null && <> ({row.avgHit ? "meets goal" : "misses goal"})</>}</span>
                  <span>Best <b className="num">{rptUnitVal(row.best && row.best.value, row.m.unit)}</b> <span className="rpt-muted num">W{row.best && rptWeekNum(row.best.week)}</span></span>
                  <span>Worst <b className="num">{rptUnitVal(row.worst && row.worst.value, row.m.unit)}</b> <span className="rpt-muted num">W{row.worst && rptWeekNum(row.worst.week)}</span></span>
                </div>
                <RptBars title={`${row.m.name}: weekly values${row.target != null ? `, goal ${row.goal}` : ""}`} goal={row.target}
                  data={row.pts.map(p => ({ label: `W${rptWeekNum(p.week)}`, value: p.value, status: p.hit === true ? "good" : p.hit === false ? "bad" : null }))} />
                <div className="rpt-legend"><span><i style={{ background: rptVar("green") }} /> hit</span><span><i style={{ background: rptVar("red") }} /> missed</span>{row.target != null && <span><i className="rpt-dash" /> goal</span>}<span>– = no number</span></div>
              </>)}
            </div>
          ))}
          </div>
        </div>
      ))}
      {sc.deletedValues > 0 && <RptNote>{sc.deletedValues} value{sc.deletedValues === 1 ? "" : "s"} from deleted measurables not shown.</RptNote>}
      <div className="rpt-foot">Weeks are judged against each measurable's current goal. A week belongs to the quarter that contains its Thursday.</div>
    </RptSection>
  );
}

function RptHuddles({ r }) {
  const hu = r.huddles;
  const pts = hu.meetings.filter(m => Number(m.rating) > 0).map(m => ({ label: new Date(m.date).toLocaleDateString("en-US", { month: "short", day: "numeric" }), value: Number(m.rating) }));
  return (
    <RptSection id="rpt-huddles" title="Huddles">
      {hu.held === 0 ? <RptNote>No huddles held in this period.</RptNote> : (<>
        <div className="rpt-scroll rpt-keep">
          <table className="rpt-table">
            <thead><tr><th>Huddle</th><th className="r">Meetings</th><th className="r">Total minutes</th><th className="r">Avg rating</th><th className="r">Avg attendance</th></tr></thead>
            <tbody>
              {hu.rows.map(h => (
                <tr key={h.huddle}><td>{h.huddle}</td><td className="r num">{h.held}</td><td className="r num">{h.minutes}</td><td className="r num">{rptNum1(h.avgRating)}</td>
                  <td className="r">{h.avgAttend == null ? <span className="rpt-muted">Not tracked</span> : <span className="num">{rptNum1(h.avgAttend)}</span>}</td></tr>
              ))}
              <tr className="rpt-total"><td>All huddles</td><td className="r num">{hu.held}</td><td className="r num">{hu.minutes}</td><td className="r num">{rptNum1(hu.avgRating)}</td><td /></tr>
            </tbody>
          </table>
        </div>
        <h3 className="rpt-h3">Meeting rating trend</h3>
        <div className="rpt-keep"><RptLine title="Meeting ratings, one point per meeting (0–10)" points={pts} /></div>
        {hu.attendRecorded === 0 ? <RptNote>Attendance: Not tracked for this period.</RptNote>
          : hu.attendRecorded < hu.held ? <RptNote>Attendance recorded for {hu.attendRecorded} of {hu.held} meetings.</RptNote> : null}
      </>)}
      <div className="rpt-foot">Ratings come from each saved meeting record.</div>
    </RptSection>
  );
}

const RPT_TASK_STATUS = { done: ["good", "Done"], on: ["good", "On track"], off: ["bad", "Off track"], notdone: ["warn", "Not done"] };
function RptStatus({ s }) {
  const [lvl, word] = RPT_TASK_STATUS[s] || ["none", s || "—"];
  return <span style={{ whiteSpace: "nowrap" }}><RptDot status={lvl} label={word} /> {word}</span>;
}

// Single horizontal split bar (e.g. done vs not done) with numbers beside it.
function RptSplitBar({ parts, title }) {
  const total = parts.reduce((a, p) => a + p.value, 0);
  if (!total) return <RptNote>No data for this period.</RptNote>;
  let x = 0;
  return (
    <div className="rpt-keep">
      <svg className="rpt-chart" viewBox="0 0 300 18" width="100%" style={{ maxWidth: 520 }} preserveAspectRatio="none" role="img" aria-label={title}>
        <title>{title}</title>
        {parts.map((p, i) => { const w = 300 * p.value / total; const el = w > 0 ? <rect key={i} x={x} y="0" width={Math.max(0, w - (i < parts.length - 1 ? 2 : 0))} height="18" rx="2" fill={p.color}><title>{`${p.label}: ${p.value}`}</title></rect> : null; x += w; return el; })}
      </svg>
      <div className="rpt-legend">{parts.map(p => <span key={p.label}><i style={{ background: p.color }} />{p.label} <b className="num" style={{ color: rptVar("text") }}>{p.value}</b></span>)}</div>
    </div>
  );
}

function RptTaskQuarter({ tq, showHeading }) {
  return (
    <div className="rpt-group">
      {showHeading && <h3 className="rpt-h3">{tq.label}</h3>}
      {tq.note && <RptNote>{tq.note}</RptNote>}
      {tq.rows && (tq.rows.length === 0 ? <RptNote>No quarterly tasks recorded.</RptNote> : (<>
        <div className="rpt-stats"><span>Completion <b className="num">{rptPctText(tq.pct)}</b> · <span className="num">{tq.done}</span> of <span className="num">{tq.total}</span> done</span><span className="rpt-muted">{tq.source === "archive" ? "From the Historical Quarters archive" : "From current Quarterly Tasks"}</span></div>
        <RptSplitBar title={`${tq.label} tasks: ${tq.done} done, ${tq.total - tq.done} not done`} parts={[{ label: "Done", value: tq.done, color: rptVar("green") }, { label: "Not done", value: tq.total - tq.done, color: rptVar("borderStrong") }]} />
        <div className="rpt-two">
          <div className="rpt-scroll rpt-keep">
            <table className="rpt-table">
              <thead><tr><th>Owner</th><th className="r">Tasks</th><th className="r">Done</th><th className="r">%</th></tr></thead>
              <tbody>{tq.owners.map(o => <tr key={o.owner}><td>{o.owner}</td><td className="r num">{o.total}</td><td className="r num">{o.done}</td><td className="r num">{rptPctText(rptPct(o.done, o.total))}</td></tr>)}</tbody>
            </table>
          </div>
          <div className="rpt-scroll rpt-keep">
            <table className="rpt-table">
              <thead><tr><th>Task</th><th>Owner</th><th>Final status</th>{tq.historyTracked && <th className="r">Weeks off track</th>}</tr></thead>
              <tbody>{tq.rows.map((t, i) => <tr key={i}><td>{t.title}{t.carriedFrom && <span className="rpt-muted"> (carried over)</span>}</td><td>{t.who}</td><td><RptStatus s={t.status} /></td>
                {tq.historyTracked && <td className="r num">{t.offWeeks == null ? "—" : rptNum1(t.offWeeks)}</td>}</tr>)}</tbody>
            </table>
          </div>
        </div>
        {!tq.historyTracked && <RptNote>Status history not tracked for this period.</RptNote>}
        {tq.historyTracked && tq.rows.some(t => !t.hasHistory) && <RptNote>“—” = no status history saved for that task.</RptNote>}
      </>))}
    </div>
  );
}

function RptTasks({ r }) {
  const tk = r.tasks;
  return (
    <RptSection id="rpt-tasks" title="Quarterly tasks" sub={r.period.q ? null : `Year total: ${tk.done} of ${tk.total} done (${rptPctText(tk.pct)}) across the quarters below.`}>
      {tk.quarters.map(tq => <RptTaskQuarter key={tq.label} tq={tq} showHeading={!r.period.q} />)}
    </RptSection>
  );
}

const RPT_AGE_OPACITY = [0.35, 0.55, 0.78, 1];
function RptAging({ aging }) {
  if (!aging.rows.length) return <RptNote>No open to-dos right now.</RptNote>;
  const max = Math.max(...aging.rows.map(o => o.counts.reduce((a, b) => a + b, 0)));
  const rowH = 22, left = 110, W = 420, H = aging.rows.length * (rowH + 6) + 4;
  return (
    <div className="rpt-keep">
      <svg className="rpt-chart" viewBox={`0 0 ${W} ${H}`} width="100%" style={{ maxWidth: 520 }} role="img" aria-label="Open to-dos by owner and age">
        <title>Open to-dos by owner and age</title>
        {aging.rows.map((o, i) => {
          const y = 2 + i * (rowH + 6); let x = left; const total = o.counts.reduce((a, b) => a + b, 0);
          return (
            <g key={o.owner}>
              <text x={left - 8} y={y + 15} textAnchor="end" className="rpt-lbl">{o.owner.length > 16 ? o.owner.slice(0, 15) + "…" : o.owner}</text>
              {o.counts.map((c, b) => { const w = (W - left - 30) * c / max; const el = c ? <rect key={b} x={x} y={y} width={Math.max(0, w - 2)} height={rowH} rx="2" fill={rptVar("blue")} fillOpacity={RPT_AGE_OPACITY[b]}><title>{`${o.owner}, ${aging.buckets[b]}: ${c}`}</title></rect> : null; x += w; return el; })}
              <text x={x + 4} y={y + 15} className="rpt-val">{total}</text>
            </g>
          );
        })}
      </svg>
      <div className="rpt-legend">{aging.buckets.map((b, i) => <span key={b}><i style={{ background: rptVar("blue"), opacity: RPT_AGE_OPACITY[i] }} />{b}</span>)}</div>
      <div className="rpt-scroll">
        <table className="rpt-table">
          <thead><tr><th>Owner</th>{aging.buckets.map(b => <th key={b} className="r">{b}</th>)}<th className="r">Total</th></tr></thead>
          <tbody>{aging.rows.map(o => <tr key={o.owner}><td>{o.owner}</td>{o.counts.map((c, i) => <td key={i} className="r num">{c}</td>)}<td className="r num">{o.counts.reduce((a, b) => a + b, 0)}</td></tr>)}</tbody>
        </table>
      </div>
      {aging.unknownAge > 0 && <RptNote>{aging.unknownAge} open to-do{aging.unknownAge === 1 ? " has" : "s have"} no created date and {aging.unknownAge === 1 ? "isn't" : "aren't"} shown.</RptNote>}
    </div>
  );
}

function RptTodos({ r }) {
  const td = r.todos;
  return (
    <RptSection id="rpt-todos" title="To-dos">
      <div className="rpt-tiles">
        <RptTile label="Created in period" value={td.created} status="none" />
        <RptTile label="Completed in period" notTracked={!td.tracked} value={td.completed} status="none" />
        <RptTile label="Average days to complete" notTracked={!td.tracked || td.avgDays == null} value={rptNum1(td.avgDays)} status="none" />
      </div>
      {td.tracked && td.doneWithDate < td.doneUpToEnd && <RptNote>Completion dates recorded for {td.doneWithDate} of {td.doneUpToEnd} completed to-dos.</RptNote>}
      {!td.tracked && <RptNote>Completion dates are not tracked yet, so completed to-dos can't be placed in a period.</RptNote>}
      <h3 className="rpt-h3">Aging of open to-dos</h3>
      {td.aging ? <RptAging aging={td.aging} /> : <RptNote>Aging is shown for the current period only.</RptNote>}
      <h3 className="rpt-h3">By owner</h3>
      {td.owners.length === 0 ? <RptNote>No data for this period.</RptNote> : (
        <div className="rpt-scroll rpt-keep">
          <table className="rpt-table">
            <thead><tr><th>Owner</th><th className="r">Created</th><th className="r">Completed</th>{r.isCurrent && <th className="r">Open now</th>}</tr></thead>
            <tbody>{td.owners.map(o => <tr key={o.owner}><td>{o.owner}</td><td className="r num">{o.created}</td><td className="r num">{td.tracked ? o.completed : "—"}</td>{r.isCurrent && <td className="r num">{o.open}</td>}</tr>)}</tbody>
          </table>
        </div>
      )}
      <div className="rpt-foot">A to-do with two owners counts once for each owner.</div>
    </RptSection>
  );
}

function RptHeadlinesIssues({ r }) {
  const hl = r.headlines, is = r.issues;
  return (
    <RptSection id="rpt-hi" title="Headlines and issues">
      <div className="rpt-scroll rpt-keep">
        <table className="rpt-table">
          <thead><tr><th>Measure</th><th className="r">Count</th><th>Notes</th></tr></thead>
          <tbody>
            <tr><td>Headlines added</td><td className="r num">{hl.added}</td><td /></tr>
            <tr><td>Headlines reviewed</td><td className="r num">{hl.reviewed}</td><td className="rpt-muted">{hl.reviewedNoDate > 0 ? `${hl.reviewedNoDate} reviewed headline${hl.reviewedNoDate === 1 ? " has" : "s have"} no review date and can't be placed in a period.` : ""}</td></tr>
            <tr><td>Issues created</td><td className="r num">{is.created}</td><td /></tr>
            <tr><td>Issues resolved</td><td className="r">{is.tracked ? <span className="num">{is.resolved}</span> : <span className="rpt-muted">Not tracked</span>}</td>
              <td className="rpt-muted">{is.tracked && is.resolvedWithDate < is.resolvedUpToEnd ? `Resolution dates recorded for ${is.resolvedWithDate} of ${is.resolvedUpToEnd} resolved issues.` : ""}</td></tr>
            <tr className="rpt-total"><td>Open issues right now</td><td className="r num">{is.openNow}</td><td className="rpt-muted">Current count, not limited to the period</td></tr>
          </tbody>
        </table>
      </div>
    </RptSection>
  );
}

// Year view: the four quarters side by side. Future quarters show "—".
function rptYearRows(company, year, yearReport) {
  const qr = [1, 2, 3, 4].map(q => rptCompute(company, year, q));
  const v = (fn) => qr.map(x => x.isFuture ? null : fn(x));
  const Y = yearReport;
  return {
    quarters: qr,
    rows: [
      { label: "Scorecard weeks on target", pct: true, values: v(x => x.scorecard.pct), total: Y.scorecard.pct },
      { label: "Quarterly tasks done", pct: true, values: v(x => x.tasks.tracked ? x.tasks.pct : null), total: Y.tasks.pct },
      { label: "To-dos created", values: v(x => x.todos.created), total: Y.todos.created },
      { label: "To-dos completed", values: v(x => x.todos.tracked ? x.todos.completed : null), total: Y.todos.tracked ? Y.todos.completed : null },
      { label: "Huddles held", values: v(x => x.huddles.held), total: Y.huddles.held },

      { label: "Issues solved", values: v(x => x.issues.tracked ? x.issues.resolved : null), total: Y.issues.tracked ? Y.issues.resolved : null },
    ],
  };
}
const rptYearFmt = (row, val) => val == null ? "—" : row.pct ? rptPctText(val) : row.dec ? rptNum1(val) : String(val);

function RptYear({ r, company }) {

// ── Excel export (SheetJS, loaded only when the button is clicked) ──
function rptLoadSheetJS() {
  if (window.XLSX) return Promise.resolve(window.XLSX);
  if (window._rptXlsxPromise) return window._rptXlsxPromise;
  window._rptXlsxPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js";
    s.async = true;
    s.onload = () => window.XLSX ? resolve(window.XLSX) : reject(new Error("The Excel library didn't load."));
    s.onerror = () => { window._rptXlsxPromise = null; reject(new Error("Couldn't download the Excel library. Check your connection and try again.")); };
    document.head.appendChild(s);
  });
  return window._rptXlsxPromise;
}
const rptXPct = (p) => p == null ? null : { v: p, t: "n", z: "0%" };
const rptXNum = (v) => v == null || isNaN(v) ? null : Math.round(v * 100) / 100;
const rptXDate = (iso) => { if (!iso) return null; const d = new Date(iso); return isNaN(d) ? null : new Date(d.getFullYear(), d.getMonth(), d.getDate()); };

function rptWorkbook(XLSX, company, r, companyName) {
  const wb = XLSX.utils.book_new();
  const add = (name, rows, widths) => {
    const ws = XLSX.utils.aoa_to_sheet(rows.map(row => row.map(c => c === undefined ? null : c)));
    if (widths) ws["!cols"] = widths.map(w => ({ wch: w }));
    XLSX.utils.book_append_sheet(wb, ws, name);
  };
  const p = r.period, sc = r.scorecard, tk = r.tasks, td = r.todos, hu = r.huddles, hl = r.headlines, is = r.issues;
  const NT = "Not tracked";
  add("Summary", [
    ["VAST report", p.label], ["Company", companyName], ["From", rptXDate(p.start)], ["To", rptXDate(p.end)],
    ["Status", r.isCurrent ? `In progress — through week ${r.weekNow}` : r.isFuture ? "Not started" : "Complete"], ["Exported", rptXDate(new Date())], [],
    ["Measure", "Value", "Out of / detail"],
    ["Scorecard weeks on target", sc.hit + sc.missed ? rptXPct(sc.pct) : NT, sc.hit + sc.missed ? sc.hit + sc.missed : null],
    ["Scorecard weeks hit", sc.hit, null],
    ["Quarterly tasks done (%)", tk.tracked && tk.total ? rptXPct(tk.pct) : NT, tk.tracked ? tk.total : null],
    ["Quarterly tasks done", tk.tracked ? tk.done : NT, null],
    ["To-dos completed", td.tracked ? td.completed : NT, td.tracked && td.doneWithDate < td.doneUpToEnd ? `Completion dates recorded for ${td.doneWithDate} of ${td.doneUpToEnd}` : null],
    ["Huddles held", hu.held, null],
    ["Huddle minutes", hu.minutes, null],
    ["Average meeting rating", hu.rated ? rptXNum(hu.avgRating) : NT, hu.rated || null],
    ["Issues solved", is.tracked ? is.resolved : NT, is.tracked && is.resolvedWithDate < is.resolvedUpToEnd ? `Resolution dates recorded for ${is.resolvedWithDate} of ${is.resolvedUpToEnd}` : null],
  ], [30, 18, 40]);
  const wkHead = sc.weeks.map(w => `W${rptWeekNum(w)}`);
  add("Scorecard", [
    ["Owner", "Measurable", "Goal", "Goal value", "Weeks hit", "Weeks missed", "% hit", "Average", "Best", "Best week", "Worst", "Worst week", ...wkHead],
    ...sc.rows.map(row => [row.owner, row.m.name || "", row.goal, row.target, row.hit, row.missed, rptXPct(row.pct), rptXNum(row.avg),
      row.best ? row.best.value : null, row.best ? `W${rptWeekNum(row.best.week)}` : null, row.worst ? row.worst.value : null, row.worst ? `W${rptWeekNum(row.worst.week)}` : null,
      ...row.pts.map(pt => pt.value)]),
    [], ["Weeks are judged against each measurable's current goal."],
    ...(sc.deletedValues ? [[`${sc.deletedValues} value(s) from deleted measurables not shown.`]] : []),
  ], [18, 26, 10, 10, 10, 12, 8, 10, 8, 10, 8, 11, ...wkHead.map(() => 7)]);
  const taskRows = [["Quarter", "Source", "Task", "Owner", "Final status", "Weeks off track", "Carried over from"]];
  tk.quarters.forEach(tq => {
    if (!tq.rows) { taskRows.push([tq.label, null, tq.note]); return; }
    if (!tq.rows.length) taskRows.push([tq.label, tq.source, "No quarterly tasks recorded."]);
    tq.rows.forEach(t => taskRows.push([tq.label, tq.source === "archive" ? "Historical Quarters" : "Current tasks", t.title, t.who, (RPT_TASK_STATUS[t.status] || [null, t.status])[1], t.offWeeks == null ? null : rptXNum(t.offWeeks), t.carriedFrom ? t.carriedFrom.quarter || "" : null]));
  });
  taskRows.push([], ["Quarter", "Owner", "Tasks", "Done", "% done"]);
  tk.quarters.forEach(tq => (tq.owners || []).forEach(o => taskRows.push([tq.label, o.owner, o.total, o.done, rptXPct(rptPct(o.done, o.total))])));
  add("Tasks", taskRows, [10, 18, 34, 18, 12, 14, 16]);
  const tdRows = [
    ["Created in period", td.created], ["Completed in period", td.tracked ? td.completed : NT], ["Average days to complete", td.avgDays == null ? null : rptXNum(td.avgDays)],
    ["Completed to-dos with a completion date", td.doneWithDate], ["Completed to-dos (created by period end)", td.doneUpToEnd], [],
    ["Owner", "Created", "Completed", ...(r.isCurrent ? ["Open now"] : [])],
    ...td.owners.map(o => [o.owner, o.created, td.tracked ? o.completed : null, ...(r.isCurrent ? [o.open] : [])]), [],
  ];
  if (td.aging) { tdRows.push(["Open to-do aging (today)"], ["Owner", ...td.aging.buckets, "Total"]); td.aging.rows.forEach(o => tdRows.push([o.owner, ...o.counts, o.counts.reduce((a, b) => a + b, 0)])); }
  else tdRows.push(["Aging is shown for the current period only."]);
  add("To-dos", tdRows, [40, 10, 12, 12, 12, 10]);
  add("Huddles", [
    ["Huddle", "Meetings", "Total minutes", "Average rating", "Average attendance"],
    ...hu.rows.map(h => [h.huddle, h.held, h.minutes, rptXNum(h.avgRating), h.avgAttend == null ? NT : rptXNum(h.avgAttend)]),
    ["All huddles", hu.held, hu.minutes, rptXNum(hu.avgRating), null], [],
    ["Date", "Huddle", "Minutes", "Rating", "Attendees", "Attendee names"],
    ...hu.meetings.map(m => [rptXDate(m.date), m.huddleName || ((toArray(company.huddles).find(h => h && h.id === m.huddleId) || {}).name) || "", Number(m.totalMinutes) || 0, Number(m.rating) > 0 ? Number(m.rating) : null,
      m.attendees != null ? toArray(m.attendees).length : NT, m.attendees != null ? toArray(m.attendees).join(", ") : null]),
  ], [22, 20, 14, 14, 18, 40]);
  add("Headlines & Issues", [
    ["Measure", "Count", "Note"],
    ["Headlines added", hl.added], ["Headlines reviewed", hl.reviewed, hl.reviewedNoDate ? `${hl.reviewedNoDate} reviewed without a review date` : null],
    ["Issues created", is.created], ["Issues resolved", is.tracked ? is.resolved : NT, is.tracked && is.resolvedWithDate < is.resolvedUpToEnd ? `Resolution dates recorded for ${is.resolvedWithDate} of ${is.resolvedUpToEnd}` : null],
    ["Open issues right now", is.openNow, "Current count"],
  ], [26, 10, 44]);
  if (!p.q) {
    const yr = rptYearRows(company, p.year, r);
    add("Year view", [["Measure", "Q1", "Q2", "Q3", "Q4", "Year"],
      ...yr.rows.map(row => [row.label, ...[...row.values, row.total].map(v => v == null ? null : row.pct ? rptXPct(v) : row.dec ? rptXNum(v) : v)])], [28, 9, 9, 9, 9, 9]);
  }
  return wb;
}
