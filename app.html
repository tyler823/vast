                    <td className="muted" style={{ fontSize: C.fs.sm, whiteSpace: "nowrap" }}>{t.huddleId ? (huddles.find(h => h.id === t.huddleId)?.name || "—") : "—"}</td>
                    <td>{t.smart && <span className="chip">SMART</span>}</td>
                    <td>
                      {(() => {
                        const met = meetsTarget(t);
                        const colors = {
                          on: { bg: C.greenTint, color: C.green, border: C.greenBorder },
                          off: { bg: C.redTint1, color: C.red, border: C.redTint3 },
                          done: { bg: C.greenTint, color: C.green, border: C.greenBorder },
                          notdone: { bg: C.amberBg, color: C.amber, border: C.amberBorder },
                        };
                        // Color follows the status word shown in the dropdown (meetsTarget is unchanged).
                        const effectiveColor = colors[t.status] || colors.on;
                        return (
                          <div style={{ position: "relative", display: "inline-flex", alignItems: "center", width: 132 }}>
                          <span aria-hidden="true" className="dot" style={{ position: "absolute", left: 9, background: effectiveColor.color, pointerEvents: "none" }} />
                          <select className="quiet-select" aria-label={`Status of ${t.title}`} value={t.status} onChange={e => updateStatus(t.id, e.target.value)}
                            style={{ width: "100%", paddingLeft: 24, fontWeight: 500 }}>
                            <option value="on">On Track</option>
                            <option value="off">Off Track</option>
                            <option value="done">Done</option>
                            <option value="notdone">Not Done</option>
                          </select>
                          </div>
                        );
                      })()}
                    </td>
                    <td>
                      <div style={{ display: "flex", gap: 2 }}>
                        <button className="icon-btn" title="Edit" aria-label={`Edit task: ${t.title}`} onClick={() => startEdit(t)}><Icon.edit /></button>
                        <button className="icon-btn danger" title="Delete" aria-label={`Delete task: ${t.title}`} onClick={() => deleteTask(t.id)}><Icon.trash /></button>
                      </div>
                    </td>
                  </tr>
                );
              })}
            </tbody>
          </table>
          </div>
        </div>
      )}

      {tab === "individual" && (
        <div className="panel">
          {activeMembers(company).map(member => {
            const legacyTasks = (company.individualTasks || {})[member.id] || [];
            const assignedTasks = filtered((company.quarterlyTasks || []).filter(t => t.who === member.name));
            const allTasks = [...assignedTasks, ...legacyTasks.filter(lt => !assignedTasks.find(at => at.id === lt.id))];
            return (
              <div key={member.id} style={{ borderBottom: `1px solid ${C.border}` }}>
                <div style={{ fontFamily: C.fontUI, fontSize: C.fs.sm, fontWeight: 600, padding: "10px 12px 6px", display: "flex", gap: 8, alignItems: "baseline" }}>{member.name}<span className="num" style={{ color: C.textMuted, fontWeight: 400, fontSize: C.fs.xs }}>{allTasks.length}</span></div>
                {allTasks.map(t => {
                  const met = meetsTarget(t);
                  const statusColor = t.status === "notdone" ? C.amber : t.status === "off" || met === false ? C.red : t.status === "done" || met === true ? C.green : C.green;
                  const statusLabel = t.status === "notdone" ? "Not Done" : t.status === "done" ? "Done" : t.status === "off" ? "Off Track" : "On Track";
                  return (
                    <div key={t.id} className="lrow">
                      <span className="grow" style={{ fontWeight: 500 }}>{t.title}</span>
                      <span className="lmeta num" style={{ minWidth: 80, textAlign: "right" }}>{t.operator && t.target ? <>{OPERATORS[t.operator]} {fmtMeasure(t.target)}</> : ""}</span>
                      <span className="lmeta lhuddle">{t.huddleId ? huddles.find(h => h.id === t.huddleId)?.name : ""}</span>
                      <div style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
                        {t.smart && <span className="chip">SMART</span>}
                        <span style={{ display: "inline-flex", alignItems: "center", gap: 6, fontSize: C.fs.sm, minWidth: 86 }}><span className="dot" style={{ background: statusColor }} aria-hidden="true" />{statusLabel}</span>
                        <select className="quiet-select" aria-label={`Status of ${t.title}`} value={t.status} onChange={e => updateStatus(t.id, e.target.value)}
                          style={{ color: C.textMuted }}>
                          <option value="on">On Track</option>
                          <option value="off">Off Track</option>
                          <option value="done">Done</option>
                        </select>
                      </div>
                    </div>
                  );
                })}
                {!allTasks.length && <div className="lempty" style={{ paddingTop: 4 }}>No tasks assigned to {member.name}{huddleFilter !== "all" ? " for this huddle" : ""}.</div>}
              </div>
            );
          })}
          {!activeMembers(company).length && <div className="lempty">Add staff in Cortex to assign individual tasks.</div>}
        </div>
      )}

      {showAdd && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowAdd(false)}>
          <div className="modal">
            <h3 style={{ fontSize: C.fs.title, marginBottom: 20 }}>Add Quarterly Task</h3>
            <div className="field">
              <label className="label">Task Description</label>
              <input placeholder="What needs to be accomplished this quarter?" value={form.title} onChange={e => setForm(f => ({ ...f, title: e.target.value }))} autoFocus />
            </div>
            <div className="field">
              <label className="label">Assigned To</label>
              {activeMembers(company).length > 0 ? (
                <select value={form.who} onChange={e => setForm(f => ({ ...f, who: e.target.value }))}>
                  <option value="">Unassigned</option>
                  {activeMembers(company).map(m => <option key={m.id} value={m.name}>{m.name}</option>)}
                  <option value="__custom">Other...</option>
                </select>
              ) : (
                <input placeholder="Name or team" value={form.who} onChange={e => setForm(f => ({ ...f, who: e.target.value }))} />
              )}
              {form.who === "__custom" && (
                <input placeholder="Enter name..." autoFocus style={{ marginTop: 8 }} onChange={e => setForm(f => ({ ...f, who: e.target.value }))} />
              )}
            </div>
            <div className="field">
              <label className="label">Initial Status</label>
              <select value={form.status} onChange={e => setForm(f => ({ ...f, status: e.target.value }))}>
                <option value="on">On Track</option>
                <option value="off">Off Track</option>
              </select>
            </div>
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 20 }}>
              <div className={`checkbox ${form.smart ? "checked" : ""}`} onClick={() => setForm(f => ({ ...f, smart: !f.smart }))}>
                {form.smart && <Icon.check />}
              </div>
              <span style={{ fontSize: C.fs.base }}>This task is SMART (Specific, Measurable, Achievable, Relevant, Time-bound)</span>
            </div>
            <div className="field">
              <label className="label">Target / Success Criteria (optional)</label>
              <div style={{ display: "flex", gap: 8 }}>
                <select value={form.operator || ""} onChange={e => setForm(f => ({ ...f, operator: e.target.value }))} style={{ width: 80, flexShrink: 0 }}>
                  <option value="">—</option>
                  <option value="gte">≥</option>
                  <option value="lte">≤</option>
                  <option value="gt">&gt;</option>
                  <option value="lt">&lt;</option>
                  <option value="eq">=</option>
                </select>
                <input placeholder="e.g. 10, 95%, $50k" value={form.target || ""} onChange={e => setForm(f => ({ ...f, target: e.target.value }))} style={{ flex: 1 }} />
              </div>
              <div style={{ fontSize: C.fs.xs, color: C.textMuted, marginTop: 4 }}>When a status is set, this criterion determines green/red highlighting.</div>
            </div>
            <div className="field">
              <label className="label">Assign to Huddle</label>
              <select value={form.huddleId || ""} onChange={e => setForm(f => ({ ...f, huddleId: e.target.value }))}>
                <option value="">No Huddle</option>
                {huddles.map(h => <option key={h.id} value={h.id}>{h.name}</option>)}
              </select>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="btn-primary" style={{ flex: 1 }} onClick={addTask}>Add Task</button>
              <button className="btn-secondary" onClick={() => setShowAdd(false)}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </Layout>
  );
}

// ─── SCORECARD ────────────────────────────────────────────────────────
function QuietFmtInput({ value, onChange, unit, placeholder, ariaLabel }) {
  const [focused, setFocused] = useState(false);
  return (
    <input className="quiet-input num" value={focused ? value : fmtMeasure(value, unit)} onChange={onChange} placeholder={placeholder} aria-label={ariaLabel}
      onFocus={() => setFocused(true)} onBlur={() => setFocused(false)} style={{ width: 96, textAlign: "right" }} />
  );
}
// Viewport width (resize-aware) — used only to decide how many weeks fit.
function useViewportWidth() {
  const [w, setW] = useState(() => window.innerWidth);
  useEffect(() => {
    const on = () => setW(window.innerWidth);
    window.addEventListener("resize", on);
    return () => window.removeEventListener("resize", on);
  }, []);
  return w;
}

function Scorecard({ company, onSave }) {
  // Default new measurables to the team's first/active huddle (no orphans).
  const defaultHuddleId = (company.huddles && company.huddles[0] && company.huddles[0].id) || "huddle-1";
  const [showAdd, setShowAdd] = useState(false);
  const [newM, setNewM] = useState({ name: "", target: "", unit: "", operator: "gte", owner: "", huddleId: defaultHuddleId, rollup: "sum", quarterlyGoal: "" });
  const [editingId, setEditingId] = useState(null);
  const [scorecardError, setScorecardError] = useState("");
  const measurables = company.scorecard?.measurables || [];
  const entries = company.scorecard?.entries || {};
  const wk = weekKey();
  const members = activeMembers(company);
  const huddles = company.huddles || [{ id: "huddle-1", name: "Weekly Huddle" }];
  const isMobile = useMobile();
  const viewportW = useViewportWidth();
  const [huddleFilter, setHuddleFilter] = useState("all");
  const filtered = huddleFilter === "all" ? measurables : measurables.filter(m => m.huddleId === huddleFilter);

  // Write only the measurables sub-tree, never the full scorecard — so concurrent
  // entries written by other users (data/scorecard/entries/...) are not clobbered.
  const writeMeasurables = (next) => {
    if (!_currentCompanyCode) return;
    fbUpdate(`${dataPath(_currentCompanyCode)}/scorecard`, { measurables: next })
      .catch(e => { reportWriteError(e, "Measurables save"); setScorecardError("Failed to save measurable. Please try again."); });
  };

  const addMeasurable = () => {
    if (!newM.name.trim()) return;
    const m = { id: uid(), ...newM };
    writeMeasurables([...measurables, m]);
    setNewM({ name: "", target: "", unit: "", operator: "gte", owner: "", huddleId: defaultHuddleId, rollup: "sum", quarterlyGoal: "" });
    setShowAdd(false);
  };

  const editMeasurable = (m) => {
    setNewM({ name: m.name || "", target: m.target || "", unit: m.unit || "", operator: m.operator || "gte", owner: m.owner || "", huddleId: m.huddleId || defaultHuddleId, rollup: m.rollup || "sum", quarterlyGoal: m.quarterlyGoal || "" });
    setEditingId(m.id);
    setShowAdd(true);
  };
  const saveMeasurable = () => {
    if (!newM.name.trim()) return;
    writeMeasurables(measurables.map(x => x.id === editingId ? { ...x, ...newM } : x));
    setNewM({ name: "", target: "", unit: "", operator: "gte", owner: "", huddleId: defaultHuddleId, rollup: "sum", quarterlyGoal: "" });
    setEditingId(null);
    setShowAdd(false);
  };
  const closeMeasurableModal = () => {
    setNewM({ name: "", target: "", unit: "", operator: "gte", owner: "", huddleId: defaultHuddleId, rollup: "sum", quarterlyGoal: "" });
    setEditingId(null);
    setShowAdd(false);
  };

  const setEntry = (measId, val, targetWk) => {
    const weekToWrite = targetWk || wk;
    if (_currentCompanyCode) {
      fbUpdate(`${dataPath(_currentCompanyCode)}/scorecard/entries/${weekToWrite}`, { [measId]: val })
        .catch(e => { reportWriteError(e, "Scorecard save"); setScorecardError("Failed to save scorecard entry. Please try again."); });
    }
  };

  const deleteMeasurable = (id) => {
    writeMeasurables(measurables.filter(m => m.id !== id));
  };

  // All weeks in the current quarter
  const qStart = company.quarterStart ? new Date(company.quarterStart) : new Date(Date.now() - 12 * 7 * 86400000);
  const qEnd = company.quarterEnd ? new Date(company.quarterEnd) : new Date();
  const weeks = weeksInRange(qStart, qEnd);
  // Desktop table shows a rolling window of the 9 most recent weeks ending at the
  // current week (rightmost). Display-only — `weeks` itself is never mutated and
  // cells stay keyed by their own week, so saving is unaffected.
  const curIdx = weeks.indexOf(wk);
  const weekWindow = viewportW >= 1440 ? 13 : 9;
  const visibleWeeks = curIdx >= 0
    ? weeks.slice(Math.max(0, curIdx - (weekWindow - 1)), curIdx + 1)
    : weeks.slice(-weekWindow);

  return (
    <Layout title="Scorecard" subtitle="Track your most important numbers"
      action={<button className="btn-primary" onClick={() => { setEditingId(null); setShowAdd(true); }}><Icon.plus /> Add Measurable</button>}>

      {scorecardError && <div style={{ color: C.red, background: C.redTint1, border: `1px solid ${C.redTint3}`, borderRadius: C.radius.control, padding: "8px 12px", marginBottom: 12, fontSize: C.fs.sm }}>{scorecardError}</div>}

      <div className="toolbar" style={{ justifyContent: "space-between", border: `1px solid ${C.border}`, borderRadius: C.radius.card }}>
        <span style={{ fontSize: C.fs.sm, color: C.textMuted }}><span className="num" style={{ color: C.text }}>{filtered.length}</span> measurable{filtered.length === 1 ? "" : "s"}{!isMobile && <> · last <span className="num" style={{ color: C.text }}>{visibleWeeks.length}</span> weeks</>}</span>
        <select value={huddleFilter} onChange={e => setHuddleFilter(e.target.value)}
          style={{ fontSize: C.fs.sm }}>
          <option value="all">All Huddles</option>
          {huddles.map(h => <option key={h.id} value={h.id}>{h.name}</option>)}
        </select>
      </div>

      {filtered.length === 0 ? (
        <div className="card">
          <div className="empty-state">
            <div style={{ fontSize: C.fs.base }}>{measurables.length === 0 ? "No measurables yet. Add the numbers that matter most to your business." : "No measurables for this huddle."}</div>
            {measurables.length === 0 && <button className="btn-primary" style={{ marginTop: 16 }} onClick={() => setShowAdd(true)}>Add Your First Measurable</button>}
          </div>
        </div>
      ) : (
        <>
          {!isMobile && (
        <div className="panel" style={{ overflow: "hidden" }}>
          <div className="dt-wrap sc-wrap">
            <table className="dt sc-table">
              <thead>
                <tr>
                  <th className="sc-name">Measurable</th>
                  <th>Responsible</th>
                  <th className="r">Goal</th>
                  {visibleWeeks.map(w => <th key={w} className="num r" style={{ paddingRight: 12, background: w === wk ? C.selBg : undefined, boxShadow: w === wk ? `inset 2px 0 0 ${C.selBorder}` : undefined, color: w === wk ? C.link : undefined }}>{w.split("-W")[1] ? `W${w.split("-W")[1]}` : w}</th>)}
                  <th>Huddle</th>
                  <th className="r">Qtr goal</th>
                  <th>Calc</th>
                  <th className="shrink" aria-label="Actions"></th>
                </tr>
              </thead>
              <tbody>
                {filtered.map(m => (
                  <tr key={m.id}>
                    <td className="sc-name" title={m.name}><span style={{ fontWeight: 600, display: "block", whiteSpace: (m.name || "").length > 40 ? "normal" : "nowrap", overflow: "hidden", textOverflow: "ellipsis" }}>{m.name}</span></td>
                    <td>
                      <select className="quiet-select" aria-label={`Responsible for ${m.name}`} value={m.owner || ""} onChange={e => {
                        writeMeasurables(measurables.map(x => x.id === m.id ? { ...x, owner: e.target.value } : x));
                      }}>
                        <option value="">Unassigned</option>
                        {members.map(mem => <option key={mem.id} value={mem.name}>{mem.name}</option>)}
                      </select>
                    </td>
                    <td className="r num muted" style={{ whiteSpace: "nowrap" }}>
                      {m.operator && m.operator !== "gte" ? {gte:"≥",lte:"≤",gt:">",lt:"<",eq:"="}[m.operator] : "≥"} {fmtMeasure(m.target, m.unit)}
                    </td>
                    {visibleWeeks.map(w => {
                      const val = entries[w]?.[m.id] ?? "";
                      const isCurrentWeek = w === wk;
                      const checkTarget = (val, m) => {
                      if (!val || !m.target) return null;
                      const v = parseFloat(val), t = parseFloat(m.target);
                      if (isNaN(v) || isNaN(t)) return null;
                      const op = m.operator || "gte";
                      if (op === "gte") return v >= t;
                      if (op === "lte") return v <= t;
                      if (op === "gt")  return v > t;
                      if (op === "lt")  return v < t;
                      if (op === "eq")  return v === t;
                      return null;
                    };
                    const onTarget = checkTarget(val, m);
                      return (
                        <td key={w} className="sc-cell" style={{ background: isCurrentWeek ? C.selBg : "transparent", boxShadow: isCurrentWeek ? `inset 2px 0 0 ${C.selBorder}` : undefined }}>
                          <ScorecardCell
                            value={val}
                            onCommit={(v) => setEntry(m.id, v, w)}
                            placeholder="—"
                            format={(v) => fmtMeasure(v, m.unit, true)}
                            className="sc-input"
                            style={{ fontWeight: val ? 600 : 400,
                              background: onTarget === true ? C.greenTint : onTarget === false ? C.redTint1 : "transparent",
                              color: val ? (onTarget === true ? C.green : onTarget === false ? C.red : C.text) : C.textDim }}
                          />
                        </td>
                      );
                    })}
                    <td>
                      <select className="quiet-select" aria-label={`Huddle for ${m.name}`} value={m.huddleId || ""} onChange={e => writeMeasurables(measurables.map(x => x.id === m.id ? { ...x, huddleId: e.target.value } : x))}
                        style={{ color: C.textMuted, maxWidth: 170 }}>
                        <option value="">No Huddle</option>
                        {huddles.map(h => <option key={h.id} value={h.id}>{h.name}</option>)}
                      </select>
                    </td>
                    <td className="r">
                      <QuietFmtInput value={m.quarterlyGoal || ""} unit={m.unit} placeholder="—" ariaLabel={`Quarterly goal for ${m.name}`}
                        onChange={e => writeMeasurables(measurables.map(x => x.id === m.id ? { ...x, quarterlyGoal: e.target.value } : x))} />
                    </td>
                    <td>
                      <select className="quiet-select" aria-label={`Calculation for ${m.name}`} value={m.rollup || "sum"} onChange={e => writeMeasurables(measurables.map(x => x.id === m.id ? { ...x, rollup: e.target.value } : x))}
                        style={{ color: C.textMuted }}>
                        <option value="sum">Sum</option>
                        <option value="avg">Average</option>
                        <option value="latest">Latest</option>
                      </select>
                    </td>
                    <td className="shrink">
                      <div style={{ display: "flex", gap: 2 }}>
                        <button className="icon-btn" title="Edit" aria-label={`Edit ${m.name}`} onClick={() => editMeasurable(m)}><Icon.edit /></button>
                        <button className="icon-btn danger" title="Delete" aria-label={`Delete ${m.name}`} onClick={() => deleteMeasurable(m.id)}><Icon.trash /></button>
                      </div>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        </div>
          )}
          {isMobile && (
            <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
              {filtered.map(m => (
                <div key={m.id} className="card">
                  <div style={{ fontWeight: 600, fontSize: C.fs.md }}>
                    {m.name}{m.unit && <span style={{ color: C.textMuted, fontSize: C.fs.xs, marginLeft: 4 }}>({m.unit})</span>}
                  </div>
                  <div style={{ color: C.textMuted, fontSize: C.fs.sm, marginTop: 4 }}>
                    Target: {m.operator && m.operator !== "gte" ? {gte:"≥",lte:"≤",gt:">",lt:"<",eq:"="}[m.operator] : "≥"} <span className="num">{m.target}</span>{m.unit ? ` ${m.unit}` : ""}
                  </div>
                  <div style={{ color: C.textMuted, fontSize: C.fs.sm, marginTop: 4 }}>
                    Responsible: {m.owner || "Unassigned"}
                  </div>
                  <div style={{ marginTop: 12, display: "flex", flexDirection: "column", gap: 8 }}>
                    {weeks.slice(-6).reverse().map(w => {
                      const val = entries[w]?.[m.id] ?? "";
                      const isCurrentWeek = w === wk;
                      const checkTarget = (val, m) => {
                      if (!val || !m.target) return null;
                      const v = parseFloat(val), t = parseFloat(m.target);
                      if (isNaN(v) || isNaN(t)) return null;
                      const op = m.operator || "gte";
                      if (op === "gte") return v >= t;
                      if (op === "lte") return v <= t;
                      if (op === "gt")  return v > t;
                      if (op === "lt")  return v < t;
                      if (op === "eq")  return v === t;
                      return null;
                    };
                    const onTarget = checkTarget(val, m);
                      return (
                        <div key={w} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, padding: "6px 0", borderTop: `1px solid ${C.border}` }}>
                          <span style={{ fontSize: C.fs.sm, fontWeight: isCurrentWeek ? 600 : 600, color: isCurrentWeek ? C.text : C.textMuted }}>
                            {w.split("-W")[1] ? `W${w.split("-W")[1]}` : w}
                            {isCurrentWeek && <span style={{ fontSize: C.fs.xs, marginLeft: 6, color: C.textMuted }}>This week</span>}
                          </span>
                          <ScorecardCell
                            value={val}
                            onCommit={(v) => setEntry(m.id, v, w)}
                            placeholder="—"
                            style={{ width: 90, textAlign: "center", padding: "8px 8px", fontSize: C.fs.base, fontWeight: val ? 600 : 400,
                              border: `1px solid ${isCurrentWeek ? C.borderStrong : C.border}`,
                              borderRadius: C.radius.control, background: onTarget === true ? C.greenTint : onTarget === false ? C.redTint1 : C.surface2,
                              color: val ? (onTarget === true ? C.green : onTarget === false ? C.red : C.text) : C.textDim,
                              fontFamily: C.fontMono, fontVariantNumeric: "tabular-nums" }}
                          />
                        </div>
                      );
                    })}
                  </div>
                  <div style={{ marginTop: 12, display: "flex", gap: 8 }}>
                    <button className="btn-secondary" style={{ flex: 1 }} onClick={() => editMeasurable(m)}>Edit</button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </>
      )}

      {showAdd && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && closeMeasurableModal()}>
          <div className="modal">
            <h3 style={{ fontSize: C.fs.title, marginBottom: 20 }}>{editingId ? "Edit Measurable" : "Add Measurable"}</h3>
            <div className="field">
              <label className="label">Measurable Name</label>
              <input placeholder="e.g. Revenue, Closed Jobs, NPS Score..." value={newM.name} onChange={e => setNewM(m => ({ ...m, name: e.target.value }))} autoFocus />
            </div>
            <div className="field">
              <label className="label">Weekly Target</label>
              <div style={{ display: "flex", gap: 8 }}>
                <select value={newM.operator || "gte"} onChange={e => setNewM(m => ({ ...m, operator: e.target.value }))}
                  style={{ width: 160, flexShrink: 0 }}>
                  <option value="gte">≥ (at least)</option>
                  <option value="lte">≤ (at most)</option>
                  <option value="gt">&gt; (more than)</option>
                  <option value="lt">&lt; (less than)</option>
                  <option value="eq">= (exactly)</option>
                </select>
                <input placeholder="e.g. 50000" value={newM.target} onChange={e => setNewM(m => ({ ...m, target: e.target.value }))} style={{ flex: 1 }} />
                <input placeholder="unit ($, jobs, %)" value={newM.unit} onChange={e => setNewM(m => ({ ...m, unit: e.target.value }))} style={{ width: 110, flexShrink: 0 }} />
              </div>
              <div style={{ fontSize: C.fs.xs, color: C.textMuted, marginTop: 4 }}>
                e.g. <strong>≥ 50000 $</strong> for revenue, <strong>≤ 1000 $</strong> for fuel costs
              </div>
            </div>
            <div className="field">
              <label className="label">Quarter Roll-Up</label>
              <select value={newM.rollup || "sum"} onChange={e => setNewM(m => ({ ...m, rollup: e.target.value }))}>
                <option value="sum">Sum (add weeks up)</option>
                <option value="avg">Average</option>
                <option value="latest">Latest week</option>
              </select>
            </div>
            <div className="field">
              <label className="label">Quarterly Goal (optional)</label>
              <input placeholder="Leave blank to auto-calculate" value={newM.quarterlyGoal || ""} onChange={e => setNewM(m => ({ ...m, quarterlyGoal: e.target.value }))} />
            </div>
            <div className="field">
              <label className="label">Who's Responsible</label>
              <select value={newM.owner} onChange={e => setNewM(m => ({ ...m, owner: e.target.value }))}>
                <option value="">Unassigned</option>
                {members.map(mem => <option key={mem.id} value={mem.name}>{mem.name}</option>)}
              </select>
            </div>
            <div className="field">
              <label className="label">Assign to Huddle</label>
              <select value={newM.huddleId || ""} onChange={e => setNewM(m => ({ ...m, huddleId: e.target.value }))}>
                <option value="">No Huddle</option>
                {huddles.map(h => <option key={h.id} value={h.id}>{h.name}</option>)}
              </select>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="btn-primary" style={{ flex: 1 }} onClick={editingId ? saveMeasurable : addMeasurable}>{editingId ? "Save Changes" : "Add"}</button>
              {editingId && <button className="btn-danger" onClick={() => { if (window.confirm("Delete this measurable? This cannot be undone.")) { deleteMeasurable(editingId); closeMeasurableModal(); } }}>Delete</button>}
              <button className="btn-secondary" onClick={closeMeasurableModal}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </Layout>
  );
}

// ─── HEADLINES ────────────────────────────────────────────────────────
function Headlines({ company, onSave, onAdd }) {
  const isMobile = useMobile();
  // Default new items to the team's first/active huddle (no orphans).
  const defaultHuddleId = (company.huddles && company.huddles[0] && company.huddles[0].id) || "huddle-1";
  const [form, setForm] = useState({ type: "Customer", text: "", huddleId: defaultHuddleId });
  const headlines = company.headlines || [];
  const huddles = company.huddles || [{ id: "huddle-1", name: "Weekly Huddle" }];
  const [huddleFilter, setHuddleFilter] = useState("all");
  const [showReviewed, setShowReviewed] = useState(false);

  const add = () => {
    if (!form.text.trim()) return;
    const newH = { id: uid(), ...form, date: now() };
    onAdd("headlines", newH);
    setForm(f => ({ ...f, text: "" }));
  };
  const del = (id) => onSave(latest => ({ headlines: (latest.headlines || []).filter(h => h.id !== id) }));
  const markReviewed = (id) => onSave(latest => {
    const updated = (latest.headlines || []).map(h => h.id === id ? { ...h, reviewed: true, reviewedAt: now() } : h);
    const target = updated.find(h => h.id === id);
    console.debug("[VAST/headlines] Panel markReviewed", { id, matchFound: !!target, reviewedAfter: !!target?.reviewed, totalAfter: updated.length, activeAfter: updated.filter(h => !h.reviewed).length });
    return { headlines: updated };
  });
  const unmarkReviewed = (id) => onSave(latest => {
    const updated = (latest.headlines || []).map(h => h.id === id ? { ...h, reviewed: false, reviewedAt: null } : h);
    console.debug("[VAST/headlines] Panel unmarkReviewed", { id, totalAfter: updated.length, activeAfter: updated.filter(h => !h.reviewed).length });
    return { headlines: updated };
  });

  const applyHuddleFilter = (arr) => huddleFilter === "all" ? arr : arr.filter(h => h.huddleId === huddleFilter);
  const active = applyHuddleFilter(headlines.filter(h => !h.reviewed));
  const reviewed = applyHuddleFilter(headlines.filter(h => h.reviewed));
  console.debug("[VAST/headlines] Panel filter", { total: headlines.length, active: active.length, reviewed: reviewed.length, allFlags: headlines.map(h => ({ id: h.id, text: h.text, reviewed: !!h.reviewed, huddleId: h.huddleId })) });

  const huddleNameOf = (id) => huddles.find(x => x.id === id)?.name || "";
  const HeadlineRow = ({ h, isReviewed }) => (
    <div className="lrow" style={{ opacity: isReviewed ? 0.75 : 1 }}>
      <span className="chip lchip" style={{ minWidth: 80, justifyContent: "center" }}>{h.type}</span>
      <span className="lmeta lhuddle" title={huddleNameOf(h.huddleId)}>{huddleNameOf(h.huddleId) || "—"}</span>
      <span className="grow" style={{ textDecoration: isReviewed ? "line-through" : "none" }}>{h.text}</span>
      {isReviewed && <span className="lmeta">{h.reviewedAt ? <>Reviewed <span className="num">{dateStr(new Date(h.reviewedAt))}</span></> : "Reviewed"}</span>}
      <span className="lmeta num ldate">{dateStr(new Date(h.date))}</span>
      <span className="lact">
        {!isReviewed && (
          <button className="btn-secondary lbtn" onClick={() => markReviewed(h.id)}><Icon.check /> Reviewed</button>
        )}
        {isReviewed && (
          <button className="btn-secondary lbtn" onClick={() => unmarkReviewed(h.id)}>Reopen</button>
        )}
        <button className="icon-btn danger" title="Delete" aria-label={`Delete headline: ${h.text}`} onClick={() => del(h.id)}><Icon.trash /></button>
      </span>
    </div>
  );

  return (
    <Layout title="Headlines" subtitle="Customer & Employee news from the week">
      <div>
        <div className="panel addbar" style={{ marginBottom: 12 }}>
          <select aria-label="Headline type" value={form.type} onChange={e => setForm(f => ({ ...f, type: e.target.value }))} style={{ width: 130 }}>
            <option>Customer</option><option>Employee</option>
          </select>
          <select aria-label="Huddle" value={form.huddleId || ""} onChange={e => setForm(f => ({ ...f, huddleId: e.target.value }))} style={{ width: 170 }}>
            <option value="">No Huddle</option>
            {huddles.map(h => <option key={h.id} value={h.id}>{h.name}</option>)}
          </select>
          <input className="addbar-main" aria-label="New headline" placeholder="Add a headline — what happened this week?" value={form.text} onChange={e => setForm(f => ({ ...f, text: e.target.value }))} onKeyDown={e => e.key === "Enter" && add()} />
          <button className="btn-primary" onClick={add}><Icon.plus /> Add</button>
        </div>

        <div className="panel">
          <div className="panel-h" style={{ paddingTop: 0, paddingBottom: 0 }}>
            <div className="tabs" role="tablist" style={{ borderBottom: "none" }}>
              <button role="tab" aria-selected={!showReviewed} className={`tab ${!showReviewed ? "active" : ""}`} onClick={() => setShowReviewed(false)}>Active<span className="cnt">{active.length}</span></button>
              <button role="tab" aria-selected={showReviewed} className={`tab ${showReviewed ? "active" : ""}`} onClick={() => setShowReviewed(true)}>Reviewed<span className="cnt">{reviewed.length}</span></button>
            </div>
            <select aria-label="Filter by huddle" value={huddleFilter} onChange={e => setHuddleFilter(e.target.value)}
              style={{ fontSize: C.fs.sm, width: "auto", minWidth: 160 }}>
              <option value="all">All Huddles</option>
              {huddles.map(h => <option key={h.id} value={h.id}>{h.name}</option>)}
            </select>
          </div>
          {!showReviewed && (active.length === 0
            ? <div className="lempty">No active headlines. All caught up!</div>
            : [...active].reverse().map(h => <HeadlineRow key={h.id} h={h} isReviewed={false} />))}
          {showReviewed && (reviewed.length === 0
            ? <div className="lempty">No reviewed headlines yet.</div>
            : [...reviewed].reverse().map(h => <HeadlineRow key={h.id} h={h} isReviewed={true} />))}
        </div>
      </div>
    </Layout>
  );
}

// ─── ISSUES ───────────────────────────────────────────────────────────
function Issues({ company, onSave, onAdd }) {
  const isMobile = useMobile();
  // Default new items to the team's first/active huddle (no orphans).
  const defaultHuddleId = (company.huddles && company.huddles[0] && company.huddles[0].id) || "huddle-1";
  const [showAdd, setShowAdd] = useState(false);
  const [form, setForm] = useState({ title: "", priority: "2", notes: "", huddleId: defaultHuddleId });
  const [saving, setSaving] = useState(false);
  const [savingId, setSavingId] = useState(null); // tracks which issue is being resolved/deleted
  const [issueError, setIssueError] = useState("");
  const issues = toArray(company.issues);
  const huddles = company.huddles || [{ id: "huddle-1", name: "Weekly Huddle" }];
  const [huddleFilter, setHuddleFilter] = useState("all");

  const add = async () => {
    if (!form.title.trim() || saving) return;
    setSaving(true);
    setIssueError("");
    try {
      const newIssue = { id: uid(), ...form, status: "open", createdAt: now() };
      onAdd("issues", newIssue);
      setForm({ title: "", priority: "2", notes: "", huddleId: defaultHuddleId });
      setShowAdd(false);
    } catch (e) {
      console.error("[VAST] Failed to add issue:", e);
      setIssueError("Something went wrong. Please try again.");
    } finally { setSaving(false); }
  };
  const resolve = async (id) => {
    if (savingId) return;
    setSavingId(id);
    try {
      onSave(latest => {
        const updated = (latest.issues || []).map(i => i.id === id ? { ...i, status: "resolved", resolvedAt: now() } : i);
        const target = updated.find(i => i.id === id);
        console.debug("[VAST/issues] Issues panel resolve()", { id, matchFound: !!target, matchedStatus: target?.status, totalAfter: updated.length, openAfter: updated.filter(i => i.status !== "resolved").length });
        return { issues: updated };
      });
    } catch (e) {
      console.error("[VAST] Failed to resolve issue:", e);
      setIssueError("Something went wrong. Please try again.");
    } finally { setSavingId(null); }
  };
  const del = async (id) => {
    if (savingId) return;
    setSavingId(id);
    try {
      onSave(latest => ({ issues: (latest.issues || []).filter(i => i.id !== id) }));
    } catch (e) {
      console.error("[VAST] Failed to delete issue:", e);
      setIssueError("Something went wrong. Please try again.");
    } finally { setSavingId(null); }
  };

  const allOpen = issues.filter(i => i.status !== "resolved");
  const allResolved = issues.filter(i => i.status === "resolved");
  // eslint-disable-next-line no-console
  console.debug("[VAST/issues] Issues panel filter", { total: issues.length, open: allOpen.length, resolved: allResolved.length, allStatuses: issues.map(i => ({ id: i.id, title: i.title, status: i.status, huddleId: i.huddleId })) });
  const open = (huddleFilter === "all" ? allOpen : allOpen.filter(i => i.huddleId === huddleFilter)).sort((a, b) => a.priority - b.priority);
  const resolved = huddleFilter === "all" ? allResolved : allResolved.filter(i => i.huddleId === huddleFilter);
  const [issueTab, setIssueTab] = useState("open");
  const huddleNameOf = (id) => huddles.find(x => x.id === id)?.name || "";

  return (
    <Layout title="Issues" subtitle="Identify, Discuss & Solve"
      action={<button className="btn-primary" onClick={() => setShowAdd(true)}><Icon.plus /> Add Issue</button>}>

      <div>
        {issueError && <div style={{ color: C.red, background: C.redTint1, border: `1px solid ${C.redTint3}`, borderRadius: C.radius.control, padding: "8px 12px", marginBottom: 12, fontSize: C.fs.sm }}>{issueError}</div>}
        <div className="panel">
          <div className="panel-h" style={{ paddingTop: 0, paddingBottom: 0 }}>
            <div className="tabs" role="tablist" style={{ borderBottom: "none" }}>
              <button role="tab" aria-selected={issueTab === "open"} className={`tab ${issueTab === "open" ? "active" : ""}`} onClick={() => setIssueTab("open")}>Open<span className="cnt">{open.length}</span></button>
              <button role="tab" aria-selected={issueTab === "resolved"} className={`tab ${issueTab === "resolved" ? "active" : ""}`} onClick={() => setIssueTab("resolved")}>Resolved<span className="cnt">{resolved.length}</span></button>
            </div>
            <select aria-label="Filter by huddle" value={huddleFilter} onChange={e => setHuddleFilter(e.target.value)}
              style={{ fontSize: C.fs.sm, width: "auto", minWidth: 160 }}>
              <option value="all">All Huddles</option>
              {huddles.map(h => <option key={h.id} value={h.id}>{h.name}</option>)}
            </select>
          </div>
          {issueTab === "open" && (open.length === 0 ? <div className="lempty">No open issues.</div> : open.map(iss => (
            <div key={iss.id} className="lrow">
              <span className="chip lchip" title={`Priority ${iss.priority}`} style={{ fontWeight: 600, color: iss.priority == 1 ? C.text : C.textMuted, minWidth: 36, justifyContent: "center" }}>P{iss.priority}</span>
              <span className="lmeta lhuddle" title={huddleNameOf(iss.huddleId)}>{huddleNameOf(iss.huddleId) || "—"}</span>
              <span className="grow"><span style={{ fontWeight: 600 }}>{iss.title}</span>{iss.notes && <span style={{ color: C.textMuted, fontSize: C.fs.sm }}> — {iss.notes}</span>}</span>
              <span className="lmeta num ldate">{dateStr(new Date(iss.createdAt))}</span>
              <span className="lact">
                <button className="btn-secondary lbtn" onClick={() => resolve(iss.id)} disabled={savingId === iss.id}>{savingId === iss.id ? "Saving…" : <><Icon.check /> Resolve</>}</button>
                <button className="icon-btn danger" title="Delete" aria-label={`Delete issue: ${iss.title}`} onClick={() => del(iss.id)} disabled={savingId === iss.id}><Icon.trash /></button>
              </span>
            </div>
          )))}
          {issueTab === "resolved" && (resolved.length === 0 ? <div className="lempty">No resolved issues yet.</div> : [...resolved].reverse().map(iss => (
            <div key={iss.id} className="lrow" style={{ opacity: 0.75 }}>
              <span className="chip lchip" style={{ minWidth: 36, justifyContent: "center" }}>P{iss.priority}</span>
              <span className="lmeta lhuddle" title={huddleNameOf(iss.huddleId)}>{huddleNameOf(iss.huddleId) || "—"}</span>
              <span className="grow" style={{ textDecoration: "line-through", color: C.textMuted }}>{iss.title}</span>
              <span className="lmeta num ldate">{iss.createdAt ? dateStr(new Date(iss.createdAt)) : "—"}</span>
            </div>
          )))}
        </div>
      </div>

      {showAdd && (
        <div className="modal-overlay" onClick={e => e.target === e.currentTarget && setShowAdd(false)}>
          <div className="modal">
            <h3 style={{ fontSize: C.fs.title, marginBottom: 20 }}>Add Issue</h3>
            <div className="field">
              <label className="label">Issue</label>
              <input placeholder="Describe the issue..." value={form.title} onChange={e => setForm(f => ({ ...f, title: e.target.value }))} autoFocus />
            </div>
            <div className="field">
              <label className="label">Priority</label>
              <select value={form.priority} onChange={e => setForm(f => ({ ...f, priority: e.target.value }))}>
                <option value="1">1 — Critical</option>
                <option value="2">2 — Important</option>
                <option value="3">3 — Minor</option>
              </select>
            </div>
            <div className="field">
              <label className="label">Notes (optional)</label>
              <textarea placeholder="Additional context..." value={form.notes} onChange={e => setForm(f => ({ ...f, notes: e.target.value }))} />
            </div>
            <div className="field">
              <label className="label">Assign to Huddle</label>
              <select value={form.huddleId || ""} onChange={e => setForm(f => ({ ...f, huddleId: e.target.value }))}>
                <option value="">No Huddle</option>
                {huddles.map(h => <option key={h.id} value={h.id}>{h.name}</option>)}
              </select>
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="btn-primary" style={{ flex: 1 }} onClick={add} disabled={saving}>{saving ? "Adding…" : "Add Issue"}</button>
              <button className="btn-secondary" style={{ flex: 1 }} onClick={() => setShowAdd(false)}>Cancel</button>
            </div>
          </div>
        </div>
      )}
    </Layout>
  );
}

// ─── TO-DOS ───────────────────────────────────────────────────────────
function Todos({ company, onSave, onAdd }) {
  const isMobile = useMobile();
  // Default new items to the team's first/active huddle (no orphans).
  const defaultHuddleId = (company.huddles && company.huddles[0] && company.huddles[0].id) || "huddle-1";
  const todoDueDefault = () => new Date(Date.now() + 7 * 86400000).toISOString().slice(0,10);
  const [form, setForm] = useState({ title: "", assignees: [], dueDate: todoDueDefault(), huddleId: defaultHuddleId });
  const [editId, setEditId] = useState(null);
  const [editFields, setEditFields] = useState({});
  const todos = company.todos || [];
  const huddles = company.huddles || [{ id: "huddle-1", name: "Weekly Huddle" }];
  const [huddleFilter, setHuddleFilter] = useState("all");

  const add = () => {
    if (!form.title.trim()) return;
    const newTodo = { id: uid(), title: form.title, assignees: form.assignees, dueDate: form.dueDate, huddleId: form.huddleId, done: false, createdAt: now() };
    onAdd("todos", newTodo);
    setForm({ title: "", assignees: [], dueDate: todoDueDefault(), huddleId: form.huddleId });
  };
  // Ticking saves completedAt; un-ticking clears it (null removes the field in Firebase).
  const toggle = (id) => onSave(latest => ({ todos: (latest.todos || []).map(t => t.id === id ? { ...t, done: !t.done, completedAt: !t.done ? now() : null } : t) }));
  const del = (id) => onSave(latest => ({ todos: (latest.todos || []).filter(t => t.id !== id) }));

  const startEdit = (t) => {
    setEditId(t.id);
    setEditFields({ title: t.title, dueDate: t.dueDate || "", huddleId: t.huddleId || "", assignees: getAssignees(t) });
  };
  const saveEdit = (id) => {
    onSave(latest => ({ todos: (latest.todos || []).map(t => t.id === id ? { ...t, ...editFields } : t) }));
    setEditId(null);
  };
  const cancelEdit = () => setEditId(null);

  const allPending = todos.filter(t => !t.done);
  const allDone = todos.filter(t => t.done);
  const pending = huddleFilter === "all" ? allPending : allPending.filter(t => t.huddleId === huddleFilter);
  const done = huddleFilter === "all" ? allDone : allDone.filter(t => t.huddleId === huddleFilter);
  const [todoTab, setTodoTab] = useState("open");

  const TodoRow = ({ t }) => {
    const isOverdue = t.dueDate && new Date(t.dueDate) < new Date();
    const huddleName = huddles.find(h => h.id === t.huddleId)?.name;
    const isEditing = editId === t.id;

    if (isEditing) {
      return (
        <div style={{ padding: "12px", borderBottom: `1px solid ${C.border}`, background: C.selBg }}>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap", marginBottom: 8 }}>
            <input
              value={editFields.title}
              onChange={e => setEditFields(f => ({ ...f, title: e.target.value }))}
              style={{ flex: 2, minWidth: 180 }}
              autoFocus
            />
            <input
              type="date"
              value={editFields.dueDate}
              onChange={e => setEditFields(f => ({ ...f, dueDate: e.target.value }))}
              style={{ flex: 1, minWidth: 130 }}
            />
            <select
              value={editFields.huddleId}
              onChange={e => setEditFields(f => ({ ...f, huddleId: e.target.value }))}
              style={{ flex: 1, minWidth: 140 }}
            >
              <option value="">No Huddle</option>
              {huddles.map(h => <option key={h.id} value={h.id}>{h.name}</option>)}
            </select>
          </div>
          {activeMembers(company).length > 0 && (
            <div style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center", marginBottom: 8 }}>
              <span style={{ fontSize: C.fs.xs, color: C.textMuted, marginRight: 4 }}>Assign to:</span>
              {activeMembers(company).map(m => {
                const sel = (editFields.assignees || []).includes(m.name);
                return (
                  <button key={m.id}
                    onClick={() => setEditFields(f => ({ ...f, assignees: sel ? f.assignees.filter(a => a !== m.name) : [...(f.assignees || []), m.name] }))}
                    style={{ padding: "4px 12px", borderRadius: C.radius.control, fontSize: C.fs.xs, fontWeight: 600, cursor: "pointer", fontFamily: C.fontUI, transition: "all 0.15s",
                      background: sel ? C.selBg : C.surface2,
                      color: sel ? C.text : C.textMuted,
                      border: `1px solid ${sel ? C.selBorder : C.border}` }}>
                    {sel && <Icon.check />}{m.name}
                  </button>
                );
              })}
              <button onClick={() => {
                const allNames = activeMembers(company).map(m => m.name);
                const allSel = allNames.every(n => (editFields.assignees || []).includes(n));
                setEditFields(f => ({ ...f, assignees: allSel ? [] : allNames }));
              }} style={{ padding: "4px 12px", borderRadius: C.radius.control, fontSize: C.fs.xs, fontWeight: 600, cursor: "pointer", fontFamily: C.fontUI, background: C.surface2, color: C.textMuted, border: `1px solid ${C.border}` }}>
                {activeMembers(company).every(m => (editFields.assignees || []).includes(m.name)) && <Icon.check />}Everyone
              </button>
            </div>
          )}
          <div style={{ display: "flex", gap: 8 }}>
            <button className="btn-primary" style={{ padding: "6px 16px", fontSize: C.fs.xs }} onClick={() => saveEdit(t.id)}>Save</button>
            <button className="btn-ghost" style={{ padding: "6px 12px", fontSize: C.fs.xs }} onClick={cancelEdit}>Cancel</button>
          </div>
        </div>
      );
    }

    return (
      <div className="lrow keep-order">
        <div className={`checkbox ${t.done ? "checked" : ""}`} role="checkbox" aria-checked={!!t.done} aria-label={`Mark done: ${t.title}`} onClick={() => toggle(t.id)}>{t.done && <Icon.check />}</div>
        <span className="grow" style={{ fontWeight: 500 }}>{t.title}</span>
        <span className="lmeta lowner" title={getAssignees(t).join(", ")}>{getAssignees(t).join(", ") || "—"}</span>
        <span className="lmeta num ldate wide" style={{ color: isOverdue ? C.red : undefined, fontWeight: isOverdue ? 600 : 400 }}>{t.dueDate ? <>{isOverdue ? "Overdue " : ""}{dateStr(new Date(t.dueDate))}</> : "—"}</span>
        <span className="lmeta lhuddle" title={huddleName || ""}>{huddleName || "—"}</span>
        <span className="lact">
          <button className="icon-btn" title="Edit" aria-label={`Edit to-do: ${t.title}`} onClick={() => startEdit(t)}><Icon.edit /></button>
          <button className="icon-btn danger" title="Delete" aria-label={`Delete to-do: ${t.title}`} onClick={() => del(t.id)}><Icon.trash /></button>
        </span>
      </div>
    );
  };

  return (
    <Layout title="To-Dos" subtitle="Weekly action items">
      <div>
        <div className="panel addbar" style={{ marginBottom: 12 }}>
          <input className="addbar-main" aria-label="New to-do" placeholder="Add a to-do — what needs to happen?" value={form.title} onChange={e => setForm(f => ({ ...f, title: e.target.value }))} onKeyDown={e => e.key === "Enter" && add()} />
          <input type="date" aria-label="Due date" value={form.dueDate} onChange={e => setForm(f => ({ ...f, dueDate: e.target.value }))} style={{ width: 150 }} />
          <select aria-label="Huddle" value={form.huddleId || ""} onChange={e => setForm(f => ({ ...f, huddleId: e.target.value }))} style={{ width: 170 }}>
            <option value="">No Huddle</option>
            {huddles.map(h => <option key={h.id} value={h.id}>{h.name}</option>)}
          </select>
          {activeMembers(company).length > 0 && (
            <div className="addbar-people" style={{ display: "flex", flexWrap: "wrap", gap: 6, alignItems: "center" }}>
              <span style={{ fontSize: C.fs.xs, color: C.textMuted }}>Assign to:</span>
              {activeMembers(company).map(m => {
                const sel = (form.assignees || []).includes(m.name);
                return (
                  <button key={m.id} onClick={() => setForm(f => ({ ...f, assignees: sel ? f.assignees.filter(a => a !== m.name) : [...(f.assignees||[]), m.name] }))}
                    style={{ padding: "4px 10px", borderRadius: C.radius.control, fontSize: C.fs.xs, fontWeight: 600, cursor: "pointer", fontFamily: C.fontUI, transition: "all 0.15s",
                      background: sel ? C.selBg : C.surface2,
                      color: sel ? C.text : C.textMuted,
                      border: `1px solid ${sel ? C.selBorder : C.border}` }}>
                    {sel && <Icon.check />}{m.name}
                  </button>
                );
              })}
              <button onClick={() => {
                const allNames = activeMembers(company).map(m => m.name);
                const allSel = allNames.every(n => (form.assignees||[]).includes(n));
                setForm(f => ({ ...f, assignees: allSel ? [] : allNames }));
              }} style={{ padding: "4px 10px", borderRadius: C.radius.control, fontSize: C.fs.xs, fontWeight: 600, cursor: "pointer", fontFamily: C.fontUI, background: C.surface2, color: C.textMuted, border: `1px solid ${C.border}` }}>
                {activeMembers(company).every(m => (form.assignees||[]).includes(m.name)) && <Icon.check />}Everyone
              </button>
            </div>
          )}
          <button className="btn-primary" onClick={add}><Icon.plus /> Add</button>
        </div>

        <div className="panel">
          <div className="panel-h" style={{ paddingTop: 0, paddingBottom: 0 }}>
            <div className="tabs" role="tablist" style={{ borderBottom: "none" }}>
              <button role="tab" aria-selected={todoTab === "open"} className={`tab ${todoTab === "open" ? "active" : ""}`} onClick={() => setTodoTab("open")}>Open<span className="cnt">{pending.length}</span></button>
              <button role="tab" aria-selected={todoTab === "done"} className={`tab ${todoTab === "done" ? "active" : ""}`} onClick={() => setTodoTab("done")}>Done<span className="cnt">{done.length}</span></button>
            </div>
            <select aria-label="Filter by huddle" value={huddleFilter} onChange={e => setHuddleFilter(e.target.value)}
              style={{ fontSize: C.fs.sm, width: "auto", minWidth: 160 }}>
              <option value="all">All Huddles</option>
              {huddles.map(h => <option key={h.id} value={h.id}>{h.name}</option>)}
            </select>
          </div>
          {todoTab === "open" && (pending.length === 0
            ? <div className="lempty">No open to-dos{huddleFilter !== "all" ? " for this huddle" : ""}.</div>
            : pending.map(t => <TodoRow key={t.id} t={t} />))}
          {todoTab === "done" && (done.length === 0 ? <div className="lempty">No completed to-dos yet.</div> : [...done].reverse().map(t => (
            <div key={t.id} className="lrow keep-order" style={{ opacity: 0.75 }}>
              <div className="checkbox checked" aria-label="Done"><Icon.check /></div>
              <span className="grow" style={{ textDecoration: "line-through", color: C.textMuted }}>{t.title}</span>
              <span className="lmeta lowner">{getAssignees(t).join(", ") || "—"}</span>
              <span className="lmeta lhuddle">{huddles.find(h => h.id === t.huddleId)?.name || "—"}</span>
              <span className="lact">
                <button className="icon-btn danger" title="Delete" aria-label={`Delete to-do: ${t.title}`} onClick={() => del(t.id)}><Icon.trash /></button>
              </span>
            </div>
          )))}
        </div>
      </div>
    </Layout>
  );
}

// ─── ORG CHART ────────────────────────────────────────────────────────
function PreviewBox({ label, name, note, color }) {
  color = color || C.text;
  return (
    <div style={{ background: C.surface, border: `2px solid ${color}`, borderRadius: C.radius.control, padding: "8px 12px", minWidth: 140, maxWidth: 200, flexShrink: 0 }}>
      <div style={{ fontFamily: C.fontUI, fontSize: C.fs.base, fontWeight: 600, color, marginBottom: 4 }}>{label}</div>
      {name && <div style={{ fontSize: C.fs.sm, fontWeight: 600, marginBottom: 4 }}>{name}</div>}
      {note && <div style={{ fontSize: C.fs.xs, color: C.textMuted, lineHeight: 1.4 }}>{note}</div>}
    </div>
  );
}

const DEFAULT_CHART_LEADERS = [
  { id: "l1", title: "Dreamer (Visionary)", name: "", responsibilities: "Big Ideas, Strategic Thinking, Culture, R&D" },
  { id: "l2", title: "Doer (Integrator)", name: "", responsibilities: "Fulfillment, Business Plan, Lead, Bridge Building" },
];
const DEFAULT_CHART_DEPTS = [
  { id: "d1", label: "Sales / Marketing", color: "blue",   staff: [] },
  { id: "d2", label: "Operations",        color: "yellow", staff: [] },
  { id: "d3", label: "Finance",           color: "green",  staff: [] },
];
const DEPT_COLORS = ["blue","yellow","green","red","purple"];
const deptColor = (c) => ({ blue: C.blue, yellow: C.yellow, green: C.green, red: C.red, purple: C.purple })[c] || C.blue;

function migrateChart(raw) {
  // Migrate old dreamer/doer/salesRoles etc. format to new leaders/departments format
  if (raw.leaders) return raw; // already migrated
  const leaders = [
    { id: "l1", title: "Dreamer (Visionary)", name: raw.dreamer || "", responsibilities: "Big Ideas, Strategic Thinking, Culture, R&D" },
    { id: "l2", title: "Doer (Integrator)",   name: raw.doer   || "", responsibilities: "Fulfillment, Business Plan, Lead, Bridge Building" },
  ];
  const deptMap = [
    { id: "d1", label: "Sales / Marketing", color: "blue",   key: "salesRoles" },
    { id: "d2", label: "Operations",        color: "yellow", key: "opsRoles" },
    { id: "d3", label: "Finance",           color: "green",  key: "financeRoles" },
  ];
  const departments = deptMap.map(d => ({
    id: d.id, label: d.label, color: d.color,
    staff: (raw[d.key] || []).flatMap(r => r.members.map(name => ({ id: uid(), title: r.role, name }))),
  }));
  return { ...raw, leaders, departments };
}

function OrgChart({ company, onSave, orgChartId, orgChartName }) {
  const orgCharts = company.orgCharts || [{ id: "org-1", name: "Responsibility Chart" }];
  const rawObj = orgCharts.find(o => o.id === orgChartId) || orgCharts[0] || {};
  const [chart, setChart] = useState(() => migrateChart(rawObj));
  const [saved, setSaved] = useState(false);

  useEffect(() => {
    const raw = (company.orgCharts || []).find(x => x.id === orgChartId) || {};
    setChart(migrateChart(raw));
  }, [orgChartId]);

  const save = () => {
    const updated = orgCharts.map(o => o.id === orgChartId ? { ...chart, id: orgChartId, name: orgChartName } : o);
    onSave({ orgCharts: updated });
    setSaved(true); setTimeout(() => setSaved(false), 2000);
  };

  // Leaders
  const setLeader = (id, k, v) => setChart(c => ({ ...c, leaders: (c.leaders || DEFAULT_CHART_LEADERS).map(l => l.id === id ? { ...l, [k]: v } : l) }));
  const addLeader = () => setChart(c => ({ ...c, leaders: [...(c.leaders || DEFAULT_CHART_LEADERS), { id: uid(), title: "New Role", name: "", responsibilities: "" }] }));
  const removeLeader = (id) => setChart(c => ({ ...c, leaders: (c.leaders || []).filter(l => l.id !== id) }));

  // Departments
  const setDept = (id, k, v) => setChart(c => ({ ...c, departments: (c.departments || DEFAULT_CHART_DEPTS).map(d => d.id === id ? { ...d, [k]: v } : d) }));
  const addDept = () => setChart(c => ({ ...c, departments: [...(c.departments || DEFAULT_CHART_DEPTS), { id: uid(), label: "New Department", color: DEPT_COLORS[(c.departments||[]).length % DEPT_COLORS.length], headName: "", headTitle: "", staff: [] }] }));
  const removeDept = (id) => setChart(c => ({ ...c, departments: (c.departments || []).filter(d => d.id !== id) }));

  // Staff
  const addStaff = (deptId) => setChart(c => ({ ...c, departments: (c.departments||[]).map(d => d.id === deptId ? { ...d, staff: [...(d.staff||[]), { id: uid(), title: "", name: "" }] } : d) }));
  const setStaff = (deptId, staffId, k, v) => setChart(c => ({ ...c, departments: (c.departments||[]).map(d => d.id === deptId ? { ...d, staff: (d.staff||[]).map(s => s.id === staffId ? { ...s, [k]: v } : s) } : d) }));
  const removeStaff = (deptId, staffId) => setChart(c => ({ ...c, departments: (c.departments||[]).map(d => d.id === deptId ? { ...d, staff: (d.staff||[]).filter(s => s.id !== staffId) } : d) }));

  const leaders = chart.leaders || DEFAULT_CHART_LEADERS;
  const departments = chart.departments || DEFAULT_CHART_DEPTS;

  // PreviewBox defined at module level to avoid remount

  return (
    <Layout title={orgChartName} subtitle="Define roles and accountability"
      action={<button className="btn-primary" onClick={save}>{saved ? "✓ Saved" : "Save Chart"}</button>}>

      {/* ── LEADERSHIP TIER ── */}
      <div className="card" style={{ marginBottom: 16 }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
          <h3 style={{ fontSize: C.fs.md, margin: 0 }}>Leadership</h3>
          <button className="btn-secondary" style={{ fontSize: C.fs.xs, padding: "6px 12px" }} onClick={addLeader}>+ Add Role</button>
        </div>
        <div style={{ display: "flex", flexDirection: "column", gap: 12 }}>
          {leaders.map((l, i) => (
            <div key={l.id} className="grid2" style={{ display: "grid", gap: 8, alignItems: "start", padding: "12px 12px", background: C.surface2, borderRadius: C.radius.control, border: `1px solid ${C.border}` }}>
              <div className="field" style={{ margin: 0 }}>
                <label className="label">Title</label>
                <input value={l.title} onChange={e => setLeader(l.id, "title", e.target.value)} placeholder="e.g. CEO, Visionary" />
              </div>
              <div className="field" style={{ margin: 0 }}>
                <label className="label">Person</label>
                {activeMembers(company).length > 0 ? (
                  <select value={l.name} onChange={e => setLeader(l.id, "name", e.target.value)}>
                    <option value="">— Select —</option>
                    {activeMembers(company).map(m => <option key={m.id} value={m.name}>{m.name}</option>)}
                    <option value="__custom">Other...</option>
                  </select>
                ) : (
                  <input value={l.name} onChange={e => setLeader(l.id, "name", e.target.value)} placeholder="Name" />
                )}
                {l.name === "__custom" && <input style={{ marginTop: 6 }} placeholder="Enter name..." onChange={e => setLeader(l.id, "name", e.target.value)} />}
              </div>
              <div className="field" style={{ margin: 0 }}>
                <label className="label">Responsibilities</label>
                <input value={l.responsibilities} onChange={e => setLeader(l.id, "responsibilities", e.target.value)} placeholder="Key responsibilities..." />
              </div>
              {leaders.length > 1 && (
                <button className="btn-danger" style={{ padding: "6px 8px", marginTop: 20 }} onClick={() => removeLeader(l.id)}><Icon.trash /></button>
              )}
            </div>
          ))}
        </div>
      </div>

      {/* ── DEPARTMENTS ── */}
      <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 16, marginBottom: 16 }}>
        {departments.map(dept => (
          <div key={dept.id} className="card" style={{ borderTop: `3px solid ${deptColor(dept.color)}` }}>
            {/* Dept name + color + delete */}
            <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 12 }}>
              <input value={dept.label} onChange={e => setDept(dept.id, "label", e.target.value)}
                style={{ flex: 1, fontFamily: C.fontUI, fontSize: C.fs.md, fontWeight: 600, background: "transparent", border: "none", borderBottom: `1px solid ${C.border}`, color: C.text, padding: "4px 0" }} />
              <select value={dept.color} onChange={e => setDept(dept.id, "color", e.target.value)}
                style={{ width: 80, fontSize: C.fs.xs, padding: "4px 6px", background: C.surface2, border: `1px solid ${C.border}`, borderRadius: C.radius.control, color: C.text }}>
                <option value="blue">Blue</option>
                <option value="yellow">Yellow</option>
                <option value="green">Green</option>
                <option value="red">Red</option>
                <option value="purple">Purple</option>
              </select>
              <button className="btn-danger" style={{ padding: "4px 8px", fontSize: C.fs.xs }} onClick={() => removeDept(dept.id)}><Icon.trash /></button>
            </div>

            {/* Department Head */}
            <div style={{ padding: "8px 12px", marginBottom: 12, background: `${deptColor(dept.color)}18`, border: `1px solid ${deptColor(dept.color)}40`, borderRadius: C.radius.control }}>
              <div style={{ fontSize: C.fs.xs, fontWeight: 600, color: deptColor(dept.color), marginBottom: 8 }}>Department Head</div>
              <div style={{ display: "flex", gap: 8 }}>
                <input value={dept.headTitle || ""} onChange={e => setDept(dept.id, "headTitle", e.target.value)}
                  placeholder="Title (e.g. Director)" style={{ flex: 1, fontSize: C.fs.xs, padding: "6px 8px" }} />
                {activeMembers(company).length > 0 ? (
                  <select value={dept.headName || ""} onChange={e => setDept(dept.id, "headName", e.target.value)} style={{ flex: 1, fontSize: C.fs.xs, padding: "6px 8px" }}>
                    <option value="">— Select —</option>
                    {activeMembers(company).map(m => <option key={m.id} value={m.name}>{m.name}</option>)}
                  </select>
                ) : (
                  <input value={dept.headName || ""} onChange={e => setDept(dept.id, "headName", e.target.value)}
                    placeholder="Name" style={{ flex: 1, fontSize: C.fs.xs, padding: "6px 8px" }} />
                )}
              </div>
            </div>

            {/* Staff rows */}
            {(dept.staff || []).length > 0 && (
              <div style={{ fontSize: C.fs.xs, fontWeight: 600, color: C.textMuted, marginBottom: 8 }}>Staff</div>
            )}
            {(dept.staff || []).map(s => (
              <div key={s.id} style={{ display: "flex", gap: 8, marginBottom: 8, alignItems: "center" }}>
                <input value={s.title} onChange={e => setStaff(dept.id, s.id, "title", e.target.value)}
                  placeholder="Role" style={{ flex: 1, fontSize: C.fs.xs, padding: "6px 8px" }} />
                {activeMembers(company).length > 0 ? (
                  <select value={s.name} onChange={e => setStaff(dept.id, s.id, "name", e.target.value)} style={{ flex: 1, fontSize: C.fs.xs, padding: "6px 8px" }}>
                    <option value="">— Name —</option>
                    {activeMembers(company).map(m => <option key={m.id} value={m.name}>{m.name}</option>)}
                  </select>
                ) : (
                  <input value={s.name} onChange={e => setStaff(dept.id, s.id, "name", e.target.value)}
                    placeholder="Name" style={{ flex: 1, fontSize: C.fs.xs, padding: "6px 8px" }} />
                )}
                <button className="btn-ghost" style={{ padding: "4px 8px", color: C.textDim, flexShrink: 0 }} onClick={() => removeStaff(dept.id, s.id)}><Icon.trash /></button>
